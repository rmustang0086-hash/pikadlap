ding. This sharing arrangement of the site lasted until 785, when the Christian half was purchased by Abd al-Rahman I, for a hundred thousand dinars. He then demolished the church structure and built the new mosque on its site. In return, Abd al-Rahman also allowed the Christians to build or rebuild some churches outside the …","other":"มัสยิด–อาสนวิหารกอร์โดบา"}},{"th":{"title":"หอคอยแห่งลอนดอน","url":"https://th.wikipedia.org/wiki/%E0%B8%AB%E0%B8%AD%E0%B8%84%E0%B8%AD%E0%B8%A2%E0%B9%81%E0%B8%AB%E0%B9%88%E0%B8%87%E0%B8%A5%E0%B8%AD%E0%B8%99%E0%B8%94%E0%B8%AD%E0%B8%99","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ec/Tower_of_London_from_the_Shard_%288515883950%29.jpg/960px-Tower_of_London_from_the_Shard_%288515883950%29.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"หอคอยแห่งลอนดอน (อังกฤษ: Tower of London) เป็นพระราชวังหลวงและป้อมปราการตั้งอยู่บนฝั่งแม่น้ำเทมส์ในกรุงลอนดอนในอังกฤษ เป็นพระราชวังที่เดิมสร้างโดยพระเจ้าวิลเลียมที่ 1 แห่งอังกฤษ เมื่อปี ค.ศ. 1078 เป็นสถาปัตยกรรมแบบโรมาเนสก์ พระราชวังเป็นรู้จักกันในนามว่า “หอคอยแห่งลอนดอน” หรือ “หอ” ในประวัติศาสตร์ ตัวปราสาทตั้งอยู่ภายในโบโรแห่งทาวเวอร์แฮมเล็ทส์และแยกจากด้านตะวันออกของนครหลวงลอนดอน (City of London) ด้วยลานโล่งที่เรียกว่าเนินหอคอยแห่งลอนดอน หรือ “ทาวเวอร์ฮิล” (Tower Hill)\nหอคอยแห่งลอนดอนมักจะรู้จักกันในการเกี่ยวข้องกับหอขาว (White Tower) ซึ่งแต่เดิมเป็นหอสีขาวที่สร้างโดยพระเจ้าวิลเลียมที่ 1 แห่งอังกฤษในปี ค.ศ. 1078 แต่กลุ่มสิ่งก่อสร้างทั้งหมดของหอคอยแห่งลอนดอนตั้งอยู่รอบวงแหวนสองวงภายในกำแพงและคูป้องกันปราสาท\nตัวหอคอยใช้เป็นป้อม พระราชวังของพระมหากษัตริย์ และที่จำขังโดยเฉพาะสำหรับนักโทษที่มียศศักดิ์สูงเช่นสมเด็จพระราชินีนาถเอลิซาเบธที่ 1 ก็เคยทรงถูกจำขังในหอคอยโดยสมเด็จพระราชินีนาถแมรี และยังเป็นที่สำหรับประหารชีวิตและทรมาน คลังเก็บอาวุธ ท้องพระคลัง สวนสัตว์ โรงกษาปณ์หลวง หอเก็บเอกสาร หอดูดาว และตั้งแต่ปี ค.ศ.","history":"หอคอยแห่งลอนดอนก่อตั้งโดยพระเจ้าวิลเลียมที่ 1 แห่งอังกฤษในปี ค.ศ. 1078 เมื่อมีพระราชโองการให้สร้างหอขาวภายในกำแพงเมืองด้านตะวันออกเฉียงใต้บนฝั่งแม่น้ำเทมส์ การสร้างหอเป็นทั้งการป้องกันการโจมตีของชาวเมืองที่ต่อต้านชาวนอร์มันและป้องกันลอนดอนจากการรุกรานของข้าศึกจากภายนอก พระเจ้าวิลเลียมทรงสั่งให้ใช้หินจากแคนในฝรั่งเศสสร้างและทรงแต่งตั้งกันดัลฟบาทหลวงแห่งรอเชสเตอร์เป็นสถาปนิก\nในคริสต์ศตวรรษที่ 12 พระเจ้าริชาร์ดใจสิงห์ ทรงสร้างกำแพงรอบหอขาวและเริ่มการขุดคูรอบปราสาทโดยใช้น้ำจากแม่น้ำเทมส์แต่ไม่สำเร็จจนกระทั่งในรัชสมัยของพระเจ้าเฮนรีที่ 3 ในคริสต์ศตวรรษที่ 13 โดยทรงจ้างสถาปนิกชาวดัตช์ผู้เชื่ยวชาญในการขุดคู นอกจากนั้นก็ยังทรงเสริมสร้างกำแพงให้แข็งแรงขึ้นและทรงทำให้หอคอยเป็นที่ประทับสำคัญโดยทรงสร้างพระราชวังแบบที่อยู่อาศัย (palatial buildings) ภายในกำแพงหอคอย การเสริมสร้างเสร็จสิ้นในระหว่างปี ค.ศ. 1275 ถึงปี ค.ศ. 1285 โดยพระเจ้าเอ็ดเวิร์ดที่ 1 ผู้ทรงสร้างกำแพงรอบนอกและสร้างกำแพงรอบในเสร็จ ทำให้เป็นกำแพงสองชั้น และทรงถมคูเดิมและขุดคูใหม่รอบกำแพงรอบนอก หอคอยแห่งลอนดอนใช้เป็นพระราชฐานมาจนถึงพระเจ้าชาร์ลส์ที่ 1 เมื่อโอลิเวอร์ ครอมเวลล์สั่งให้รื้อส่วนที่เป็นพระราชวังทิ้ง …","other":"Tower of London"},"en":{"title":"Tower of London","url":"https://en.wikipedia.org/wiki/Tower_of_London","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ec/Tower_of_London_from_the_Shard_%288515883950%29.jpg/960px-Tower_of_London_from_the_Shard_%288515883950%29.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Tower of London, officially His Majesty\u0027s Royal Palace and Fortress of the Tower of London, is a historic citadel and castle on the north bank of the River Thames in London, England. It lies within the London Borough of Tower Hamlets, which is separated from the eastern edge of the square mile of the City of London by the open space known as Tower Hill. It was founded toward the end of 1066 as part of the Norman Conquest.","history":"Victorious at the Battle of Hastings on 14 October 1066, the invading Duke of Normandy, William the Conqueror, spent the rest of the year securing his holdings by fortifying key positions. He founded several castles along the way, but took a circuitous route toward London; only when he reached Canterbury did he turn towards England\u0027s largest city. As the fortified bridge into London was held by Saxon troops, he decided instead to ravage Southwark before continuing his journey around southern England. A series of Norman victories along the route cut the city\u0027s supply lines and in December 1066, isolated and intimidated, its leaders yielded London without a fight. Between 1066 and 1087, William established 36 castles, although references in the Domesday Book indicate that many more were founded by his subordinates. The Normans undertook what has been described as \"the most extensive and concentrated programme of castle-building in the whole history of feudal Europe\". They were multi-purpose buildings, serving as fortifications (used as a base of operations in enemy territory), centres …","other":"หอคอยแห่งลอนดอน"}},{"th":null,"en":{"title":"Glastonbury Tor","url":"https://en.wikipedia.org/wiki/Glastonbury_Tor","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d7/Glastonbury_Tor-_View_of_an_iconic_landmark_%28geograph_5500644%29.jpg/960px-Glastonbury_Tor-_View_of_an_iconic_landmark_%28geograph_5500644%29.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Glastonbury Tor is a hill near Glastonbury in the English county of Somerset, topped by the roofless tower of St Michael\u0027s Church, a Grade I listed building. The site is managed by the National Trust and has been designated a scheduled monument. The Tor is mentioned in Welsh mythology particularly in myths linked to King Arthur and the island of Avalon, and has several other enduring mythological and spiritual associations.","history":"Some Neolithic flint tools recovered from the top of the Tor show that the site has been visited, perhaps with a lasting occupation, since prehistory. The nearby remains of Glastonbury Lake Village were identified at the site in 1892, which confirmed that there was an Iron Age settlement in about 300–200 BC on what was an easily defended island in the fens. There is no evidence of permanent occupation of the Tor, but finds, including Roman pottery, do suggest that it was visited on a regular basis.\nExcavations on Glastonbury Tor, undertaken by a team led by Philip Rahtz between 1964 and 1966, revealed evidence of Dark Age occupation during the 5th to 7th centuries around the later medieval church of St. Michael. Finds included postholes, two hearths including a metalworker\u0027s forge, two burials oriented north–south (thus unlikely to be Christian), fragments of 6th-century Mediterranean amphorae (vases for wine or cooking oil), and a worn hollow bronze head which may have topped a Saxon staff.\nDuring the late Saxon and early medieval period, there were at least four buildings on the …","other":null}},{"th":{"title":"ปราสาทเอดินบะระ","url":"https://th.wikipedia.org/wiki/%E0%B8%9B%E0%B8%A3%E0%B8%B2%E0%B8%AA%E0%B8%B2%E0%B8%97%E0%B9%80%E0%B8%AD%E0%B8%94%E0%B8%B4%E0%B8%99%E0%B8%9A%E0%B8%B0%E0%B8%A3%E0%B8%B0","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c1/Edinburgh_Castle_from_the_south_east.JPG/960px-Edinburgh_Castle_from_the_south_east.JPG?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"ปราสาทเอดินบะระ (อังกฤษ: Edinburgh Castle) เป็นปราสาทสำคัญทางประวัติศาสตร์ของเมืองเอดินบะระ ในสกอตแลนด์ ตั้งอยู่บนยอดเนินเขาคาสเซิลร็อค ซึ่งเป็นที่อยู่อาศัยของมนุษย์มาตั้งแต่สมัยยุคเหล็ก แต่ที่มาในช่วงแรกนั้นยังไม่ปรากฎหลักฐานที่ชัดเจน ในอดีตนั้นได้เคยมีปราสาทที่เป็นพระราชฐานในบริเวณเดียวกันนี้ตั้งแต่รัชสมัยของพระเจ้าเดวิดในสมัยศตวรรษที่ 12 และเป็นพระราชฐานเรื่อยมาจนถึงปี ค.ศ.","history":"ปราสาทเอดินบะระ (อังกฤษ: Edinburgh Castle) เป็นปราสาทสำคัญทางประวัติศาสตร์ของเมืองเอดินบะระ ในสกอตแลนด์ ตั้งอยู่บนยอดเนินเขาคาสเซิลร็อค ซึ่งเป็นที่อยู่อาศัยของมนุษย์มาตั้งแต่สมัยยุคเหล็ก แต่ที่มาในช่วงแรกนั้นยังไม่ปรากฎหลักฐานที่ชัดเจน ในอดีตนั้นได้เคยมีปราสาทที่เป็นพระราชฐานในบริเวณเดียวกันนี้ตั้งแต่รัชสมัยของพระเจ้าเดวิดในสมัยศตวรรษที่ 12 และเป็นพระราชฐานเรื่อยมาจนถึงปี ค.ศ. 1633 \nตั้งแต่ศตวรรษที่ 15 เป็นต้นมา บทบาทของปราสาทในฐานะพระราชฐานนั้นได้เริ่มลดความสำคัญลง และในศตวรรษที่ 17 ได้กลายมาเป็นป้อมปราการทางทหารแทน โดยตัวปราสาทนั้นมีความสำคัญในฐานะมรดกสำคัญแห่งชาติสกอตแลนด์ และได้รับการยอมรับมากขึ้นตั้งแต่ต้นศตวรรษที่ 19 เรื่อยมาโดยมีโครงการบูรณะสำคัญหลายครั้งในรอบกว่า 150 ปีที่ผ่านมา\n== อ้างอิง ==","other":"Edinburgh Castle"},"en":{"title":"Edinburgh Castle","url":"https://en.wikipedia.org/wiki/Edinburgh_Castle","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/59/City_of_Edinburgh_-_Edinburgh_Castle_-_20140421004403.jpg/960px-City_of_Edinburgh_-_Edinburgh_Castle_-_20140421004403.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Edinburgh Castle (Scottish Gaelic: Caisteal Dhùn Èideann) is a historic castle in Edinburgh, Scotland. It stands on Castle Rock, which has been occupied by humans since at least the Iron Age. There has been a royal castle on the rock since the reign of Malcolm III in the 11th century, and the castle continued to be a royal residence until 1633.","history":"The castle stands upon the plug of an extinct volcano, which is estimated to have risen about 350 million years ago during the lower Carboniferous period. The Castle Rock is the remains of a volcanic pipe, which cut through the surrounding sedimentary rock before cooling to form very hard dolerite, a type of basalt. Subsequent glacial erosion was resisted by the dolerite, which protected the softer rock to the east, leaving a crag and tail formation.\nThe summit of the Castle Rock is 130 metres (430 ft) above sea level, with rocky cliffs to the south, west, and north, rising to a height of 80 metres (260 ft) above the surrounding landscape. This means that the only readily accessible route to the castle lies to the east, where the ridge slopes more gently. The defensive advantage of such a site is self-evident, but the geology of the rock also presents difficulties, since basalt is extremely impermeable. Providing water to the Upper Ward of the castle was problematic, and despite the sinking of a 34-metre (112 ft) deep well, the water supply often ran out during drought or siege, …","other":"ปราสาทเอดินบะระ"}},{"th":{"title":"นิวเกรนจ์","url":"https://th.wikipedia.org/wiki/%E0%B8%99%E0%B8%B4%E0%B8%A7%E0%B9%80%E0%B8%81%E0%B8%A3%E0%B8%99%E0%B8%88%E0%B9%8C","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5a/Newgrange.jpg/960px-Newgrange.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"นิวเกรนจ์ (อังกฤษ: Newgrange; ไอริช: Sí an Bhrú) เป็นสุสานทางเดินยุคหินใหม่ในบรูนาโบอิน บริเวณหุบเขาบอยน์ เทศมณฑลมีท ประเทศไอร์แลนด์ เป็นหนึ่งในโบราณสถานก่อนประวัติศาสตร์ที่สำคัญที่สุดของไอร์แลนด์ และเป็นส่วนหนึ่งของแหล่งมรดกโลก Brú na Bóinne – Archaeological Ensemble of the Bend of the Boyne ร่วมกับโนว์ธและดาวธ","history":"นิวเกรนจ์ (อังกฤษ: Newgrange; ไอริช: Sí an Bhrú) เป็นสุสานทางเดินยุคหินใหม่ในบรูนาโบอิน บริเวณหุบเขาบอยน์ เทศมณฑลมีท ประเทศไอร์แลนด์ เป็นหนึ่งในโบราณสถานก่อนประวัติศาสตร์ที่สำคัญที่สุดของไอร์แลนด์ และเป็นส่วนหนึ่งของแหล่งมรดกโลก Brú na Bóinne – Archaeological Ensemble of the Bend of the Boyne ร่วมกับโนว์ธและดาวธ\nนิวเกรนจ์สร้างขึ้นราว 3200 ปีก่อนคริสตกาล จึงเก่าแก่กว่าสโตนเฮนจ์และพีระมิดอียิปต์หลายแห่ง Heritage Ireland ระบุว่านิวเกรนจ์ โนว์ธ และดาวธเป็นสุสานทางเดินก่อนประวัติศาสตร์ที่มีชื่อเสียงของบรูนาโบอิน และสร้างขึ้นราว 3200 ปีก่อนคริสตกาล","other":"Newgrange"},"en":{"title":"Newgrange","url":"https://en.wikipedia.org/wiki/Newgrange","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0f/Irelands_history.jpg/960px-Irelands_history.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Newgrange (Irish: Sí an Bhrú) is a prehistoric monument in County Meath in Ireland, placed on a rise overlooking the River Boyne, eight kilometres (five miles) west of the town of Drogheda. It is an exceptionally grand passage tomb built during the Neolithic Period, around 3100 BC, making it older than Stonehenge and the Egyptian pyramids. Newgrange is the main monument in the Brú na Bóinne complex, a World Heritage Site that also includes the passage tombs of Knowth and Dowth, as well as other henges, burial mounds and standing stones.","history":"Newgrange (Irish: Sí an Bhrú) is a prehistoric monument in County Meath in Ireland, placed on a rise overlooking the River Boyne, eight kilometres (five miles) west of the town of Drogheda. It is an exceptionally grand passage tomb built during the Neolithic Period, around 3100 BC, making it older than Stonehenge and the Egyptian pyramids. Newgrange is the main monument in the Brú na Bóinne complex, a World Heritage Site that also includes the passage tombs of Knowth and Dowth, as well as other henges, burial mounds and standing stones.\nNewgrange consists of a large circular mound with an inner stone passageway and cruciform chamber. Burnt and unburnt human bones and possible grave goods or votive offerings were found in this chamber. The monument has a striking façade made mostly of white quartz cobblestones and ringed by engraved kerbstones. Many of the larger stones of Newgrange are covered in megalithic art. The mound is also ringed by a stone circle. Some of the material that makes up the monument came from as far as the Mournes and Wicklow Mountains. There is no agreement on …","other":"นิวเกรนจ์"}},{"th":{"title":"พาร์เธนอน","url":"https://th.wikipedia.org/wiki/%E0%B8%9E%E0%B8%B2%E0%B8%A3%E0%B9%8C%E0%B9%80%E0%B8%98%E0%B8%99%E0%B8%AD%E0%B8%99","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/da/The_Parthenon_in_Athens.jpg/960px-The_Parthenon_in_Athens.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"พาร์เธนอน (กรีกโบราณ: Παρθενών, อักษรโรมัน: Parthenṓn ออกเสียง: [par.tʰe.nɔ̌ːn]; กรีก: Παρθενώνας, อักษรโรมัน: Parthenónas ออกเสียง: [parθeˈnonas]) เป็นวิหารโบราณ บนอัครปุระเอเธนส์ ประเทศกรีซ สร้างเพื่ออุทิศแด่เทพีอะธีนา ซึ่งชาวเอเธนส์นับถือเป็นองค์อุปถัมภ์ของพวกเขา การก่อสร้างเริ่มต้นใน 447 ปีก่อนคริสต์ศักราช เมื่อสันนิบาตดีเลียนเรืองอำนาจ ตัววิหารสร้างเสร็จใน 432 ปีก่อนคริสต์ศักราช ถึงแม้ว่าการตกแต่งตัววิหารจะดำเนินต่อไปจนถึง 428 ปีก่อนคริสต์ศักราช ซึ่งพาร์เธนอนเป็นอาคารสำคัญที่สุดแห่งหนึ่งของกรีซสมัยคลาสสิกที่ยังคงหลงเหลือมาจนถึงปัจจุบัน นับว่าเป็นจุดสูงสุด (Zenith) ของเสาแบบดอริก","history":"พาร์เธนอน (กรีกโบราณ: Παρθενών, อักษรโรมัน: Parthenṓn ออกเสียง: [par.tʰe.nɔ̌ːn]; กรีก: Παρθενώνας, อักษรโรมัน: Parthenónas ออกเสียง: [parθeˈnonas]) เป็นวิหารโบราณ บนอัครปุระเอเธนส์ ประเทศกรีซ สร้างเพื่ออุทิศแด่เทพีอะธีนา ซึ่งชาวเอเธนส์นับถือเป็นองค์อุปถัมภ์ของพวกเขา การก่อสร้างเริ่มต้นใน 447 ปีก่อนคริสต์ศักราช เมื่อสันนิบาตดีเลียนเรืองอำนาจ ตัววิหารสร้างเสร็จใน 432 ปีก่อนคริสต์ศักราช ถึงแม้ว่าการตกแต่งตัววิหารจะดำเนินต่อไปจนถึง 428 ปีก่อนคริสต์ศักราช ซึ่งพาร์เธนอนเป็นอาคารสำคัญที่สุดแห่งหนึ่งของกรีซสมัยคลาสสิกที่ยังคงหลงเหลือมาจนถึงปัจจุบัน นับว่าเป็นจุดสูงสุด (Zenith) ของเสาแบบดอริก\nคำว่า พาร์เธนอน นั้นน่าจะมาจากประติมากรรมที่เคยตั้งอยู่ภายในวิหาร คือ Athena Parthenos ซึ่งมีความหมายว่า เมธีอันบริสุทธิ์ของธรรมชาติ","other":"Parthenon"},"en":{"title":"Parthenon","url":"https://en.wikipedia.org/wiki/Parthenon","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/da/The_Parthenon_in_Athens.jpg/960px-The_Parthenon_in_Athens.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Parthenon (; Ancient Greek: Παρθενών, romanised: Parthenōn [par.tʰe.nɔ̌ːn]; Greek: Παρθενώνας, romanised: Parthenónas [parθeˈnonas]) is a former temple on the Athenian Acropolis, Greece, that was dedicated to the goddess Athena. Its decorative sculptures are considered some of the high points of classical Greek art, and the Parthenon is considered an enduring symbol of ancient Greece, Western civilisation, and democracy.\nThe Parthenon was built in the 5th century BC in thanksgiving for the Greek victory over the Persian invaders during the Greco-Persian Wars.","history":"The Parthenon (; Ancient Greek: Παρθενών, romanised: Parthenōn [par.tʰe.nɔ̌ːn]; Greek: Παρθενώνας, romanised: Parthenónas [parθeˈnonas]) is a former temple on the Athenian Acropolis, Greece, that was dedicated to the goddess Athena. Its decorative sculptures are considered some of the high points of classical Greek art, and the Parthenon is considered an enduring symbol of ancient Greece, Western civilisation, and democracy.\nThe Parthenon was built in the 5th century BC in thanksgiving for the Greek victory over the Persian invaders during the Greco-Persian Wars. Like most Greek temples, the Parthenon also served as the city treasury. Construction started in 447 BC when the Delian League was at the peak of its power. It was completed in 438 BC; work on the artwork and decorations continued until 432 BC. For a time, it served as the treasury of the Delian League, which later became the Athenian Empire.\nIn the final decade of the 6th century AD, the Parthenon was converted into a Christian church dedicated to the Virgin Mary. After the Ottoman conquest in the mid-15th century, it …","other":"พาร์เธนอน"}},{"th":{"title":"เดลฟี","url":"https://th.wikipedia.org/wiki/%E0%B9%80%E0%B8%94%E0%B8%A5%E0%B8%9F%E0%B8%B5","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f5/07Delphi_Theater03.jpg/960px-07Delphi_Theater03.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"เดลฟี หรือ เดลไฟ (อังกฤษ: Delphi, กรีก: Δελφοί, [ðe̞lˈfi])  เป็นทั้งสถานที่ทางโบราณคดีและเมืองในกรีซปัจจุบันทางตะวันออกเฉียงใต้ของภูเขาพาร์นาสซัสในหุบเขาโฟซิส เดลฟีเป็นสถานที่สำหรับไพเธียหรือโหรเดลฟี (Delphic oracle) ที่สำคัญที่สุดในโลกกรีกโบราณ เพราะเป็นสถานที่สำคัญที่ใช้ในการสักการะเทพอพอลโลหลังจากที่ได้ทำการสังหารไพธอนผู้พำนักอาศัยอยู่ ณ ที่นั้นเพื่อพิทักษ์สะดือของโลก เพลงสดุดีของโฮเมอร์ (Homeric Hymns) สำหรับสดุดีโหรเดลฟีเรียกสถานที่นี้ว่า \"Krisa\"\n“เดลฟี” ได้รับการขึ้นทะเบียนเป็นมรดกโลกโดยองค์การยูเนสโกในปี ค.ศ.","history":"เดลฟี หรือ เดลไฟ (อังกฤษ: Delphi, กรีก: Δελφοί, [ðe̞lˈfi])  เป็นทั้งสถานที่ทางโบราณคดีและเมืองในกรีซปัจจุบันทางตะวันออกเฉียงใต้ของภูเขาพาร์นาสซัสในหุบเขาโฟซิส เดลฟีเป็นสถานที่สำหรับไพเธียหรือโหรเดลฟี (Delphic oracle) ที่สำคัญที่สุดในโลกกรีกโบราณ เพราะเป็นสถานที่สำคัญที่ใช้ในการสักการะเทพอพอลโลหลังจากที่ได้ทำการสังหารไพธอนผู้พำนักอาศัยอยู่ ณ ที่นั้นเพื่อพิทักษ์สะดือของโลก เพลงสดุดีของโฮเมอร์ (Homeric Hymns) สำหรับสดุดีโหรเดลฟีเรียกสถานที่นี้ว่า \"Krisa\"\n“เดลฟี” ได้รับการขึ้นทะเบียนเป็นมรดกโลกโดยองค์การยูเนสโกในปี ค.ศ. 1987","other":"Delphi"},"en":{"title":"Delphi","url":"https://en.wikipedia.org/wiki/Delphi","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d5/Delphi%2C_Greece_-_panoramio.jpg/960px-Delphi%2C_Greece_-_panoramio.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Delphi (; Greek: Δελφοί [ðelˈfi]), in legend previously called Pytho (Πυθώ), was an ancient sacred precinct in central Greece. It was the seat of Pythia, the major oracle who was consulted about important decisions throughout the ancient classical world. The ancient Greeks considered the centre of the world to be in Delphi, marked by the stone monument known as the Omphalos of Delphi.","history":"Occupation of the site at Delphi can be traced back to the Neolithic period with extensive occupation and use beginning in the Mycenaean period (1600–1100 BC). In Mycenaean times Krissa was a major Greek land and sea power, perhaps one of the first in Greece, if the Early Helladic date of Kirra is to be believed. The ancient sources indicate that the previous name of the Gulf of Corinth was the \"Krisaean Gulf\". Like Krisa, Corinth was a Dorian state, and Gulf of Corinth was a Dorian lake, so to speak, especially since the migration of Dorians into the Peloponnesus starting about 1000 BC. Krisa\u0027s power was broken finally by the recovered Aeolic and Attic-Ionic speaking states of southern Greece over the issue of access to Delphi. Control of it was assumed by the Amphictyonic League, an organization of states with an interest in Delphi, in the early Classical period. Krisa was destroyed for its arrogance. The gulf was given Corinth\u0027s name. Corinth by then was similar to the Ionic states: ornate and innovative, not resembling the spartan style of the Doric.\nEarlier myths include …","other":"เดลฟี"}},{"th":{"title":"คนอสซอส","url":"https://th.wikipedia.org/wiki/%E0%B8%84%E0%B8%99%E0%B8%AD%E0%B8%AA%E0%B8%8B%E0%B8%AD%E0%B8%AA","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ea/Knossos_-_North_Portico_02.jpg/960px-Knossos_-_North_Portico_02.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"คนอสซอส (อังกฤษ: Knossos, ออกเสียง: /ˈknɒsɒs/; กรีกโบราณ: Κνωσός, อักษรโรมัน: Knōsós, ออกเสียง: [knoˈsos], อักษรลิเนียร์บี: 𐀒𐀜𐀰 Ko-no-so) หรือที่เรียกว่า \"ลายวงกต\" หรือ \"พระราชวังคนอสซอส\" คือแหล่งโบราณคดีที่ใหญ่ที่สุดของยุคสัมฤทธิ์บนเกาะครีต และได้รับการขนานนามว่าเป็นเมืองที่เก่าแก่ที่สุดของยุโรป\nมีผู้ตั้งถิ่นฐานบริเวณนี้มาตั้งแต่ยุคหินใหม่ ชื่อคนอสซอสมาจากภาษากรีกโบราณที่กล่าวถึงเมืองหลักบนเกาะครีต พระราชวังคนอสซอสกลายเป็นศูนย์กลางทางพิธีและการเมืองของอารยธรรมและวัฒนธรรมไมนอส บนผนังของพระราชวังเป็นภาพรายละเอียดของชีวิตชาวครีตในปลายยุคสัมฤทธิ์ พระราชวังถูกทิ้งร้างในช่วงสิ้นสุดยุคสัมฤทธิ์ตอนปลาย ในเวลาใดไม่ทราบแน่ชัด และไม่มีใครทราบเหตุผลว่าทำไม ปัจจุบันคนอสซอสกลายเป็นสถานที่ดึงดูดนักท่องเที่ยวเพราะตั้งอยู่ใกล้กับเมืองใหญ่ฮีราคลีออน คนอสซอสได้รับการบูรณปฏิสังขรณ์เป็นอันมากโดยเซอร์อาร์เทอร์ อีแวนส์ นักโบราณคดีชาวอังกฤษ\nในสมัยพระราชวังแรก (ประมาณ 2,000 ปีก่อน ค.ศ.) บริเวณเมืองมีประชากรมากถึง 18,000 คน ในสมัยรุ่งเรืองที่สุด พระราชวังและเมืองรอบ ๆ มีประชากรมากถึง 100,000 คน หลัง 1,700 ปีก่อน ค.ศ.","history":"คนอสซอส (อังกฤษ: Knossos, ออกเสียง: /ˈknɒsɒs/; กรีกโบราณ: Κνωσός, อักษรโรมัน: Knōsós, ออกเสียง: [knoˈsos], อักษรลิเนียร์บี: 𐀒𐀜𐀰 Ko-no-so) หรือที่เรียกว่า \"ลายวงกต\" หรือ \"พระราชวังคนอสซอส\" คือแหล่งโบราณคดีที่ใหญ่ที่สุดของยุคสัมฤทธิ์บนเกาะครีต และได้รับการขนานนามว่าเป็นเมืองที่เก่าแก่ที่สุดของยุโรป\nมีผู้ตั้งถิ่นฐานบริเวณนี้มาตั้งแต่ยุคหินใหม่ ชื่อคนอสซอสมาจากภาษากรีกโบราณที่กล่าวถึงเมืองหลักบนเกาะครีต พระราชวังคนอสซอสกลายเป็นศูนย์กลางทางพิธีและการเมืองของอารยธรรมและวัฒนธรรมไมนอส บนผนังของพระราชวังเป็นภาพรายละเอียดของชีวิตชาวครีตในปลายยุคสัมฤทธิ์ พระราชวังถูกทิ้งร้างในช่วงสิ้นสุดยุคสัมฤทธิ์ตอนปลาย ในเวลาใดไม่ทราบแน่ชัด และไม่มีใครทราบเหตุผลว่าทำไม ปัจจุบันคนอสซอสกลายเป็นสถานที่ดึงดูดนักท่องเที่ยวเพราะตั้งอยู่ใกล้กับเมืองใหญ่ฮีราคลีออน คนอสซอสได้รับการบูรณปฏิสังขรณ์เป็นอันมากโดยเซอร์อาร์เทอร์ อีแวนส์ นักโบราณคดีชาวอังกฤษ\nในสมัยพระราชวังแรก (ประมาณ 2,000 ปีก่อน ค.ศ.) บริเวณเมืองมีประชากรมากถึง 18,000 คน ในสมัยรุ่งเรืองที่สุด พระราชวังและเมืองรอบ ๆ มีประชากรมากถึง 100,000 คน หลัง 1,700 ปีก่อน ค.ศ. ไม่นานนัก\nเมืองคนอสซอสมีความสำคัญจนตลอดสมัยคลาสสิกและสมัยโรมัน …","other":"Knossos"},"en":{"title":"Knossos","url":"https://en.wikipedia.org/wiki/Knossos","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/18/Crete_integrated_map-en.svg/960px-Crete_integrated_map-en.svg.png?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Knossos (; Ancient Greek: Κνωσσός, romanized: Knōssós; Greek: Κνωσός, romanized: Knōsós; Linear B: 𐀒𐀜𐀰 Ko-no-so) is an archaeological site and ancient urban centre in Crete, Greece. It is located within the southern periphery of Heraklion, about 5 km (3.1 mi) south of the city\u0027s historic centre. The site was occupied from the Neolithic period into the first millennium AD and became the largest and best-known centre of the Minoan civilisation.","history":"The earliest known settlement at Knossos dates to about 7000 BC, during the early Neolithic period. This makes Knossos one of the earliest permanent settlements on Crete and one of the earliest long-lived settlements in the Aegean. The first community occupied the summit of Kephala hill, the later site of the palace. Archaeological evidence indicates a small but stable settlement based on farming, animal husbandry and domestic craft production.\nOver the following millennia, the settlement expanded and accumulated deep archaeological deposits. Pottery, stone tools, figurines and building remains show long continuity through the Early, Middle, Late and Final Neolithic phases. By the Final Neolithic, the settlement formed a sizeable community that continued to grow during the third millennium BC.\nDuring the Prepalatial period, about 3000 to 1900 BC, Knossos grew in size and complexity before the construction of the first palace. The settlement developed stronger craft specialisation, wider exchange networks and greater social differentiation. Survey evidence indicates a marked …","other":"คนอสซอส"}},{"th":{"title":"เกอเบ็กลีเทแพ","url":"https://th.wikipedia.org/wiki/%E0%B9%80%E0%B8%81%E0%B8%AD%E0%B9%80%E0%B8%9A%E0%B9%87%E0%B8%81%E0%B8%A5%E0%B8%B5%E0%B9%80%E0%B8%97%E0%B9%81%E0%B8%9E","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d5/G%C3%B6bekli_Tepe%2C_Urfa.jpg/960px-G%C3%B6bekli_Tepe%2C_Urfa.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"เกอเบ็กลีเทแพ (อังกฤษ: Göbekli Tepe; ตุรกี: Göbeklitepe) คือ แหล่งโบราณคดียุคหินใหม่ในจังหวัดชันลืออูร์ฟา ภูมิภาคอนาโตเลียตะวันออกเฉียงใต้ของประเทศตุรกี มีอายุก่อนยุคเครื่องปั้นดินเผาราวช่วง 9,500 และ 8,000 ปีก่อนคริสตศักราช (ก่อนสโตนเฮนจ์ในอังกฤษราว 6,600 ปี และพีระมิดในอียิปต์ราว 7,100 ปี) สถานที่ประกอบด้วยโครงสร้างทรงกลมขนาดใหญ่จำนวนมากที่รองรับด้วยเสาหินขนาดใหญ่ (Megalith) ซึ่งเก่าแก่ที่สุดในโลกที่พบในปัจจุบัน เสาเหล่านี้หลายต้นได้รับการตกแต่งอย่างหรูหราด้วยรายละเอียดที่เป็นรูปมนุษย์ เสื้อผ้า และรูปนูนของสัตว์ป่า ทำให้นักโบราณคดีได้รับรู้ถึงข้อมูลเชิงลึกที่หายากเกี่ยวกับศาสนาก่อนยุคประวัติศาสตร์และภาพสัญลักษณ์เฉพาะในยุคนั้น เนินที่มีความสูง 15 ม.","history":"เกอเบ็กลีเทแพ (อังกฤษ: Göbekli Tepe; ตุรกี: Göbeklitepe) คือ แหล่งโบราณคดียุคหินใหม่ในจังหวัดชันลืออูร์ฟา ภูมิภาคอนาโตเลียตะวันออกเฉียงใต้ของประเทศตุรกี มีอายุก่อนยุคเครื่องปั้นดินเผาราวช่วง 9,500 และ 8,000 ปีก่อนคริสตศักราช (ก่อนสโตนเฮนจ์ในอังกฤษราว 6,600 ปี และพีระมิดในอียิปต์ราว 7,100 ปี) สถานที่ประกอบด้วยโครงสร้างทรงกลมขนาดใหญ่จำนวนมากที่รองรับด้วยเสาหินขนาดใหญ่ (Megalith) ซึ่งเก่าแก่ที่สุดในโลกที่พบในปัจจุบัน เสาเหล่านี้หลายต้นได้รับการตกแต่งอย่างหรูหราด้วยรายละเอียดที่เป็นรูปมนุษย์ เสื้อผ้า และรูปนูนของสัตว์ป่า ทำให้นักโบราณคดีได้รับรู้ถึงข้อมูลเชิงลึกที่หายากเกี่ยวกับศาสนาก่อนยุคประวัติศาสตร์และภาพสัญลักษณ์เฉพาะในยุคนั้น เนินที่มีความสูง 15 ม. (50 ฟุต) ขนาด 8 เฮกตาร์ (20 เอเคอร์) ยังรวมถึงอาคารขนาดเล็ก เหมืองหิน และถังเก็บน้ำที่สกัดด้วยหินจากยุคหินใหม่ ตลอดจนร่องรอยของกิจกรรมบางอย่างจากยุคต่อมา\nแหล่งโบราณคดีนี้ค้นพบครั้งแรกในการสำรวจในปี 1963 และได้รับการขึ้นทะเบียนเป็นมรดกโลกโดยองค์การยูเนสโกในปี 2018 โดยตระหนักถึงคุณค่าที่โดดเด่นในระดับสากลในฐานะ \"หนึ่งในการแสดงให้เห็นครั้งแรกของสถาปัตยกรรมอนุสาวรีย์ที่มนุษย์สร้างขึ้น\" จนถึงปี 2021 แหล่งโบราณคดีแห่งนี้ได้รับการสำรวจเพียงราว …","other":"Göbekli Tepe"},"en":{"title":"Göbekli Tepe","url":"https://en.wikipedia.org/wiki/G%C3%B6bekli_Tepe","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d5/G%C3%B6bekli_Tepe%2C_Urfa.jpg/960px-G%C3%B6bekli_Tepe%2C_Urfa.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Göbekli Tepe (pronounced ɟœbecˈli teˈpe  meaning \u0027Potbelly Hill\u0027) is a Neolithic archaeological site in Upper Mesopotamia (al-Jazira) in modern-day Turkey. The settlement was inhabited from around 9500 BCE to at least 8000 BCE, during the Pre-Pottery Neolithic. It is known for its large circular structures that contain large stone pillars – among the world\u0027s oldest known megaliths.","history":"Göbekli Tepe (pronounced ɟœbecˈli teˈpe  meaning \u0027Potbelly Hill\u0027) is a Neolithic archaeological site in Upper Mesopotamia (al-Jazira) in modern-day Turkey. The settlement was inhabited from around 9500 BCE to at least 8000 BCE, during the Pre-Pottery Neolithic. It is known for its large circular structures that contain large stone pillars – among the world\u0027s oldest known megaliths. Many of these pillars are decorated with anthropomorphic details, clothing, and sculptural reliefs of wild animals, providing archaeologists with insights into prehistoric religion and the iconography of the period. The 15 m (50 ft) high, 8 ha (20-acre) tell is covered with ancient domestic structures and other small buildings, quarries, and stone-cut cisterns from the Neolithic, as well as traces of activity from later periods.\nThe site was first used at the dawn of the southwest Asian Neolithic period, which marked the appearance of the oldest permanent human settlements anywhere in the world. Prehistorians link this Neolithic Revolution to the advent of agriculture but disagree on whether farming …","other":"เกอเบ็กลีเทแพ"}},{"th":{"title":"โบสถ์พระคูหาศักดิ์สิทธิ์","url":"https://th.wikipedia.org/wiki/%E0%B9%82%E0%B8%9A%E0%B8%AA%E0%B8%96%E0%B9%8C%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%84%E0%B8%B9%E0%B8%AB%E0%B8%B2%E0%B8%A8%E0%B8%B1%E0%B8%81%E0%B8%94%E0%B8%B4%E0%B9%8C%E0%B8%AA%E0%B8%B4%E0%B8%97%E0%B8%98%E0%B8%B4%E0%B9%8C","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/01/The_Church_of_the_Holy_Sepulchre-Jerusalem.JPG/960px-The_Church_of_the_Holy_Sepulchre-Jerusalem.JPG?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"โบสถ์พระคูหาศักดิ์สิทธิ์","history":"โบสถ์พระคูหาศักดิ์สิทธิ์ \n(อังกฤษ: Church of the Holy Sepulchre; ละติน: Ecclesia Sancti Sepulchri; อาหรับ: كنيسة القيامة, Kanīsat al-Qiyāmah; ฮีบรู: כנסיית הקבר, Knesiyat ha-Kever) หรือที่คริสตชนออร์ทอดอกซ์เรียกว่า โบสถ์การคืนพระชนม์ หรือ โบสถ์แห่งอะนาสตาซิส (กรีก: Ναός της Αναστάσεως Naos tes Anastaseos)  เป็นโบสถ์คริสต์ในย่านชุมชนคริสตชนของเมืองเยรูซาเลมเก่า ตัวโบสถ์ถูกสร้างขึ้นบนสถานที่สองแห่งที่คริสตชนถือว่าศักดิ์สิทธิ์ที่สุด คือ สถานที่ทำการตรึงพระเยซูที่กางเขน ซึ่งมีชื่อเรียกว่า กลโกธา (ภาษากรีกในพระคัมภีร์: Γολγοθᾶ) และพระคูหาว่างเปล่าที่พระองค์ถูกฝังและฟื้นคืนพระชนม์  \n== อ้างอิง ==","other":"Church of the Holy Sepulchre"},"en":{"title":"Church of the Holy Sepulchre","url":"https://en.wikipedia.org/wiki/Church_of_the_Holy_Sepulchre","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6d/Church_of_the_Holy_Sepulchre_by_Gerd_Eichmann_%28cropped%29.jpg/960px-Church_of_the_Holy_Sepulchre_by_Gerd_Eichmann_%28cropped%29.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Church of the Holy Sepulchre,  also known as the Church of the Resurrection, is a fourth-century church in the Christian Quarter of the Old City of Jerusalem. The church is simultaneously the seat of the Armenian Patriarchate of Jerusalem, Greek Orthodox Patriarchate of Jerusalem, and the Catholic Latin Patriarchate of Jerusalem. It is the holiest site in Christianity, and it has been an important pilgrimage site for Christians since the fourth century.","history":"After the siege of Jerusalem in AD 70 during the First Jewish–Roman War, Jerusalem had been reduced to ruins. In AD 130, the Roman emperor Hadrian began the building of a Roman colony, the new city of Aelia Capitolina, on the site. About AD 135, he ordered that a cave containing a rock-cut tomb be filled in to make a flat foundation for a temple dedicated to Venus or Aphrodite. The temple remained until the early fourth century.\nAfter the death of Jesus, Emperor Hadrian covered the tomb and erected a Temple of Aphrodite on top of it around 135 AD and it remained until Constantine rediscovered the tomb around 325 AD. Physical testing of a mortar layer between the original older limestone tomb and later marble slab, revealed that the original shrine construction around the actual tomb could be securely dated to the time of Constantine, as historical records indicate on its rediscovery.\nAfter seeing a vision of a cross in the sky in 312, Constantine the Great began to favour Christianity and signed the Edict of Milan legalizing the religion. The Bishop of Jerusalem Macarius asked …","other":"โบสถ์พระคูหาศักดิ์สิทธิ์"}},{"th":null,"en":{"title":"Masada","url":"https://en.wikipedia.org/wiki/Masada","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/14/Israel-2013-Aerial_21-Masada.jpg/960px-Israel-2013-Aerial_21-Masada.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Masada (Hebrew: מְצָדָה məṣādā, \u0027fortress\u0027; Arabic: جبل مسعدة, romanized: jabal musayda, lit. \u0027mount museida\u0027) is a mountain-top fortress complex in the Judaean Desert, overlooking the western shore of the Dead Sea in southeastern Israel. The fort, built in the first century BC, was constructed atop a natural plateau rising over 400 m (1,300 ft) above the surrounding terrain, 20 km (12 mi) east of modern Arad.\nThe most significant remains at the site date to the reign of Herod the Great, King of Judaea under Roman administration c. 37–4 BC, who transformed Masada into a fortified desert refuge early in his rule.","history":"Almost all historical information about Masada comes from the first-century Jewish Roman historian Josephus. Masada is also mentioned in the Judean Desert Documents.\nJosephus writes that the site was first fortified by Hasmonean ruler Alexander Jannaeus in the first century BC. However, so far no Hasmonean-period building remains could be identified during archaeological excavations.\nJosephus further writes that Herod the Great captured it in the power struggle that followed the death of his father Antipater in 43 BC. It survived the siege of the last Hasmonean king Antigonus II Mattathias, who ruled with Parthian support.\nAccording to Josephus, between 37 and 31 BC, Herod the Great built a large fortress on the plateau as a refuge for himself in the event of a revolt and erected two palaces with an endless food supply.\nIn 66 CE, a group of Jewish rebels, the Sicarii, overcame the Roman garrison of Masada with the aid of a ruse. According to Josephus, the Sicarii were an extremist Jewish splinter group antagonistic to a larger grouping of Jews referred to as the Zealots, who carried …","other":null}},{"th":{"title":"คาร์นัก","url":"https://th.wikipedia.org/wiki/%E0%B8%84%E0%B8%B2%E0%B8%A3%E0%B9%8C%E0%B8%99%E0%B8%B1%E0%B8%81","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/60/Temple_de_Louxor_68.jpg/960px-Temple_de_Louxor_68.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"ศาสนาสถานแห่งคาร์นัก หรือที่เรียกกันทั่วไปว่า คาร์นัก (, ซึ่งเดิมมาจากภาษาอาหรับ: خورنق Khurnaq แปลว่า \"หมู่บ้านที่มีป้อมปราการ\") เป็นศาสนสถานที่ประกอบไปด้วยวัด เสา วิหารและสิ่งปลูกสร้างอาคารอื่นๆ ที่ผุพังจำนวนมาก ใกล้กับเมืองลักซอร์ ประเทศอียิปต์ การก่อสร้างศาสนสถานแห่งนี้เริ่มขึ้นในรัชสมัยของฟาโรห์เซนุสเรตที่ 1 (ครองราชย์ระหว่าง 1971–1926 ปีก่อนคริสตกาล) ในสมัยราชอาณาจักรกลาง (ประมาณ 2000–1700 ปีก่อนคริสตกาล) และดำเนินการก่อสร้างจนไปถึงสมัยราชอาณาจักรทอเลมี (ระหว่าง 305–30 ก่อนคริสตศักราช) ถึงแม้ว่าสิ่งปลูกสร้างและอาคารที่ยังหลงเหลืออยู่นั้น ส่วนใหญ่จะมีอายุย้อนถึงเพียงสมัยราชอาณาจักรใหม่เท่านั้น แต่บริเวณโดยรอบศาสนสถานแห่งคาร์นักเป็นบริเวณที่ในภาษาอียิปต์โบราณเรียกว่า Ipet-isut (\"สถานที่ที่ได้รับการคัดเลือกมากที่สุด\") และเป็นสถานที่สักการะหลักของเทพเจ้าทั้งสามแห่งธีบส์ในช่วงราชวงศ์ที่สิบแปดแห่งอียิต์ โดยมีเทพอามุนเป็นเทพเจ้าสูงสุด ซึ่งยังเป็นส่วนหนึ่งของอนุสรณ์สถานประจำเมืองธีบส์ ในปี ค.ศ.","history":"ศาสนาสถานแห่งคาร์นัก หรือที่เรียกกันทั่วไปว่า คาร์นัก (, ซึ่งเดิมมาจากภาษาอาหรับ: خورنق Khurnaq แปลว่า \"หมู่บ้านที่มีป้อมปราการ\") เป็นศาสนสถานที่ประกอบไปด้วยวัด เสา วิหารและสิ่งปลูกสร้างอาคารอื่นๆ ที่ผุพังจำนวนมาก ใกล้กับเมืองลักซอร์ ประเทศอียิปต์ การก่อสร้างศาสนสถานแห่งนี้เริ่มขึ้นในรัชสมัยของฟาโรห์เซนุสเรตที่ 1 (ครองราชย์ระหว่าง 1971–1926 ปีก่อนคริสตกาล) ในสมัยราชอาณาจักรกลาง (ประมาณ 2000–1700 ปีก่อนคริสตกาล) และดำเนินการก่อสร้างจนไปถึงสมัยราชอาณาจักรทอเลมี (ระหว่าง 305–30 ก่อนคริสตศักราช) ถึงแม้ว่าสิ่งปลูกสร้างและอาคารที่ยังหลงเหลืออยู่นั้น ส่วนใหญ่จะมีอายุย้อนถึงเพียงสมัยราชอาณาจักรใหม่เท่านั้น แต่บริเวณโดยรอบศาสนสถานแห่งคาร์นักเป็นบริเวณที่ในภาษาอียิปต์โบราณเรียกว่า Ipet-isut (\"สถานที่ที่ได้รับการคัดเลือกมากที่สุด\") และเป็นสถานที่สักการะหลักของเทพเจ้าทั้งสามแห่งธีบส์ในช่วงราชวงศ์ที่สิบแปดแห่งอียิต์ โดยมีเทพอามุนเป็นเทพเจ้าสูงสุด ซึ่งยังเป็นส่วนหนึ่งของอนุสรณ์สถานประจำเมืองธีบส์ ในปี ค.ศ. 1979 ศาสนสถานแห่งคาร์นักก็ได้รับการขึ้นทะเบียนเป็นมรดกโลกโดยองค์การยูเนสโกพร้อมกับส่วนอื่นๆ ของเมือง ศาสนสถานแห่งคาร์นักได้เป็นที่มาของชื่อหมู่บ้านเอล-คาร์นัก …","other":"Karnak"},"en":{"title":"Karnak","url":"https://en.wikipedia.org/wiki/Karnak","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/60/Temple_de_Louxor_68.jpg/960px-Temple_de_Louxor_68.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Karnak Temple Complex, commonly known as Karnak (), comprises a vast mix of temples, pylons, chapels, and other buildings near Luxor, Egypt. Construction at the complex began during the reign of Senusret I (reigned 1971–1926 BCE) in the Middle Kingdom (c. 2000–1700 BC) and continued into the Ptolemaic Kingdom (305–30 BCE), although most of the extant buildings date from the New Kingdom. The area around Karnak was the ancient Egyptian Ipet-isut (\"The Most Selected of Places\") and the main place of worship of the 18th Dynastic Theban Triad, with the god Amun as its head.","history":"The history of the Karnak complex is largely the history of Thebes and its changing role in the culture. Religious centers varied by region, and when a new capital of the unified culture was established, the religious centers in that area gained prominence. The city of Thebes does not appear to have been of great significance before the Eleventh Dynasty and previous temple building there would have been relatively small, with shrines being dedicated to the early deities of Thebes, the Earth goddess Mut and Montu. Early building was destroyed by invaders. The earliest known artifact found in the area of the temple is a small, eight-sided column from the Eleventh Dynasty, which mentions Amun-Re. Amun (sometimes called Amen) was long the local tutelary deity of Thebes. He was identified with the ram and the goose. The Egyptian meaning of Amun is \"hidden\" or the \"hidden god\".\nMajor construction work in the Precinct of Amun-Re took place during the Eighteenth Dynasty, when Thebes became the capital of the unified Ancient Egypt. Almost every pharaoh of that dynasty added something to the …","other":"คาร์นัก"}},{"th":{"title":"หุบเขากษัตริย์","url":"https://th.wikipedia.org/wiki/%E0%B8%AB%E0%B8%B8%E0%B8%9A%E0%B9%80%E0%B8%82%E0%B8%B2%E0%B8%81%E0%B8%A9%E0%B8%B1%E0%B8%95%E0%B8%A3%E0%B8%B4%E0%B8%A2%E0%B9%8C","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d7/Tutankhamen_map_Valle_Re_Nilo_space_STS026-041-058.jpg/960px-Tutankhamen_map_Valle_Re_Nilo_space_STS026-041-058.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"หุบเขากษัตริย์ (อาหรับ: وادي الملوك, Wādī al-Mulūk; อังกฤษ: The Valley of the Kings) เป็นหุบเขาในประเทศอียิปต์ เป็นหลุมศพของกษัตริย์และราชวงศ์ในราชอาณาจักรใหม่ (ตั้งแต่ราชวงศ์ที่ 18 ถึง 20 ของอียิปต์โบราณ) หุบเขาตั้งอยู่บนฝั่งตะวันตกของแม่น้ำไนล์ ฝั่งตรงข้ามกับเมืองธีปส์ (หรือ ลักซอร์ในปัจจุบัน) ตั้งอยู่ใจกลางของธีบันเนโครโปลิส บริเวณที่อุดมสมบูรณ์ในทะเลทรายนั้นประกอบด้วย 2 หุบเขาคือ หุบเขาตะวันออก (ที่เป็นที่ตั้งของสุสานเป็นส่วนใหญ่) และหุบเขาตะวันตก \nในปี 2006 ได้มีการค้นพบห้อง (เควี 63) และในปี 2008 ได้ค้นพบทางเข้าสุสานอีก 2 แห่ง หุบเขานี้มีหลุมศพอยู่ 63 แห่งและห้อง (ที่มีหลายขนาดทั้งห้องเล็ก ๆ ไปจนถึงสุสานที่มีห้องซับซ้อน ที่มีห้องมากกว่า 120 ห้อง) และยังเป็นที่ฝังพระศพที่สำคัญของราชวงศ์ของอาณาจักรใหม่แห่งอียิปต์โบราณ รวมถึงยังมีสุสานของบุคคลสำคัญอีกหลายแห่ง สุสานตกแต่งด้วยภาพของเทพเจ้าอียิปต์และได้ให้ข้อมูลความเชื่อเกี่ยวกับพิธีศพในช่วงเวลานั้น สุสานทั้งหมดดูเหมือนจะถูกเปิดและโจรรกรรมวัตถุโบราณไปแล้ว แต่ก็ยังให้แนวคิดเกี่ยวกับความมั่งคั่งและอำนาจในการปกครองในยุคนั้น\nพื้นที่นี้ถือเป็นการค้นพบด้านโบราณคดีและอียิปต์ศึกษา ตั้งแต่สิ้นสุดศตวรรษที่ 18 สุสานและที่ฝังศพก็ยังคงเป็นที่สนใจในการสำรวจข้อมูล ในยุคสมัยใหม่นี้หุบเขาเป็นที่มีชื่อเสียงขึ้นมาหลังจากการค้นพบสุสานของฟาโรห์ตุตันคามุน (ที่เป็นที่เลื่องลือด้านคำสาปฟาโรห์) และยังถือเป็นหนึ่งในสถานที่โบราณคดีที่โด่งดังที่สุดในโลก ในปี ค.ศ.","history":"หุบเขากษัตริย์ (อาหรับ: وادي الملوك, Wādī al-Mulūk; อังกฤษ: The Valley of the Kings) เป็นหุบเขาในประเทศอียิปต์ เป็นหลุมศพของกษัตริย์และราชวงศ์ในราชอาณาจักรใหม่ (ตั้งแต่ราชวงศ์ที่ 18 ถึง 20 ของอียิปต์โบราณ) หุบเขาตั้งอยู่บนฝั่งตะวันตกของแม่น้ำไนล์ ฝั่งตรงข้ามกับเมืองธีปส์ (หรือ ลักซอร์ในปัจจุบัน) ตั้งอยู่ใจกลางของธีบันเนโครโปลิส บริเวณที่อุดมสมบูรณ์ในทะเลทรายนั้นประกอบด้วย 2 หุบเขาคือ หุบเขาตะวันออก (ที่เป็นที่ตั้งของสุสานเป็นส่วนใหญ่) และหุบเขาตะวันตก \nในปี 2006 ได้มีการค้นพบห้อง (เควี 63) และในปี 2008 ได้ค้นพบทางเข้าสุสานอีก 2 แห่ง หุบเขานี้มีหลุมศพอยู่ 63 แห่งและห้อง (ที่มีหลายขนาดทั้งห้องเล็ก ๆ ไปจนถึงสุสานที่มีห้องซับซ้อน ที่มีห้องมากกว่า 120 ห้อง) และยังเป็นที่ฝังพระศพที่สำคัญของราชวงศ์ของอาณาจักรใหม่แห่งอียิปต์โบราณ รวมถึงยังมีสุสานของบุคคลสำคัญอีกหลายแห่ง สุสานตกแต่งด้วยภาพของเทพเจ้าอียิปต์และได้ให้ข้อมูลความเชื่อเกี่ยวกับพิธีศพในช่วงเวลานั้น สุสานทั้งหมดดูเหมือนจะถูกเปิดและโจรรกรรมวัตถุโบราณไปแล้ว แต่ก็ยังให้แนวคิดเกี่ยวกับความมั่งคั่งและอำนาจในการปกครองในยุคนั้น\nพื้นที่นี้ถือเป็นการค้นพบด้านโบราณคดีและอียิปต์ศึกษา ตั้งแต่สิ้นสุดศตวรรษที่ 18 …","other":"Valley of the Kings"},"en":{"title":"Valley of the Kings","url":"https://en.wikipedia.org/wiki/Valley_of_the_Kings","img":"https://upload.wikimedia.org/wikipedia/commons/0/0c/Luxor%2C_Tal_der_K%C3%B6nige_%281995%2C_860x605%29.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail_unscaled","intro":"The Valley of the Kings, also known as the Valley of the Gates of the Kings, is an area in Egypt where, for a period of nearly 500 years from the Eighteenth Dynasty to the Twentieth Dynasty, rock-cut tombs were excavated for pharaohs and powerful nobles under the New Kingdom of ancient Egypt.\nIt is a wadi sitting on the west bank of the Nile, opposite Thebes (modern-day Luxor) and within the heart of the Theban Necropolis. There are two main sections: the East Valley, where the majority of the royal tombs are situated; and the West Valley, otherwise known as the Valley of the Monkeys.","history":"The Theban Hills are dominated by the peak of al-Qurn, known to the Ancient Egyptians as ta dehent, or \"The Peak\". It has a pyramid-shaped appearance, and it is probable that this echoed the pyramids of the Old Kingdom, more than a thousand years prior to the first royal burials carved here. Its isolated position also resulted in reduced access, and special tomb police (the Medjay) were able to guard the necropolis.\nWhile the iconic pyramid complex of the Giza Plateau has come to symbolize ancient Egypt, the majority of tombs were cut into rock. Most pyramids and mastabas contain sections which were cut into ground level, and there are full rock-cut tombs in Egypt that date back to the Old Kingdom.\nAfter the defeat of the Hyksos and the reunification of Egypt under Ahmose I, the Theban rulers began to construct elaborate tombs that reflected their newfound power. The tombs of Ahmose I and his son Amenhotep I (their exact location remains unknown) were probably in the Seventeenth Dynasty necropolis of Dra\u0027 Abu el-Naga\u0027. The first royal tombs in the Valley of the Kings were those of …","other":"หุบเขากษัตริย์"}},{"th":{"title":"อะบูซิมเบล","url":"https://th.wikipedia.org/wiki/%E0%B8%AD%E0%B8%B0%E0%B8%9A%E0%B8%B9%E0%B8%8B%E0%B8%B4%E0%B8%A1%E0%B9%80%E0%B8%9A%E0%B8%A5","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/63/Panorama_Abu_Simbel_crop.jpg/960px-Panorama_Abu_Simbel_crop.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"อะบูซิมเบล (อาหรับ: أبو سمبل ,أبو سنبل; อังกฤษ: Abu Simbel) เป็นมหาวิหารของอียิปต์โบราณอันประกอบขึ้นจากหินขนาดใหญ่สองก้อน มีลักษณะเป็นรูปปั้นองค์ฟาโรห์ทั้งสี่ ส่วนองค์ที่สองถล่มลงเนื่องจากแผ่นดินไหว ตั้งอยู่ทางใต้ของอียิปต์ บนริมฝั่งตะวันตกของทะเลสาบนัสซอร์ ระยะทางประมาณ 290 กิโลเมตรจากอัสวาน และเป็นโบราณสถานหนึ่งในมรดกโลกขององค์การยูเนสโก นอกจากนี้ยังรู้จักกันในนาม อนุสรณ์สถานแห่งนิวเบีย แต่เดิมมหาวิหารถูกก่อสร้างโดยการเจาะแกะสลักเข้าไปในภูเขาหินในช่วงรัชสมัยของฟาโรห์แรเมซีสที่ 2 ในช่วงศตวรรษที่ 13 ก่อนคริสตกาล และยังเป็นอนุสรณ์สถานแห่งสุดท้ายของพระองค์และพระมเหสีของพระองค์นั้นคือพระนางเนเฟอร์ทารี ซึ่งอะบูซิมเบล ยังมีจุดประสงค์เพื่อเป็นการเฉลิมฉลองกับชัยชนะของอียิปต์ที่มีต่อนิวเบียที่สมรภูมิแห่งคาเดส อีกทั้งเพื่อเป็นการข่มขู่นิวเบียไม่ให้มารุกรานอียิปต์ซึ่งเป็นอาณาจักรใกล้เคียง อย่างไรก็ตามมหาวิหารทั้งหมดถูกเคลื่อนย้ายโดยคณะวิศวกรจากสวิตเซอร์แลนด์ ซึ่งใช้เวลาตลอดทั้งทศวรรษที่ 1960 เพื่อหลีกเลี่ยงปัญหาน้ำท่วมจากการสร้างเขื่อนอัสวาน อันจะส่งผลให้มหาวิหารและโบราณสถานที่รายรอบอยู่ต้องจมอยู่ก้นทะเลสาบนัสซอร์ ปัจจุบันมหาวิหารเป็นสถานที่ท่องเที่ยวที่ได้รับความนิยมอย่างมากและโด่งดังแห่งหนึ่งของอียิปต์ ซึ่งครั้งหนึ่งนักท่องเที่ยวชาวเยอรมันและญี่ปุ่นเคยถูกลอบสังหารขณะเดินทางไปยังสถานที่แห่งนี้","history":"การก่อสร้างของมหาวิหารทั้งหมดเริ่มต้นขึ้นประมาณปี 1224 ก่อนคริศตกาล และเสร็จสมบูรณ์ในอีก 20 ปีต่อมา ในปี 1244 ก่อนคริศตกาล รู้จักกันในนาม \"วิหารแห่งรามเสสอันเป็นที่รักของเทพเจ้าอามุน ซึ่งเคยเป็นหนึ่งในหกวิหารหินแกะสลักที่ก่อสร้างขึ้นในนิวเบียในช่วงระยะเวลาการครองราชย์อันยาวนานของฟาโรห์รามเสสที่ 2 ซึ่งอียิปต์โบราณเจตนาให้เป็นที่ประทับใจต่ออาณาจักรเพื่อนบ้านทางใต้ อีกทั้งยังเจตนาเพื่อเป็นการเผยแพร่ศาสนาของชาวอียิปต์เข้าไปในแคว้นทางใต้ นักประวัติศาสตร์กล่าวว่าสถาปัตยกรรมของอะบูซิมเบลยังบ่งบอกถึงความภูมิใจและตัวตนของฟาโรห์รามเสสที่ 2 อยู่เล็กน้อย\nด้วยกาลเวลาที่ล่วงเลยผ่านไปอย่างยาวนาน มหาวิหารถูกทิ้งร้างและตกอยู่ในสภาพที่ทรุดโทม จนกระทั่งมหาวิหารถูกกลืนกินโดยทรายจากทะเลทรายซาฮาร่า ซึ่งรูปแกะสลักขนาดยักษ์ขององค์ฟาโรห์ทั้งสี่ถูกกลืนกินโดยทรายจนถึงหัวเข่าในศตวรรษที่ 6 ก่อนคริสตกาล จนกลายเป็นมหาวิหารที่ถูกหลงลืมกระทั่งปี ค.ศ. 1813 เมื่อนักประวัติศาสตร์ที่ศึกษาเกี่ยวกับวัฒนธรรมตะวันออกชาวสวิสเซอร์แลนด์ โจฮัน ลุดวิก เบิร์คฮารดต์ หรือรู้จักกันในนาม เจแอล เบิร์คฮารดต์ ค้นพบส่วนบนของฟรีส (ลวดลายสลักใต้ชายคาของสิ่งก่อสร้าง) โจฮันได้เล่าถึงการค้นพบของเขาให้แกนักสำรวจชาวอิตาลีที่ชื่อ จิโอวานนี่ …","other":"Abu Simbel"},"en":{"title":"Abu Simbel","url":"https://en.wikipedia.org/wiki/Abu_Simbel","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b5/Ramsis%2C_Aswan_Governorate%2C_Egypt_-_panoramio.jpg/960px-Ramsis%2C_Aswan_Governorate%2C_Egypt_-_panoramio.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Abu Simbel is a historic site comprising two massive rock-cut temples in the village of Abu Simbel (Arabic: أبو سمبل), Aswan Governorate, Upper Egypt, near the border with Sudan. It is located on the western bank of Lake Nasser, about 230 km (140 mi) southwest of Aswan (about 300 km (190 mi) by road).\nThe twin temples were originally carved out of the mountainside in the 13th century BC, during the 19th Dynasty reign of the Pharaoh Ramesses II. Their huge external rock relief figures of Ramesses II have become iconic.","history":"During his reign, Ramesses II embarked on an extensive building program throughout Egypt and Nubia, which Egypt controlled. As a major source of gold and many other precious trade goods, Nubia was of great importance to the Egyptians. He therefore built several grand temples in order to impress upon the Nubians Egypt\u0027s might and Egyptianize the people of Nubia. The most prominent temples are the rock-cut temples near the modern village of Abu Simbel, at the Second Nile Cataract, the border between Lower Nubia and Upper Nubia. There are two temples, the Great Temple, dedicated to Ramesses II himself, and the Small Temple, dedicated to his chief wife Queen Nefertari.\nConstruction of the temple complex started in c. 1264 BC and lasted for about 20 years, until 1244 BC. It was known as the Temple of Ramesses, Beloved by Amun.\nWith the passage of time, the temples fell into disuse and the Great Temple eventually became mostly covered by a sand dune. By the 6th century BC, the sand already covered the statues of the main temple up to their knees. The temple remained unknown to Europeans …","other":"อะบูซิมเบล"}},{"th":{"title":"โบสถ์นักบุญจอร์จ (ลาลีเบลา)","url":"https://th.wikipedia.org/wiki/%E0%B9%82%E0%B8%9A%E0%B8%AA%E0%B8%96%E0%B9%8C%E0%B8%99%E0%B8%B1%E0%B8%81%E0%B8%9A%E0%B8%B8%E0%B8%8D%E0%B8%88%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%88_(%E0%B8%A5%E0%B8%B2%E0%B8%A5%E0%B8%B5%E0%B9%80%E0%B8%9A%E0%B8%A5%E0%B8%B2)","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fb/Bete_Giyorgis-Lalibela_%283%29.jpg/960px-Bete_Giyorgis-Lalibela_%283%29.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"โบสถ์นักบุญจอร์จ (อามารา: Bete Giyorgis; อังกฤษ: Church of Saint George) เป็นหนึ่งในสิบเอ็ดโบสถ์โมโนลิธที่เจาะเข้าไปในหินในเมืองลาลีเบลา ภูมิภาคอามฮารา ประเทศเอธิโอเปีย","history":"โบสถ์นักบุญจอร์จ (อามารา: Bete Giyorgis; อังกฤษ: Church of Saint George) เป็นหนึ่งในสิบเอ็ดโบสถ์โมโนลิธที่เจาะเข้าไปในหินในเมืองลาลีเบลา ภูมิภาคอามฮารา ประเทศเอธิโอเปีย\nโบสถ์เกิดขึ้นจากการแกะสลักลงล่างเข้าไปในทัฟฟ์ภูเขาไฟ ระบุอายุการก่อสร้างอยู่ที่ราวศตวรรษที่ 12 หรือต้นศตวรรษที่ 13 เชื่อกันว่าสร้างขึ้นในรัชสมัยของจักรพรรดิลาลีเบลา โบสถ์มักได้รับการเรียกขานให้เป็น \"สิ่งมหัสจรรย์ของโลกลำดับที่แปด\" จักรพรรดิลาลีเบลามีพระราชประสงค์จะสร้างเยรูซาเลมขึ้นมาใหม่ซึ่งแสดงออกผ่านทางการออกแบบสร้างของบรรดาโบสถ์เจาะหินในเมืองลาลีเบลาโดยมีโบสถ์สร้างอยู่เป็นสองกระจุก สู่ถึงเยรูซาเลมบนโลกและเยรูซาเลมในสวรรค์ ตรงกลางมีร่องที่ขุดไว้เป็นทางเพื่อแทนแม่น้ำจอร์แดน โบสถ์นักบุญจอร์จมีขนาด 25 เมตร ต่อ 25 เมตร ต่อ 30 เมตร \nในประวัติศาสตร์เชิงวัฒนธรรมของเอธิโอเปียระบุว่าโบสถ์นี้สร้างขึ้นหลังจักรพรรดิลาลีเบลาแห่งซากเวทรงมีนิมิตให้สร้างโบสถ์ขึ้นจากนักบุญจอร์จ และพระเป็นเจ้า ซึ่งทั้งสองพระองค์ได้มอบวิธีการสร้างโบสถ์ให้แก่จักรพรรดิลาลีเบลา\nลาลีเบลาเป็นจุดหมายปลายทางสำหรับผู้แสวงบุญชาวเอธิโอเปียนออร์ทอดอกซ์ ส่วนโบสถ์นักบุญจอร์จและโบสถ์เจาะหินในลาลีเบลาได้รับสถานะแหล่งมรดกโลกโดยยูเนสโกภายใต้ชื่อ …","other":"Church of Saint George, Lalibela"},"en":{"title":"Church of Saint George, Lalibela","url":"https://en.wikipedia.org/wiki/Church_of_Saint_George,_Lalibela","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/aa/Lalibela%2C_san_giorgio%2C_esterno_24.jpg/960px-Lalibela%2C_san_giorgio%2C_esterno_24.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Church of Saint George (Amharic: ቤተ ጊዮርጊስ, romanized: Betä Giyorgis) is one of eleven rock-hewn monolithic churches in Lalibela, a town in the Amhara Region of Ethiopia. Originally named Roha (Warwar), the historical and religious site was named Lalibela after the King Gebre Mesqel Lalibela of the Zagwe dynasty, who commissioned its construction. He is regarded as a saint by the Ethiopian Orthodox Tewahedo Church.","history":"The Church of Saint George was carved downwards from a type of volcanic tuff. This is the sole architectural material that was used in the structure. It has been dated to the late 12th or early 13th century AD, and thought to have been constructed during the reign of King Gebre Mesqel Lalibela, of the late Zagwe dynasty. It is among the best known and last built of the eleven churches in the Lalibela area, and has been referred to as the \"Eighth Wonder of the World\". Lalibela, King of Ethiopia, sought to recreate Jerusalem, and structured the churches\u0027 landscape and religious sites in such a way as to achieve such a feat. \"The churches at Lalibela are clustered in two major groups, one representing the earthly Jerusalem, and the other representing the heavenly Jerusalem. Located directly between them is a trench representing the River Jordan\". The dimensions of the trench are 25 meters by 25 meters by 30 meters, and there is a small baptismal pool outside the church, which stands in an artificial trench.\nAccording to Ethiopian cultural history, Betä Giyorgis was built after King …","other":"โบสถ์นักบุญจอร์จ (ลาลีเบลา)"}},{"th":{"title":"อาสนวิหารสทราซบูร์","url":"https://th.wikipedia.org/wiki/%E0%B8%AD%E0%B8%B2%E0%B8%AA%E0%B8%99%E0%B8%A7%E0%B8%B4%E0%B8%AB%E0%B8%B2%E0%B8%A3%E0%B8%AA%E0%B8%97%E0%B8%A3%E0%B8%B2%E0%B8%8B%E0%B8%9A%E0%B8%B9%E0%B8%A3%E0%B9%8C","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3d/Cath%C3%A9drale_Strasbourg.jpg/960px-Cath%C3%A9drale_Strasbourg.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"อาสนวิหารสทราซบูร์ (ฝรั่งเศส: Cathédrale de Strasbourg) หรือ อาสนวิหารแม่พระแห่งสทราซบูร์ (ฝรั่งเศส: Cathédrale Notre-Dame de Strasbourg) เป็นโบสถ์โรมันคาทอลิกที่มีฐานะเป็นอาสนวิหาร ตั้งอยู่ที่เมืองสทราซบูร์ แคว้นกร็องแต็สต์ ประเทศฝรั่งเศส อันเป็นที่ตั้งของอัครมุขมณฑลสทราซบูร์ ส่วนหลักของสถาปัตยกรรมเป็นแบบโรมาเนสก์ แต่ยังมีส่วนประกอบที่สำคัญของสถาปัตยกรรมแบบกอทิกตอนปลายที่งดงามที่สุดแห่งหนี่ง\nอาสนวิหารสทราซบูร์เคยได้รับการบันทึกเป็นสิ่งก่อสร้างที่มีความสูงที่สุดในโลก ในช่วงปี ค.ศ. 1647 จนถึงปี ค.ศ.","history":"อาสนวิหารสทราซบูร์ (ฝรั่งเศส: Cathédrale de Strasbourg) หรือ อาสนวิหารแม่พระแห่งสทราซบูร์ (ฝรั่งเศส: Cathédrale Notre-Dame de Strasbourg) เป็นโบสถ์โรมันคาทอลิกที่มีฐานะเป็นอาสนวิหาร ตั้งอยู่ที่เมืองสทราซบูร์ แคว้นกร็องแต็สต์ ประเทศฝรั่งเศส อันเป็นที่ตั้งของอัครมุขมณฑลสทราซบูร์ ส่วนหลักของสถาปัตยกรรมเป็นแบบโรมาเนสก์ แต่ยังมีส่วนประกอบที่สำคัญของสถาปัตยกรรมแบบกอทิกตอนปลายที่งดงามที่สุดแห่งหนี่ง\nอาสนวิหารสทราซบูร์เคยได้รับการบันทึกเป็นสิ่งก่อสร้างที่มีความสูงที่สุดในโลก ในช่วงปี ค.ศ. 1647 จนถึงปี ค.ศ. 1874 ด้วยความสูงถึง 142 เมตร ซึ่งในปัจจุบัน ถือเป็นวิหารที่สูงที่สุดอันดับที่หกของโลก และสูงที่สุดเป็นอันดับสองรองจากอาสนวิหารรูอ็อง และยังถือเป็นวิหารที่สูงที่สุดที่สร้างในยุคกลาง ที่ยังคงสภาพอยู่ในปัจจุบัน\nอาสนวิหารได้รับการขึ้นทะเบียนเป็นมรดกโลกโดยยูเนสโก ร่วมกับกร็องดีล อันเป็นเกาะที่ตั้งของอาสนวิหาร ในปัจจุบันมีนักท่องเที่ยวเข้าเยี่ยมชมปีละประมาณ 4 ล้านคน โดยถือเป็นอาสนวิหารที่มีนักท่องเที่ยวต่อปีมากที่สุดรองจากอาสนวิหารแม่พระแห่งปารีส","other":"Strasbourg Cathedral"},"en":{"title":"Strasbourg Cathedral","url":"https://en.wikipedia.org/wiki/Strasbourg_Cathedral","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7e/Strasbourg_Cathedral_Exterior_-_Diliff.jpg/960px-Strasbourg_Cathedral_Exterior_-_Diliff.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Strasbourg Cathedral or the Cathedral of Our Lady of Strasbourg (French: Cathédrale Notre-Dame de Strasbourg, or Cathédrale de Strasbourg, German: Liebfrauenmünster zu Straßburg), also known as Strasbourg Minster (German: Straßburger Münster), is a Catholic cathedral in Strasbourg, Alsace, France. Although considerable parts of it are still in Romanesque architecture, it is widely considered to be among the finest examples of Rayonnant Gothic architecture. Architect Erwin von Steinbach is credited for major contributions from 1277 to his death in 1318, and beyond through his son Johannes von Steinbach, and his grandson Gerlach von Steinbach, who succeeded him as chief architects.","history":"The history of Strasbourg\u0027s cathedral is well documented thanks to the archives of the Notre-Dame Foundation, the city of Strasbourg, and the archdiocese. Archaeological excavations below and around the cathedral have been conducted in 1896–1897, 1907, 1923–1924, 1947–1948, between 1966 and 1972, and finally between 2012 and 2014.\nA Roman settlement called Argentoratum, twenty hectares in size, existed on the site since about 12 B.C., at a strategic point where bridges crossed the Rhine and two of its tributaries. It became a major trading center for wine, grain, and later for textiles and luxury products. Christianity was first imposed in 313 by the Edict of Constantine. The first recorded bishop, Amand, participated in the Councils of Cologne and Sardique in 346 and 347. A paleochristian church or cathedral is believed to have been founded by an edict of Clovis I, but its exact location and appearance is unknown.\nThe first cathedral built on the present site was erected by the bishop Saint Arbogast in about 550–575. Under Charlemagne, the Bishop Remi consecrated the altar and …","other":"อาสนวิหารสทราซบูร์"}}];

function wikiHistory(lang, title) {
  const k = lang + "|" + title;
  if (!historyCache[k]) {
    const url = `https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=extracts&explaintext=1&exsectionformat=wiki&redirects=1&titles=${encodeURIComponent(title)}`;
    historyCache[k] = fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(j => {
      const p = j && j.query && j.query.pages && Object.values(j.query.pages)[0];
      const full = (p && p.extract) || "";
      if (!full) return "";
      const parts = full.split(/\n(={2,})\s*(.+?)\s*\1\n/);
      // parts: [intro, "==", heading, text, "==", heading, text, ...]
      let out = "";
      for (let i = 1; i < parts.length; i += 3) {
        if (/^(history|historical background|background|ประวัติ|ความเป็นมา|ประวัติความเป็นมา)/i.test(parts[i + 1])) {
          const level = parts[i].length;
          out = parts[i + 2];
          for (let k2 = i + 3; k2 < parts.length && parts[k2].length > level; k2 += 3) out += "\n" + parts[k2 + 2];
          break;
        }
      }
      if (!out.trim()) out = parts[0];
      out = out.replace(/\n{2,}/g, "\n").trim();
      if (out.length > 1100) {
        const cut = out.slice(0, 1100);
        const end = Math.max(cut.lastIndexOf(". "), cut.lastIndexOf(".\n"), cut.lastIndexOf(" "), cut.lastIndexOf("\n"));
        out = cut.slice(0, end > 600 ? end + 1 : 1100).trim() + " …";
      }
      return out;
    }).catch(() => { delete historyCache[k]; return ""; });
  }
  return historyCache[k];
}
function revealExtras(card, c) {
  const tools = document.createElement("div"); tools.className = "actions";
  const zoomBtn = document.createElement("button"); zoomBtn.type = "button"; zoomBtn.className = "btn alt"; zoomBtn.textContent = rt("zoomReal");
  zoomBtn.onclick = () => { setSatellite(true); satBtn.textContent = rt("mapView"); map.flyTo([c.lat, c.lon], 17); document.querySelector(".mapwrap").scrollIntoView({ behavior: "smooth", block: "center" }); };
  const satBtn = document.createElement("button"); satBtn.type = "button"; satBtn.className = "btn alt"; satBtn.textContent = satOn ? rt("mapView") : rt("sat");
  satBtn.onclick = () => { setSatellite(!satOn); satBtn.textContent = satOn ? rt("mapView") : rt("sat"); };
  tools.append(zoomBtn, satBtn);
  const box = document.createElement("figure"); box.className = "wiki";
  const loading = document.createElement("figcaption"); loading.textContent = rt("wikiLoading");
  box.append(loading);
  card.append(tools, box);
  const forLang = LANG;
  wikiFor(c).then(w => {
    if (!box.isConnected || forLang !== LANG) return;
    box.replaceChildren();
    if (!w) { box.remove(); return; }
    if (w.img) { const img = document.createElement("img"); img.src = w.img; img.alt = w.title; img.loading = "lazy"; box.append(img); }
    const cap = document.createElement("figcaption");
    const h = document.createElement("b"); h.textContent = (w.noTh && c.histTh) ? (c.th ? c.th.place : c.place) : w.title;
    const p = document.createElement("span"); p.textContent = w.text ? " " + w.text : "";
    cap.append(h, p);
    if (w.url && /^https:\/\/[a-z]+\.wikipedia\.org\//.test(w.url)) {
      const a = document.createElement("a"); a.href = w.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = " " + rt("wikiMore");
      cap.append(a);
    }
    box.append(cap);
    // Thai reader with no Thai article: use the case's own Thai history, else the English one with a note.
    const histP = (w.noTh && c.histTh) ? Promise.resolve(c.histTh)
      : (typeof w.history === "string" ? Promise.resolve(w.history) : wikiHistory(w.lang || "en", w.title));
    histP.then(hist => {
      if (!hist || !box.isConnected || forLang !== LANG) return;
      const sec = document.createElement("section"); sec.className = "history";
      const hh = document.createElement("h3"); hh.textContent = rt("history");
      sec.append(hh);
      if (w.noTh && !c.histTh) { const note = document.createElement("p"); note.className = "note"; note.textContent = rt("noThai"); sec.append(note); }
      hist.split("\n").forEach(line => { if (line.trim()) { const para = document.createElement("p"); para.textContent = line.trim(); sec.append(para); } });
      box.append(sec);
    });
  });
}
