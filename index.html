<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Robert Random</title>
<meta name="description" content="ปริศนารายวันแบบนักสัญลักษณ์วิทยา: ถอดรหัสคำใบ้ 5 ข้อ แล้วปักหมุดสถานที่ประวัติศาสตร์บนแผนที่โลก · A daily symbologist's riddle: decode five clues and pin the historic place on the world map.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+Thai:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Single dark look: a candle-lit archive. Gold leaf for structure, wax red for the live pin. */
:root {
  --bg: #100e0b; --panel: #1a1611; --panel-2: #221d16; --ink: #ece2c8; --muted: #a8997a; --line: #3a3124; --gold: #c9a24a; --gold-dim: #8a7034;
  --wax: #b3362b; --wax-ink: #fff4e6;
  --hit: #4e9a5f; --warm: #c9a24a; --mid: #c8702e; --cold: #a8322a; --empty: #1f1a14;
  --font-display: "Cinzel", "Noto Serif Thai", Georgia, serif;
  --font-body: "Noto Serif Thai", Georgia, "Leelawadee UI", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  background-image: radial-gradient(1200px 600px at 70% -10%, rgba(201,162,74,.08), transparent 60%);
  font-family: var(--font-body); font-size: 15.5px; line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(16px, env(safe-area-inset-top, 0px)) 24px;
}
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
[hidden] { display: none !important; }

.top { max-width: 1280px; margin: 0 auto 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 27px; letter-spacing: .06em; line-height: 1; display: flex; align-items: center; gap: 10px; color: var(--gold); }
.caseno { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; }
.top .spacer { flex: 1; }
.ghost { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 14px; color: var(--ink); }
.ghost:hover { border-color: var(--gold-dim); }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.lang button { background: none; border: 0; padding: 6px 11px; cursor: pointer; font-size: 14px; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--gold); color: #1a1408; }

.app { max-width: 1280px; margin: 0 auto; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.mapwrap { position: relative; height: clamp(380px, 64vh, 560px); border-radius: 10px; overflow: hidden; border: 1px solid var(--gold-dim); box-shadow: 0 0 0 4px var(--panel), 0 0 0 5px var(--line); }
@media (min-width: 900px) {
  .app { grid-template-columns: minmax(0, 1.3fr) minmax(340px, 1fr); align-items: start; }
  .mapwrap { position: sticky; top: 16px; height: min(880px, calc(100dvh - 96px)); min-height: 560px; }
}
#map { width: 100%; height: 100%; cursor: crosshair; background: #2a241b; }
#map .leaflet-tile-pane { filter: sepia(.25) contrast(1.03); }
.leaflet-container { font-family: var(--font-body); }
.leaflet-bar a { background: var(--panel); color: var(--ink); border-color: var(--line); }
.leaflet-control-attribution { background: rgba(26,22,17,.85) !important; color: var(--muted); }
.leaflet-control-attribution a { color: var(--gold); }
.hud { position: absolute; left: 10px; right: 10px; bottom: 24px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; z-index: 500; pointer-events: none; }
.hud > * { pointer-events: auto; }
.readout { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 13px; min-width: 0; }
.readout .mono { color: var(--muted); font-family: var(--font-mono); font-size: 12px; }
.confirm { background: var(--wax); color: var(--wax-ink); border: 0; border-radius: 6px; padding: 9px 16px; font-family: var(--font-display); font-weight: 700; letter-spacing: .04em; font-size: 15px; cursor: pointer; }
.confirm:disabled { opacity: .4; cursor: not-allowed; }
.pin { background: none; border: 0; }

.file { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; min-width: 0; }
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-dim); }
.object { font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1.25; margin: 4px 0 6px; color: var(--ink); }
.brief { margin: 0; max-width: 62ch; color: var(--muted); }
.clues { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.clue { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: center; padding: 11px 14px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); }
.clue .n { font-family: "Cinzel", Georgia, serif; font-weight: 700; font-size: 15px; color: var(--gold); text-align: center; border-right: 1px solid var(--line); padding-right: 8px; }
.clue .txt { margin: 0; }
.clue:first-child .txt { font-style: italic; }
.clue.locked { background: none; border-style: dashed; color: var(--muted); }
.clue.locked .n { color: var(--gold-dim); }
.clue.new { animation: reveal .6s ease-out; }
@keyframes reveal { from { opacity: .2; filter: blur(3px); } to { opacity: 1; filter: none; } }

.rows { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.row { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto 30px; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 7px; background: var(--empty); min-height: 42px; }
.row .i { font-family: "Cinzel", Georgia, serif; font-size: 13px; color: var(--gold-dim); }
.row .place { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .km { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 13.5px; }
.row .dir { width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; color: #fff; }
.row.filled { background: transparent; border: 1px solid var(--line); }
.t-hit { background: var(--hit); } .t-warm { background: var(--warm); color: #1a1408 !important; } .t-mid { background: var(--mid); } .t-cold { background: var(--cold); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

.result { border-color: var(--gold-dim); }
.result h2 { font-family: var(--font-display); font-size: 22px; margin: 2px 0 4px; line-height: 1.3; color: var(--gold); }
.result p { margin: 0 0 10px; }
.share { font-family: var(--font-mono); white-space: pre; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 10px 12px; font-size: 13.5px; line-height: 1.5; overflow-x: auto; user-select: all; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
.btn { background: var(--gold); color: #1a1408; border: 0; border-radius: 6px; padding: 9px 14px; cursor: pointer; font-weight: 500; text-decoration: none; display: inline-block; }
.btn.alt { background: none; color: var(--ink); border: 1px solid var(--line); }
.next { font-size: 13px; color: var(--muted); }
.wiki { margin: 14px 0 0; display: grid; gap: 8px; }
.wiki img { width: 100%; max-height: 300px; object-fit: cover; border-radius: 8px; display: block; border: 1px solid var(--line); background: var(--bg); }
.wiki figcaption { font-size: 14px; color: var(--muted); }
.wiki figcaption b { color: var(--ink); }
.wiki a { color: var(--gold); }
.history { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }
.history h3 { font-family: var(--font-display); font-size: 17px; margin: 0 0 6px; color: var(--gold); letter-spacing: .04em; }
.history p { margin: 0 0 8px; max-width: 70ch; }
#map.sat .leaflet-tile-pane { filter: none; }

.foot { max-width: 1280px; margin: 18px auto 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.foot img { height: 20px; display: block; }
.foot a { color: var(--gold); }

dialog { border: 1px solid var(--gold-dim); border-radius: 10px; background: var(--panel); color: var(--ink); max-width: min(540px, calc(100vw - 32px)); padding: 20px 22px; }
dialog::backdrop { background: rgba(0, 0, 0, .6); }
dialog h3 { font-family: var(--font-display); font-size: 21px; margin: 0 0 8px; color: var(--gold); }
dialog ol { padding-left: 20px; margin: 0 0 12px; }
@media (prefers-reduced-motion: reduce) { .clue.new { animation: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M13 3 L20 18 H6 Z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M13 23 L6 8 H20 Z" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".55"/></svg>
    <span data-t="brand">Robert Random</span>
  </div>
  <span class="caseno" id="caseno"></span>
  <span class="spacer"></span>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="th" aria-pressed="true">ไทย</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
  <button class="ghost" id="helpBtn" type="button" data-t="help">วิธีเล่น</button>
</header>

<main class="app">
  <section class="mapwrap" aria-label="Map">
    <div id="map"></div>
    <div class="hud">
      <div class="readout" id="readout"></div>
      <button class="confirm" id="confirm" type="button" disabled data-t="confirm">ยืนยันหมุด</button>
    </div>
  </section>

  <div class="file">
    <article class="card">
      <div class="eyebrow" data-t="daily"></div>
      <h1 class="object" data-t="question"></h1>
      <p class="brief" data-t="brief"></p>
      <ol class="clues" id="clues"></ol>
    </article>

    <article class="card result" id="resultCard" hidden></article>

    <article class="card">
      <div class="eyebrow"><span data-t="yourPins"></span> <span id="tries"></span></div>
      <div class="rows" id="rows"></div>
      <div class="legend">
        <span><i class="t-hit"></i><span data-t="lgHit"></span></span>
        <span><i class="t-warm"></i>≤ 50 <span data-t="km"></span></span>
        <span><i class="t-mid"></i>≤ 500 <span data-t="km"></span></span>
        <span><i class="t-cold"></i><span data-t="lgCold"></span></span>
      </div>
    </article>
  </div>
</main>

<footer class="foot">
  <span data-t="visits"></span>
  <img id="visitBadge" alt="">
  <span>·</span>
  <a href="thailand.html" data-t="thaiLink"></a>
</footer>

<dialog id="help">
  <h3 data-t="helpTitle"></h3>
  <ol id="helpList"></ol>
  <form method="dialog"><button class="btn" type="submit" data-t="gotIt"></button></form>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

const WIKI = [{"th":{"title":"พีระมิดลูฟวร์","url":"https://th.wikipedia.org/wiki/%E0%B8%9E%E0%B8%B5%E0%B8%A3%E0%B8%B0%E0%B8%A1%E0%B8%B4%E0%B8%94%E0%B8%A5%E0%B8%B9%E0%B8%9F%E0%B8%A7%E0%B8%A3%E0%B9%8C","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/66/Louvre_Museum_Wikimedia_Commons.jpg/960px-Louvre_Museum_Wikimedia_Commons.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"พีระมิดลูฟวร์ (อังกฤษ: Louvre Pyramid) เป็นพีระมิดที่สร้างขึ้นจากกระจกและโลหะ มีพีระมิดขนาดเล็กกว่า 3 หลังตั้งอยู่โดยรอบ ตั้งอยู่ที่ลานหน้าพิพิธภัณฑสถานลูฟวร์ในกรุงปารีส ประเทศฝรั่งเศส ทำหน้าที่เป็นทางเข้าหลักของพิพิธภัณฑ์ สร้างเสร็จเมื่อ พ.ศ.","history":"พีระมิดลูฟวร์ (อังกฤษ: Louvre Pyramid) เป็นพีระมิดที่สร้างขึ้นจากกระจกและโลหะ มีพีระมิดขนาดเล็กกว่า 3 หลังตั้งอยู่โดยรอบ ตั้งอยู่ที่ลานหน้าพิพิธภัณฑสถานลูฟวร์ในกรุงปารีส ประเทศฝรั่งเศส ทำหน้าที่เป็นทางเข้าหลักของพิพิธภัณฑ์ สร้างเสร็จเมื่อ พ.ศ. 2532 และกลายเป็นหนึ่งในจุดสังเกตของกรุงปารีส","other":"Louvre Pyramid"},"en":{"title":"Louvre Pyramid","url":"https://en.wikipedia.org/wiki/Louvre_Pyramid","img":"https://thumb.wikimedia.org/wikipedia/en/thumb/4/42/Louvre_Pyramid.jpg/960px-Louvre_Pyramid.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Louvre Pyramid (French: Pyramide du Louvre) is a large glass-and-metal entrance way and skylight designed by the Chinese-American architect I. M. Pei. The pyramid is in the main courtyard (Cour Napoléon) of the Louvre Palace in Paris, surrounded by three smaller pyramids of the same style which also serve as lightwells.  A companion Inverted Pyramid also provides light to underground passageways of the Louvre.","history":"The Louvre Pyramid (French: Pyramide du Louvre) is a large glass-and-metal entrance way and skylight designed by the Chinese-American architect I. M. Pei. The pyramid is in the main courtyard (Cour Napoléon) of the Louvre Palace in Paris, surrounded by three smaller pyramids of the same style which also serve as lightwells.  A companion Inverted Pyramid also provides light to underground passageways of the Louvre.  The large pyramid serves as the main entrance way to the Louvre Museum, allowing light to the below ground visitors hall, while also allowing sight lines of the palace to visitors in the hall, and through access galleries to the different wings of the palace. On three sides are low modernist triangular reflecting pools with fountains. Completed in 1989 as part of the broader Grand Louvre project, it has become a landmark of Paris and a symbol of the museum.","other":"พีระมิดลูฟวร์"}},{"th":null,"en":{"title":"Rosslyn Chapel","url":"https://en.wikipedia.org/wiki/Rosslyn_Chapel","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d5/Rosslyn_Chapel_%28Mentioned_in_Dan_Brown%27s_DaVinci_Code%29.jpg/960px-Rosslyn_Chapel_%28Mentioned_in_Dan_Brown%27s_DaVinci_Code%29.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Rosslyn Chapel, also known as the Collegiate Chapel of Saint Matthew, is a 15th-century Episcopal chapel located in the village of Roslin in Midlothian, Scotland. The chapel was founded by William Sinclair, 1st Earl of Caithness with a ground-breaking ceremony in 1456. After the Scottish Reformation in 1560, it was largely abandoned but, following a visit by Queen Victoria, it was rededicated in 1862.","history":"The chapel is dedicated to Saint Matthew the Evangelist and was founded on a small hill above Roslin Glen as a collegiate church (with between four and six ordained canons and two boy choristers) in the mid-15th century. The chapel was founded by William Sinclair, 1st Earl of Caithness of the Scoto-Norman Sinclair family. Rosslyn Chapel is the third Sinclair place of worship at Roslin, the first being in Roslin Castle and the second (whose crumbling buttresses can still be seen today) in what is now Roslin Cemetery.\nSinclair founded the college to celebrate the Liturgy of the Hours throughout the day and night, and also to celebrate Catholic Masses for all the faithful departed, including the deceased members of the Sinclair family. During this period, the rich heritage of plainsong (a single melodic line) or polyphony (vocal harmony) were used to enrich the singing of the liturgy. Sinclair provided an endowment to pay for the support of the priests and choristers in perpetuity.\nAfter the Scottish Reformation in 1560, Catholic worship in the chapel was brought to an end. The …","other":null}},{"th":{"title":"วิหารแพนธีอัน","url":"https://th.wikipedia.org/wiki/%E0%B8%A7%E0%B8%B4%E0%B8%AB%E0%B8%B2%E0%B8%A3%E0%B9%81%E0%B8%9E%E0%B8%99%E0%B8%98%E0%B8%B5%E0%B8%AD%E0%B8%B1%E0%B8%99","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ef/Pantheon_Rom_1_cropped.jpg/960px-Pantheon_Rom_1_cropped.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"วิหารแพนธีอัน (อังกฤษ: Pantheon,  หรือ ; ละติน: Pantheum, มาจาก กรีก: Πάνθεον ที่แปลว่า “พระเจ้าทั้งหมด”) เป็นสิ่งก่อสร้างที่มีความสำคัญทางประวัติศาสตร์ตั้งอยู่ในกรุงโรม เดิมสร้างโดยมาร์กุส วิปซานิอุส อากริปปา เพื่อเป็นเทวสถานสำหรับเทพเจ้าทั้งปวงของโรมันโบราณ ก่อนจะได้รับการสร้างใหม่ทั้งหมดในรัชสมัยของจักรพรรดิเฮเดรียน (ประมาณ ค.ศ.","history":"วิหารแพนธีอัน (อังกฤษ: Pantheon,  หรือ ; ละติน: Pantheum, มาจาก กรีก: Πάνθεον ที่แปลว่า “พระเจ้าทั้งหมด”) เป็นสิ่งก่อสร้างที่มีความสำคัญทางประวัติศาสตร์ตั้งอยู่ในกรุงโรม เดิมสร้างโดยมาร์กุส วิปซานิอุส อากริปปา เพื่อเป็นเทวสถานสำหรับเทพเจ้าทั้งปวงของโรมันโบราณ ก่อนจะได้รับการสร้างใหม่ทั้งหมดในรัชสมัยของจักรพรรดิเฮเดรียน (ประมาณ ค.ศ. 126)\nวิหารนี้เป็นหนึ่งในสิ่งก่อสร้างจากยุคโรมันที่ยังคงสภาพสมบูรณ์ที่สุดในโลก ส่วนหนึ่งเป็นเพราะมีการใช้งานอย่างต่อเนื่องตลอดประวัติศาสตร์ โดยตั้งแต่คริสต์ศตวรรษที่ 7 เป็นต้นมา ได้เปลี่ยนสถานะเป็นคริสต์ศาสนสถานของโรมันคาทอลิก ในชื่อ บาซิลิกาเซนต์แมรีและเหล่ามรณสักขี (ละติน: Basilica Sanctae Mariae ad Martyres)\nในทางสถาปัตยกรรม แพนธีอันมีชื่อเสียงระดับโลกจากโดมคอนกรีตไม่เสริมเหล็กที่มีขนาดใหญ่ที่สุดในโลก ซึ่งมีความสูงของช่องตา (oculus) บนเพดานและเส้นผ่าศูนย์กลางของโดมวัดจากด้านในเท่ากับ 43.3 เมตรเท่ากัน นอกจากนี้ วิหารยังเป็นที่ฝังศพของบุคคลสำคัญ เช่น จิตรกรราฟาเอล และกษัตริย์แห่งอิตาลี","other":"Pantheon, Rome"},"en":{"title":"Pantheon, Rome","url":"https://en.wikipedia.org/wiki/Pantheon,_Rome","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7b/Pantheon_%28Rome%29_-_Right_side_and_front.jpg/960px-Pantheon_%28Rome%29_-_Right_side_and_front.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Pantheon (UK: , US: ; Latin: Pantheum, from Ancient Greek  Πάνθειον (Pantheion) \u0027[temple] of all the gods\u0027) is an ancient temple in Rome, Italy, originally built under Roman emperor Augustus (27 BC–AD 14) and reconstructed under Hadrian (117–138).\nSince AD 609, it has served as a Roman Catholic church designated as the Basilica of Saint Mary and the Holy Martyrs (Italian: Basilica di Santa Maria ad Martyres) with the special Pontifical privilege of immemorial status. \nThe current Pantheon was built on the site of an earlier temple, which had been commissioned by Marcus Vipsanius Agrippa during the reign of Augustus.","history":"In the aftermath of the Battle of Actium (31 BC), Marcus Vipsanius Agrippa started an impressive building program. The Pantheon was a part of the complex created by him on his own property in the Campus Martius in 29–19 BC, which included three buildings aligned from south to north: the Baths of Agrippa, the Basilica of Neptune, and the Pantheon. It seems likely that the Pantheon and the Basilica of Neptune were Agrippa\u0027s sacra privata, not aedes publicae (public temples). The former would help explain how the building could have so easily lost its original name and purpose (Ziolkowski contends that it was originally the Temple of Mars in Campo) in such a relatively short period of time.\nThe only passages referring to the decoration of the Agrippan Pantheon written by an eyewitness are in Pliny the Elder\u0027s Natural History. From him we know that \"the capitals, too, of the pillars, which were placed by M. Agrippa in the Pantheon, are made of Syracusan bronze\", that \"the Pantheon of Agrippa has been decorated by Diogenes of Athens, and the Caryatides, by him, which form the columns of …","other":"วิหารแพนธีอัน"}},{"th":{"title":"ซากราดาฟามิลิอา","url":"https://th.wikipedia.org/wiki/%E0%B8%8B%E0%B8%B2%E0%B8%81%E0%B8%A3%E0%B8%B2%E0%B8%94%E0%B8%B2%E0%B8%9F%E0%B8%B2%E0%B8%A1%E0%B8%B4%E0%B8%A5%E0%B8%B4%E0%B8%AD%E0%B8%B2","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/26/%CE%A3%CE%B1%CE%B3%CF%81%CE%AC%CE%B4%CE%B1_%CE%A6%CE%B1%CE%BC%CE%AF%CE%BB%CE%B9%CE%B1_2941.jpg/960px-%CE%A3%CE%B1%CE%B3%CF%81%CE%AC%CE%B4%CE%B1_%CE%A6%CE%B1%CE%BC%CE%AF%CE%BB%CE%B9%CE%B1_2941.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"ซากราดาฟามิลิอา (กาตาลา: Temple Expiatori de la Sagrada Família) หรือ ซากราดาฟามิเลีย (สเปน: Templo Expiatorio de la Sagrada Familia) เป็นสถาปัตยกรรมประจำเมืองบาร์เซโลนา แคว้นกาตาลุญญา ประเทศสเปนที่ออกแบบโดยอันตอนี เกาดี สถาปนิกชาวกาตาลา เป็นผลงานในแนวมูดาร์นิซมา ซึ่งเป็นงานศิลปะเฉพาะถิ่นและเป็นนวศิลป์ที่มีเอกลักษณ์เฉพาะตัวของกาตาลุญญา\nงานชิ้นนี้เริ่มสร้างตั้งแต่ปี พ.ศ. 2425 มีกำหนดก่อสร้างหอคอยทั้งหมด 18 หอคอย นับตั้งแต่ปีเริ่มสร้างจนถึงปัจจุบันสร้างเสร็จไปแล้วแค่ 8 หอคอย งานคืบหน้าไปประมาณร้อยละ 50 สถาปนิกผู้ออกแบบถูกรถรางทับเสียชีวิตไปเมื่อ พ.ศ. 2469 โดยศพของเขาได้ถูกฝังไว้ในซากราดาฟามิลิอาด้วย\nแม้เกาดีจะเสียชีวิตไปแล้ว แต่ผู้ร่วมงานของเขายังคงสานต่อโครงการโดยอาศัยรูปถ่าย ภาพร่าง และแบบจำลองที่เกาดีทำไว้ แต่แล้วในปี พ.ศ.","history":"ซากราดาฟามิลิอา (กาตาลา: Temple Expiatori de la Sagrada Família) หรือ ซากราดาฟามิเลีย (สเปน: Templo Expiatorio de la Sagrada Familia) เป็นสถาปัตยกรรมประจำเมืองบาร์เซโลนา แคว้นกาตาลุญญา ประเทศสเปนที่ออกแบบโดยอันตอนี เกาดี สถาปนิกชาวกาตาลา เป็นผลงานในแนวมูดาร์นิซมา ซึ่งเป็นงานศิลปะเฉพาะถิ่นและเป็นนวศิลป์ที่มีเอกลักษณ์เฉพาะตัวของกาตาลุญญา\nงานชิ้นนี้เริ่มสร้างตั้งแต่ปี พ.ศ. 2425 มีกำหนดก่อสร้างหอคอยทั้งหมด 18 หอคอย นับตั้งแต่ปีเริ่มสร้างจนถึงปัจจุบันสร้างเสร็จไปแล้วแค่ 8 หอคอย งานคืบหน้าไปประมาณร้อยละ 50 สถาปนิกผู้ออกแบบถูกรถรางทับเสียชีวิตไปเมื่อ พ.ศ. 2469 โดยศพของเขาได้ถูกฝังไว้ในซากราดาฟามิลิอาด้วย\nแม้เกาดีจะเสียชีวิตไปแล้ว แต่ผู้ร่วมงานของเขายังคงสานต่อโครงการโดยอาศัยรูปถ่าย ภาพร่าง และแบบจำลองที่เกาดีทำไว้ แต่แล้วในปี พ.ศ. 2479 โครงการก็ต้องหยุดชะงักเพราะสงครามกลางเมืองในสเปน ห้องใต้ดินและแบบจำลองอย่างละเอียดก็ถูกเผาทำลาย แต่เมื่อสิ้นสุดสงครามทีมงานก็กลับมาทำงานกันต่อ โดยอาศัยภาพร่าง ภาพถ่ายและแบบจำลองอื่น ๆ ที่รอดพ้นจากการถูกทำลาย ภายหลังได้นำคอมพิวเตอร์มาใช้ออกแบบ แต่ถึงจะใช้เทคโนโลยีมากมายมาช่วย กว่าโครงการนี้จะเสร็จก็อีกยาวไกลถึงปี พ.ศ. 2569 …","other":"Sagrada Família"},"en":{"title":"Sagrada Família","url":"https://en.wikipedia.org/wiki/Sagrada_Fam%C3%ADlia","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ef/SF_maig_2_cropped.jpg/960px-SF_maig_2_cropped.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Basílica i Temple Expiatori de la Sagrada Família, or simply Sagrada Família, is a Catholic Basilica in the Eixample district of Barcelona, Catalonia, Spain. Designed by the Catalan architect Antoni Gaudí, it is the tallest church \nin the world. On 7 November 2010, Pope Benedict XVI consecrated the church and proclaimed it a basilica.","history":"Sagrada Família was inspired by a bookseller, José María Bocabella, founder of Asociación Espiritual de Devotos de San José (Spiritual Association of Devotees of St. Joseph). After a visit to the Vatican in 1872, Bocabella returned from Italy with the intention of building a church inspired by the basilica at Loreto. It was to be an \"expiatory temple\", funded entirely by donations from persons seeking to counter a growing rejection of the Catholic Church and its values. The apse crypt of the church was begun on 19 March 1882, on the festival of St. Joseph, to the design of the architect Francisco de Paula del Villar, whose plan was for a Gothic revival church of a standard form. The apse crypt was completed before Villar\u0027s resignation on 18 March 1883, when Antoni Gaudí assumed responsibility for its design, which he changed radically. Gaudí began work on the church in November of 1883 but was not appointed Architect Director until 28 March 1884.\nOn the subject of the extremely long construction period, Gaudí is said to have remarked: \"My client is not in a hurry.\" When Gaudí died …","other":"ซากราดาฟามิลิอา"}},{"th":{"title":"อาคารรัฐสภาสหรัฐ","url":"https://th.wikipedia.org/wiki/%E0%B8%AD%E0%B8%B2%E0%B8%84%E0%B8%B2%E0%B8%A3%E0%B8%A3%E0%B8%B1%E0%B8%90%E0%B8%AA%E0%B8%A0%E0%B8%B2%E0%B8%AA%E0%B8%AB%E0%B8%A3%E0%B8%B1%E0%B8%90","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4f/US_Capitol_west_side.JPG/960px-US_Capitol_west_side.JPG?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"อาคารรัฐสภาสหรัฐ หรือทับศัพท์ว่า ยูเอสแคปพิตอล (อังกฤษ: United States Capitol; U.S. Capitol) เป็นอาคารรัฐสภาแห่งสหรัฐ ตั้งอยู่ ณ กรุงวอชิงตัน ดีซี สหรัฐ เป็นสถานที่ประชุมของสถาบันฝ่ายนิติบัญญัติสูงสุดในระบบการปกครองของสหรัฐ และถือเป็นสัญลักษณ์ของกรุงวอชิงตัน ดีซี ออกแบบโดย วิลเลียม ทอร์นตัน เริ่มก่อสร้างเมื่อ 18 กันยายน ค.ศ. 1793 สร้างเสร็จในปี ค.ศ. 1800 ใช้เวลาสร้าง 7 ปี ตัวอาคารมีลักษณะก่อด้วยหินอ่อนสีขาว เป็นอาคาร 5 ชั้น มีโดมสูง 268 ฟุต ยาว 750 ฟุต กว้าง 375 ฟุต ภายในตกแต่งด้วยหินอ่อนและแกะสลักลวดลายเสาแบบกรีก มีภาพสีน้ำมันที่เป็นสถาปัตยกรรมที่สวยงาม อาคารรัฐสภาสหรัฐเป็นต้นแบบในการก่อสร้างอาคารของรัฐบาลอื่น ๆ เช่น ทำเนียบขาว สำนักงานราชการ ศาลตุลาการ ฯลฯ โดยมีลักษณะเป็นหินอ่อนสีขาวสไตล์นีโอคลาสสิค ทางฝั่งตะวันออกและฝั่งตะวันตกมีลักษณะที่แตกต่างกันไปตามชื่อเรียก แต่ในส่วนของฝั่งตะวันออกจะใช้ในการรับรองผู้เยี่ยมเยียนและบุคคลสำคัญระดับประเทศเท่านั้น\nในวันที่ 11 กันยายน พ.ศ.","history":"อาคารรัฐสภาสหรัฐ หรือทับศัพท์ว่า ยูเอสแคปพิตอล (อังกฤษ: United States Capitol; U.S. Capitol) เป็นอาคารรัฐสภาแห่งสหรัฐ ตั้งอยู่ ณ กรุงวอชิงตัน ดีซี สหรัฐ เป็นสถานที่ประชุมของสถาบันฝ่ายนิติบัญญัติสูงสุดในระบบการปกครองของสหรัฐ และถือเป็นสัญลักษณ์ของกรุงวอชิงตัน ดีซี ออกแบบโดย วิลเลียม ทอร์นตัน เริ่มก่อสร้างเมื่อ 18 กันยายน ค.ศ. 1793 สร้างเสร็จในปี ค.ศ. 1800 ใช้เวลาสร้าง 7 ปี ตัวอาคารมีลักษณะก่อด้วยหินอ่อนสีขาว เป็นอาคาร 5 ชั้น มีโดมสูง 268 ฟุต ยาว 750 ฟุต กว้าง 375 ฟุต ภายในตกแต่งด้วยหินอ่อนและแกะสลักลวดลายเสาแบบกรีก มีภาพสีน้ำมันที่เป็นสถาปัตยกรรมที่สวยงาม อาคารรัฐสภาสหรัฐเป็นต้นแบบในการก่อสร้างอาคารของรัฐบาลอื่น ๆ เช่น ทำเนียบขาว สำนักงานราชการ ศาลตุลาการ ฯลฯ โดยมีลักษณะเป็นหินอ่อนสีขาวสไตล์นีโอคลาสสิค ทางฝั่งตะวันออกและฝั่งตะวันตกมีลักษณะที่แตกต่างกันไปตามชื่อเรียก แต่ในส่วนของฝั่งตะวันออกจะใช้ในการรับรองผู้เยี่ยมเยียนและบุคคลสำคัญระดับประเทศเท่านั้น\nในวันที่ 11 กันยายน พ.ศ. 2544 อาคารรัฐสภา เกือบจะถูกทำลายในเหตุวินาศกรรม 11 กันยายน พ.ศ. 2544 โดยผู้โดยสารของเครื่องบินยูไนเต็ดแอร์ไลน์ เที่ยวบินที่ …","other":"United States Capitol"},"en":{"title":"United States Capitol","url":"https://en.wikipedia.org/wiki/United_States_Capitol","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9f/US_Capitol_east_side.JPG/960px-US_Capitol_east_side.JPG?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The United States Capitol, often called the Capitol or the Capitol Building, is the seat of the United States Congress, the legislative branch of the federal government. It is located on Capitol Hill at the eastern end of the National Mall in Washington, D.C. Although no longer at the geographic center of the national capital, the U.S. Capitol forms the origin point for the street-numbering system of the district as well as its four quadrants. Like the principal buildings of the executive and judicial branches, the Capitol is built in a neoclassical style and has a white exterior.","history":"Prior to establishing the nation\u0027s capital, Washington, D.C., the United States Congress and its predecessors met at Independence Hall and Congress Hall in Philadelphia; Federal Hall in New York City, and five additional locations: York, Pennsylvania; Lancaster, Pennsylvania; the Maryland State House in Annapolis, Maryland; Nassau Hall in Princeton, New Jersey; and Trenton, New Jersey. In September 1774, the First Continental Congress brought together delegates from the colonies in Philadelphia, followed by the Second Continental Congress, which met from May 1775 to March 1781.\nAfter adopting the Articles of Confederation in York, Pennsylvania, the Congress of the Confederation was formed and convened in Philadelphia from March 1781 until June 1783, when a mob of angry soldiers converged upon Independence Hall, demanding payment for their service during the American Revolutionary War. Congress requested that John Dickinson, the Governor of Pennsylvania, call up the militia to defend Congress from attacks by the protesters. In what became known as the Pennsylvania Mutiny of 1783, …","other":"อาคารรัฐสภาสหรัฐ"}},{"th":{"title":"มหาพีระมิดแห่งกีซา","url":"https://th.wikipedia.org/wiki/%E0%B8%A1%E0%B8%AB%E0%B8%B2%E0%B8%9E%E0%B8%B5%E0%B8%A3%E0%B8%B0%E0%B8%A1%E0%B8%B4%E0%B8%94%E0%B9%81%E0%B8%AB%E0%B9%88%E0%B8%87%E0%B8%81%E0%B8%B5%E0%B8%8B%E0%B8%B2","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e3/Kheops-Pyramid.jpg/960px-Kheops-Pyramid.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"พีระมิดคูฟู หรือ พีระมิดคีออปส์ นิยมเรียกกันโดยทั่วไปว่า มหาพีระมิดแห่งกีซา (อังกฤษ: The Great Pyramid of Giza) เป็น พีระมิดในประเทศอียิปต์ที่มีความใหญ่โตและเก่าแก่ที่สุดในกลุ่มพีระมิดแห่งกีซา เชื่อกันว่าสร้างขึ้นในสมัย ฟาโรห์คูฟู (Khufu) แห่งราชวงศ์ที่สี่ ซึ่งปกครองอียิปต์โบราณ เมื่อประมาณ 2,600 ปีก่อนคริสตกาล หรือกว่า 4,600 ปีมาแล้ว เพื่อใช้เป็นที่เก็บรักษาพระศพ ไว้รอการกลับมาคืนชีพ ตามความเชื่อของชาวอียิปต์ในยุคนั้น มหาพีระมิดนี้ได้รับการยกย่องให้เป็นหนึ่งในเจ็ดสิ่งมหัศจรรย์ของโลก และเป็นหนึ่งเดียว ในเจ็ดสิ่งมหัศจรรย์ยุคโบราณ ที่ยังคงอยู่มาจนถึงปัจจุบัน","history":"พีระมิดคูฟู หรือ พีระมิดคีออปส์ นิยมเรียกกันโดยทั่วไปว่า มหาพีระมิดแห่งกีซา (อังกฤษ: The Great Pyramid of Giza) เป็น พีระมิดในประเทศอียิปต์ที่มีความใหญ่โตและเก่าแก่ที่สุดในกลุ่มพีระมิดแห่งกีซา เชื่อกันว่าสร้างขึ้นในสมัย ฟาโรห์คูฟู (Khufu) แห่งราชวงศ์ที่สี่ ซึ่งปกครองอียิปต์โบราณ เมื่อประมาณ 2,600 ปีก่อนคริสตกาล หรือกว่า 4,600 ปีมาแล้ว เพื่อใช้เป็นที่เก็บรักษาพระศพ ไว้รอการกลับมาคืนชีพ ตามความเชื่อของชาวอียิปต์ในยุคนั้น มหาพีระมิดนี้ได้รับการยกย่องให้เป็นหนึ่งในเจ็ดสิ่งมหัศจรรย์ของโลก และเป็นหนึ่งเดียว ในเจ็ดสิ่งมหัศจรรย์ยุคโบราณ ที่ยังคงอยู่มาจนถึงปัจจุบัน","other":"Great Pyramid of Giza"},"en":{"title":"Great Pyramid of Giza","url":"https://en.wikipedia.org/wiki/Great_Pyramid_of_Giza","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e7/Great_Pyramid_of_Giza_-_Pyramid_of_Khufu.jpg/960px-Great_Pyramid_of_Giza_-_Pyramid_of_Khufu.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Great Pyramid of Giza is the largest of the Egyptian pyramids and the most famous landmark of the Giza pyramid complex in Giza, Egypt. It is the oldest of the Seven Wonders of the Ancient World, and the only wonder that has remained largely intact. The Great Pyramid served as the tomb of Egyptian Pharaoh Khufu (\"Cheops\"), who ruled during the Fourth Dynasty of the Old Kingdom.","history":"Circa 450 BC Herodotus attributed the Great Pyramid to Cheops (Hellenization of Khufu), yet erroneously placed his reign following the Ramesside period. Manetho, around 200 years later, composed an extensive list of Egyptian kings, which he divided into dynasties, assigning Khufu to the 4th. However, after phonetic changes in the Egyptian language and consequently the Greek translation, \"Cheops\" had transformed into \"Souphis\" (and similar versions).\nGreaves, in 1646, reported the great difficulty of ascertaining a date for the pyramid\u0027s construction based on the lacking and conflicting historic sources. Because of the differences in spelling, he did not recognize Khufu on Manetho\u0027s king list (as transcribed by Africanus and Eusebius), hence he relied on Herodotus\u0027 incorrect account. Summating the duration of lines of succession, Greaves concluded 1266 BC to be the beginning of Khufu\u0027s reign.\nTwo centuries later, some of the gaps and uncertainties in Manetho\u0027s chronology had been cleared by discoveries such as the King Lists of Turin, Abydos, and Karnak. The names of Khufu found …","other":"มหาพีระมิดแห่งกีซา"}},{"th":null,"en":{"title":"Palazzo Vecchio","url":"https://en.wikipedia.org/wiki/Palazzo_Vecchio","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b3/Piazza_della_signoria%2C_palazzo_vecchio%2C_veduta_01.jpg/960px-Piazza_della_signoria%2C_palazzo_vecchio%2C_veduta_01.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Palazzo Vecchio (Italian: [paˈlattso ˈvɛkkjo]; Italian for \u0027Old Palace\u0027) is the town hall of Florence, Italy. It overlooks the Piazza della Signoria, which holds a copy of Michelangelo\u0027s David statue, and the gallery of statues in the adjacent Loggia dei Lanzi.\nOriginally called the Palazzo della Signoria, after the Signoria of Florence, the ruling body of the Republic of Florence, this building was also known by several other names: Palazzo del Popolo, Palazzo dei Priori, and Palazzo Ducale, in accordance with the varying use of the palace during its long history.","history":"In 1299, the commune and people of Florence decided to build a palace that would be worthy of the city\u0027s importance, and that would be more secure and defensible in times of turbulence for the magistrates of the commune. Arnolfo di Cambio, the architect of the Duomo and the Santa Croce church, began construction upon the ruins of Palazzo dei Fanti and Palazzo dell\u0027Esecutore di Giustizia, once owned by the Uberti family. Giovanni Villani (1276–1348) wrote in his Nuova Cronica that the Uberti were \"rebels of Florence and Ghibellines\", stating that the palazzo was built to ensure that the Uberti family homes would never be rebuilt on the same location.\nThe cubical building is made of solid rusticated stonework, with two rows of two-lighted Gothic windows, each with a trefoil arch. In the 15th century, Michelozzo added decorative bas-reliefs of the cross and the Florentine lily in the spandrels between the trefoils. The building is crowned with projecting crenellated battlements, supported by small arches and corbels. Under the arches are a repeated series of nine painted coats of arms …","other":null}},{"th":{"title":"เวสต์มินสเตอร์แอบบีย์","url":"https://th.wikipedia.org/wiki/%E0%B9%80%E0%B8%A7%E0%B8%AA%E0%B8%95%E0%B9%8C%E0%B8%A1%E0%B8%B4%E0%B8%99%E0%B8%AA%E0%B9%80%E0%B8%95%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B9%81%E0%B8%AD%E0%B8%9A%E0%B8%9A%E0%B8%B5%E0%B8%A2%E0%B9%8C","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8b/Westminster_Abbey_St_Peter.jpg/960px-Westminster_Abbey_St_Peter.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"อารามเวสต์มินสเตอร์ (อังกฤษ: Westminster Abbey) หรือชื่อทางการในอดีตว่า โบสถ์ร่วมนักบุญปีเตอร์ ณ เวสต์มินสเตอร์ (อังกฤษ: Collegiate Church of Saint Peter at Westminster) เป็นโบสถ์มหาวิหารสถาปัตยกรรมกอธิกขนาดใหญ่ในนครเวสต์มินสเตอร์ กรุงลอนดอน สหราชอาณาจักร ตั้งอยู่ทางตะวันตกของพระราชวังเวสต์มินสเตอร์ เป็นหนึ่งในศาสนสถานที่เป็นที่รู้จักดีและสำคัญที่สุดของสหราชอาณาจักร รวมถึงเป็นที่จัดพระราชพิธีราชาภิเษก และเป็นที่ฝังพระบรมศพของกษัตริย์อังกฤษและพระบรมวงศานุวงศ์","history":"อารามเวสต์มินสเตอร์เริ่มสร้างเป็นครั้งแรกเมื่อปี ค.ศ. 616 ณ ที่ตั้งปัจจุบันที่เดิมเรียกว่าธอร์น อาย (เกาะธอร์น) ซึ่งเป็นเกาะกลางแม่น้ำ ตามตำนานกล่าวว่าคนหาปลาในแม่น้ำเทมส์ชื่ออัลดริชเห็นนักบุญซีโมนเปโตรมาปรากฏตัวใกล้กับที่ตั้งมหาวิหารในปัจจุบัน ซึ่งอาจจะเป็นเหตุผลที่มหาวิหารได้รับปลาแซลมอนจากคนหาปลาในแม่น้ำเทมส์ต่อมา แต่ตามหลักฐานที่น่าเชื่อถือกว่ากล่าวว่าในคริสต์ทศวรรษ 960 หรือต้นคริสต์ทศวรรษ 970 นักบุญดันสตันร่วมกับพระเจ้าเอ็ดการ์ผู้รักสงบได้ก่อตั้งอารามคณะเบเนดิกตินขึ้นที่นี่ ต่อมาพระเจ้าเอ็ดเวิร์ดธรรมสักขีก็สร้างมหาวิหารให้เป็นโบสถ์หินระหว่างปี ค.ศ. 1045 ถึงปี ค.ศ. 1050 เพื่อให้เป็นส่วนหนึ่งของพระราชวังของพระองค์ มหาวิหารได้รับการสถาปนาเมื่อวันที่ 28 ธันวาคม ค.ศ. 1065 เพียงอาทิตย์เดียวก่อนที่จะเสด็จสวรรคตและใช้เป็นที่ฝังพระศพของพระองค์เอง ในปี ค.ศ. 1245 พระเจ้าเฮนรีที่ 3 ทรงสร้างมหาวิหารใหม่แทนมหาวิหารเดิมและทรงเลือกให้เป็นที่บรรจุพระศพของพระองค์เอง\nภาพของมหาวิหารเดิมที่ในลักษณะที่เป็นสถาปัตยกรรมโรมาเนสก์ก็เหลืออยู่เพียงภาพที่ปรากฏอยู่ข้างๆ พระราชวังเวสต์มินสเตอร์บนผ้าปักบายู มหาวิหารมีรายได้เพิ่มขึ้นจนขยายตัวจากนักพรตราวสิบกว่ารูปขึ้นไปเป็นราวแปดสิบรูป …","other":"Westminster Abbey"},"en":{"title":"Westminster Abbey","url":"https://en.wikipedia.org/wiki/Westminster_Abbey","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/47/Westminster_Abbey%2C_Westminster.jpg/960px-Westminster_Abbey%2C_Westminster.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Westminster Abbey, formally titled the Collegiate Church of Saint Peter at Westminster, is an Anglican church in the City of Westminster, London, England. Since 1066, it has been the location of the coronations of 40 English and British monarchs and a burial site for 18 English, Scottish, and British monarchs. At least 16 royal weddings have taken place at the abbey since 1100.","history":"Historians agree that there was a monastery dedicated to Saint Peter on the site prior to the 11th century, though its exact origin is somewhat obscure. One legend claims that it was founded by the Saxon king Sæberht of Essex, and another claims that its founder was the fictional 2nd-century British king Lucius. One tradition claims that a young fisherman on the River Thames had a vision of Saint Peter near the site. The Fishmongers\u0027 Company still gives the abbey a salmon each year in recognition of this story.\nThe origins of the abbey are generally thought to date to about 959, when Dunstan and King Edgar installed a community of Benedictine monks on the site. At that time, the location was an island in the Thames called Thorney Island. This building has not survived, but archaeologists have found some pottery and foundations from this period on the abbey site.\nBetween 1042 and 1052, Edward the Confessor began rebuilding Saint Peter\u0027s Abbey to provide himself with a royal burial church. It was built in the Romanesque style and was the first church in England built on a cruciform …","other":"เวสต์มินสเตอร์แอบบีย์"}},{"th":null,"en":{"title":"Al-Khazneh","url":"https://en.wikipedia.org/wiki/Al-Khazneh","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ed/Al_khazneh.jpg/960px-Al_khazneh.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Al-Khazneh (Arabic: الخزنة; IPA: [al.xaz.na], \"The Treasury\"), also known as Khaznat el-Far\u0027oun (treasury of the pharaoh), is one of the most elaborate rock-cut tombs in Petra, a city of the Nabatean Kingdom inhabited by the Arabs in ancient times. As with most of the other buildings in this ancient town, including the Monastery (Arabic: Ad Deir), this structure was carved out of a sandstone rock face.\nIt is thought that Al-Khazneh was built as a mausoleum and crypt at the beginning of the 1st century AD during the reign of Aretas IV Philopatris.","history":"Al-Khazneh (Arabic: الخزنة; IPA: [al.xaz.na], \"The Treasury\"), also known as Khaznat el-Far\u0027oun (treasury of the pharaoh), is one of the most elaborate rock-cut tombs in Petra, a city of the Nabatean Kingdom inhabited by the Arabs in ancient times. As with most of the other buildings in this ancient town, including the Monastery (Arabic: Ad Deir), this structure was carved out of a sandstone rock face.\nIt is thought that Al-Khazneh was built as a mausoleum and crypt at the beginning of the 1st century AD during the reign of Aretas IV Philopatris.\nIt is one of the most popular tourist attractions in both Jordan and the region.","other":null}},{"th":{"title":"นาฬิกาดาราศาสตร์ปราก","url":"https://th.wikipedia.org/wiki/%E0%B8%99%E0%B8%B2%E0%B8%AC%E0%B8%B4%E0%B8%81%E0%B8%B2%E0%B8%94%E0%B8%B2%E0%B8%A3%E0%B8%B2%E0%B8%A8%E0%B8%B2%E0%B8%AA%E0%B8%95%E0%B8%A3%E0%B9%8C%E0%B8%9B%E0%B8%A3%E0%B8%B2%E0%B8%81","img":"https://upload.wikimedia.org/wikipedia/commons/f/f4/Prague_Clock_Tower.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail_unscaled","intro":"นาฬิกาดาราศาสตร์ปราก (เช็ก: Pražský orloj, ปรัชสกีโอร์โลย) เป็นหอนาฬิกาดาราศาสตร์ ตั้งอยู่ที่กรุงปราก เมืองหลวงของประเทศเช็กเกีย ตั้งอยู่ทางกำแพงด้านใต้ของศาลาว่าการในจัตุรัสเมืองเก่า เป็นสถานที่ท่องเที่ยวของเมืองที่ได้รับความนิยมมาก มีการติดตั้งนาฬิกานี้ใน ค.ศ.","history":"นาฬิกาดาราศาสตร์ปราก (เช็ก: Pražský orloj, ปรัชสกีโอร์โลย) เป็นหอนาฬิกาดาราศาสตร์ ตั้งอยู่ที่กรุงปราก เมืองหลวงของประเทศเช็กเกีย ตั้งอยู่ทางกำแพงด้านใต้ของศาลาว่าการในจัตุรัสเมืองเก่า เป็นสถานที่ท่องเที่ยวของเมืองที่ได้รับความนิยมมาก มีการติดตั้งนาฬิกานี้ใน ค.ศ. 1410 ทำให้เป็นนาฬิกาดาราศาสตร์ที่เก่าแก่เป็นอันดับ 3 ของโลก และเป็นนาฬิกาที่เก่าแก่ที่สุดที่ยังใช้งานได้\nส่วนประกอบหลักของหอนาฬิกาได้แก่ นาฬิกาดาราศาสตร์ ซึ่งจะแสดงวิถีการโคจรของดวงอาทิตย์และดวงจันทร์ ด้านล่างของนาฬิกาดาราศาสตร์จะมีหน้าปัดแสดงเดือนในปัจจุบัน และด้านบนสุดมีรูปปั้นสาวกของพระเยซู","other":"Prague astronomical clock"},"en":{"title":"Prague astronomical clock","url":"https://en.wikipedia.org/wiki/Prague_astronomical_clock","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/37/Astronomical_Clock_%288341899828%29.jpg/960px-Astronomical_Clock_%288341899828%29.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Prague astronomical clock, or Prague Orloj (Czech: Pražský orloj [praʃskiː orloj]), is a medieval astronomical clock attached to the Old Town Hall in Prague, the capital of the Czech Republic.","history":"The oldest part of the Orloj, the mechanical clock and astronomical dial, dates back to 1410, when it was created by horologist Mikuláš of Kadaň and Charles University professor of mathematics and astronomy Jan Šindel. The first recorded mention of the clock was on 9 October 1410. Later, presumably around 1490, the calendar dial was added and the clock facade was decorated with gothic sculptures.\nFormerly, it was believed that the Orloj was constructed in 1490 by clockmaster Jan Růže (also called Hanuš); this is now known to be a historical mistake. A legend, recounted by Alois Jirásek, has it that the clockmaker Hanuš was blinded on the order of the Prague Councillors so that he could not repeat his work; in turn, he disabled the clock, and no one was able to repair it for the next hundred years.\nIn 1552, it was repaired by Jan Táborský (1500–1572), master clockmaker of Klokotská Hora, who also wrote a report of the clock where he mentioned Hanuš as the maker of this clock. This mistake, corrected by Zdeněk Horský, was due to an incorrect interpretation of records from the period. …","other":"นาฬิกาดาราศาสตร์ปราก"}},{"th":{"title":"ปราสาทซันตันเจโล","url":"https://th.wikipedia.org/wiki/%E0%B8%9B%E0%B8%A3%E0%B8%B2%E0%B8%AA%E0%B8%B2%E0%B8%97%E0%B8%8B%E0%B8%B1%E0%B8%99%E0%B8%95%E0%B8%B1%E0%B8%99%E0%B9%80%E0%B8%88%E0%B9%82%E0%B8%A5","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/67/Engelsburg_und_Engelsbr%C3%BCcke_abends_%28Zuschnitt%29.jpg/960px-Engelsburg_und_Engelsbr%C3%BCcke_abends_%28Zuschnitt%29.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"ปราสาทซันตันเจโล (อิตาลี: Castel Sant\u0027Angelo \"ปราสาทนักบุญทูตสวรรค์\") เป็นอาคารทรงกระบอกในกรุงโรม ประเทศอิตาลี ตั้งอยู่ทางทิศตะวันออกของนครรัฐวาติกันราว 700 เมตร ก่อสร้างขึ้นในสมัยจักรพรรดิฮาดริอานุสแห่งโรมัน ราว ค.ศ. 134 ถึง 139 เพื่อใช้เป็นสุสานของพระองค์และพระราชวงศ์ ต่อมาอาคารนี้ได้ถูกใช้งานเป็นปราสาทและป้อมปราการ อาคารนี้เคยเป็นสิ่งก่อสร้างที่สูงที่สุดในกรุงโรมอยู่ช่วงหนึ่ง ปัจจุบันใช้เป็นพิพิธภัณฑ์ชื่อว่า \"พิพิธภัณฑสถานแห่งชาติปราสาทซันตันเจโล\" (Museo Nazionale di Castel Sant\u0027Angelo)\nอาคารแห่งนี้เดิมถูกเรียกว่า สุสานฮาดริอานุส อย่างไรก็ตาม เมื่อมีการนำอาคารนี้ไปใช้งานเป็นป้อมปราการทางทหารใน ค.ศ. 401 เครื่องสุสานต่าง ๆ ก็ได้สูญหายไป ตั้งแต่นั้นมาก็มีการต่อเติมปรับปรุงอยู่หลายครั้ง จนกระทั่งเมื่อกรุงโรมเกิดโรคระบาดครั้งใหญ่ใน ค.ศ.","history":"ปราสาทซันตันเจโล (อิตาลี: Castel Sant\u0027Angelo \"ปราสาทนักบุญทูตสวรรค์\") เป็นอาคารทรงกระบอกในกรุงโรม ประเทศอิตาลี ตั้งอยู่ทางทิศตะวันออกของนครรัฐวาติกันราว 700 เมตร ก่อสร้างขึ้นในสมัยจักรพรรดิฮาดริอานุสแห่งโรมัน ราว ค.ศ. 134 ถึง 139 เพื่อใช้เป็นสุสานของพระองค์และพระราชวงศ์ ต่อมาอาคารนี้ได้ถูกใช้งานเป็นปราสาทและป้อมปราการ อาคารนี้เคยเป็นสิ่งก่อสร้างที่สูงที่สุดในกรุงโรมอยู่ช่วงหนึ่ง ปัจจุบันใช้เป็นพิพิธภัณฑ์ชื่อว่า \"พิพิธภัณฑสถานแห่งชาติปราสาทซันตันเจโล\" (Museo Nazionale di Castel Sant\u0027Angelo)\nอาคารแห่งนี้เดิมถูกเรียกว่า สุสานฮาดริอานุส อย่างไรก็ตาม เมื่อมีการนำอาคารนี้ไปใช้งานเป็นป้อมปราการทางทหารใน ค.ศ. 401 เครื่องสุสานต่าง ๆ ก็ได้สูญหายไป ตั้งแต่นั้นมาก็มีการต่อเติมปรับปรุงอยู่หลายครั้ง จนกระทั่งเมื่อกรุงโรมเกิดโรคระบาดครั้งใหญ่ใน ค.ศ. 590 มีตำนานว่าอัครทูตสวรรค์มีคาเอลได้ปรากฏองค์เหนือปราสาทแห่งนี้ และชักดาบขึ้นเพื่อยุติโรคระบาด กลายเป็นที่มาของชื่อปราสาทตั้งแต่นั้นเป็นต้นมา","other":"Castel Sant\u0027Angelo"},"en":{"title":"Castel Sant\u0027Angelo","url":"https://en.wikipedia.org/wiki/Castel_Sant%27Angelo","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/57/Castel_Sant%27Angelo_at_Night.jpg/960px-Castel_Sant%27Angelo_at_Night.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Castel Sant\u0027Angelo (pronounced [kaˈstɛl sanˈtandʒelo] Italian for \u0027Castle of the Holy Angel\u0027), also known as Mausoleum of Hadrian (Italian: Mausoleo di Adriano),  is a towering rotunda (cylindrical building) in Parco Adriano, Rome, Italy. It was initially commissioned by the Roman Emperor Hadrian as a mausoleum for himself and his family. The popes later used the building as a fortress and castle dedicated to Saint Michael the Archangel, and it is now a museum.","history":"Castel Sant\u0027Angelo (pronounced [kaˈstɛl sanˈtandʒelo] Italian for \u0027Castle of the Holy Angel\u0027), also known as Mausoleum of Hadrian (Italian: Mausoleo di Adriano),  is a towering rotunda (cylindrical building) in Parco Adriano, Rome, Italy. It was initially commissioned by the Roman Emperor Hadrian as a mausoleum for himself and his family. The popes later used the building as a fortress and castle dedicated to Saint Michael the Archangel, and it is now a museum. The structure was once the tallest building in Rome.","other":"ปราสาทซันตันเจโล"}},{"th":{"title":"มาชูปิกชู","url":"https://th.wikipedia.org/wiki/%E0%B8%A1%E0%B8%B2%E0%B8%8A%E0%B8%B9%E0%B8%9B%E0%B8%B4%E0%B8%81%E0%B8%8A%E0%B8%B9","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/62/80_-_Machu_Picchu_-_Juin_2009_-_edit.jpg/960px-80_-_Machu_Picchu_-_Juin_2009_-_edit.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"มาชูปิกชู (สเปน: Machu Picchu), มาจูปิกจู (เกชัว: Machu Pikchu) หรือนิยมเรียกอีกชื่อว่า เมืองสาบสูญแห่งอินคา เป็นซากอารยธรรมโบราณของชาวอินคา ตั้งอยู่บนเทือกเขาสูงในประเทศเปรู ที่ความสูงประมาณ 2,430 เมตร อารยธรรมแห่งนี้ได้ถูกคนภายนอกลืมจนกระทั่งมีการค้นพบอีกครั้งโดยนักโบราณคดีที่ชื่อไฮแรม บิงแฮม\nมาชูปิกชูเป็นหลักฐานที่สำคัญของจักรวรรดิอินคา ใน ค.ศ. 1983 ยูเนสโกได้ขึ้นทะเบียนมาชูปิกชูให้เป็นแหล่งมรดกโลก โดยทำให้เป็นสถานที่ท่องเที่ยวที่คนนิยมไปศึกษาประวัติศาสตร์\n7 กรกฎาคม ค.ศ.","history":"คาดว่ามาชูปิกชูสร้างขึ้นราว ค.ศ. 1450 โดยจักรพรรดิปาชากูตีของชาวอินคา มาชูปิกชู ถูกปล่อยทิ้งไว้นับร้อยปี เพราะชาวสเปนได้เข้ามาล่าอาณานิคม และฆ่าชาวเปรูและชาวอินคา เมืองอินคาเลยถูกปล่อยร้างไว้ แต่ไฮแรม บิงแฮม ค้นพบเมืองร้างแห่งนี้เมื่อ ค.ศ. 1911 แล้วแพร่ข่าวไปทั่วโลก\nมีแหล่งข้อมูลน้อยนักที่กล่าวถึงการบูชายัญมนุษย์ที่มาชูปิกชู แม้ว่าผู้ถูกบูชายัญจะไม่เคยถูกฝังอย่างเป็นพิธีแต่กระดูกของพวกเขาก็ได้ถูกย่อยสลายไปกับธาตุ อย่างไรก็ตาม มีหลักฐานว่าผู้ติดตามต้องถูกบูชายัญเพื่อติดตามขุนนางผู้ล่วงลับไปยั้งชีวิตหลังความตาย การบูชายัญสัตว์ ของเหลวและดินที่แท่นบูชาคอนดอร์จะพบเห็นได้บ่อยกว่ามาก ประเพณีนี้ได้รับการยอมรับจากสมาชิกของศาสนายุคใหม่แอนดีส","other":"Machu Picchu"},"en":{"title":"Machu Picchu","url":"https://en.wikipedia.org/wiki/Machu_Picchu","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bb/Machu_Picchu%2C_2023_%28012%29.jpg/960px-Machu_Picchu%2C_2023_%28012%29.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Machu Picchu is a 15th-century Inca citadel located in the Eastern Cordillera of southern  Peru  on a mountain ridge at  2,430 meters (7,970 ft). It is situated in the Machupicchu District of Urubamba Province about 80 kilometers (50 miles) northwest of Cusco, above the Sacred Valley and along the Urubamba River, which forms a deep canyon with a subtropical mountain climate.\nOften referred to as the \"Lost City of the Incas\", Machu Picchu is one of the most iconic symbols of the Inca civilization and a major archaeological site in the Americas.","history":"Machu Picchu’s early chronology continues to be a matter of scholarly debate. Earlier chronological models, based mainly on John H. Rowe\u0027s historical reconstruction of the reign of Pachacuti Inca Yupanqui, have placed the beginning of construction around 1450, 10 years after his takeover. However, a 2021 study led by Richard L. Burger, professor of anthropology at Yale University), reporting 26 AMS radiocarbon measurements from human remains concluded that Machu Picchu was occupied from around 1420 to 1530. Similar conclusions supporting an earlier 15th-century chronology have been reported by other radiocarbon studies. Construction appears to date from two Sapa Incas, Pachacutec Inca Yupanqui (1438–1471) and Túpac Inca Yupanqui (1472–1493).\nA consensus among archaeologists is that Pachacutec ordered the construction of the royal estate after his conquest of the middle and lower Urubamba; this has been interpreted as part of a broader program of establishing royal estates along the Urubamba River. Machu Picchu’s palace complex is thought to have functioned as a seasonal royal …","other":"มาชูปิกชู"}},{"th":{"title":"ฮาเกียโซเฟีย","url":"https://th.wikipedia.org/wiki/%E0%B8%AE%E0%B8%B2%E0%B9%80%E0%B8%81%E0%B8%B5%E0%B8%A2%E0%B9%82%E0%B8%8B%E0%B9%80%E0%B8%9F%E0%B8%B5%E0%B8%A2","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/22/Hagia_Sophia_Mars_2013.jpg/960px-Hagia_Sophia_Mars_2013.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"ฮาเกียโซเฟีย (อังกฤษ: Hagia Sophia; กรีกคอยนี: Ἁγία Σοφία, อักษรโรมัน: Hagía Sophía) หรือ อายาโซฟยา (ตุรกี: Ayasofya) แปลว่า \"พระปรีชาญาณศักดิ์สิทธิ์\" (Holy Wisdom; ละติน: Sancta Sofia) ชื่ออย่างเป็นทางการว่า มัสยิดใหญ่อายาโซฟยาอันศักดิ์สิทธิ์ (ตุรกี: Ayasofya-i Kebir Camii Şerifi) และในอดีตมีชื่อว่า คริสตจักรฮาเกียโซเฟีย (ตุรกี: Ayasofya Kilisesi; กรีก: Ναός της Αγίας του Θεού Σοφίας, อักษรโรมัน: Naós tis Ayías tou Theoú Sofías; ละติน: Ecclesia Sanctae Sophiae) เป็นศาสนสถานจากปลายสมัยโบราณ ตั้งอยู่ในอิสตันบูล ผู้ออกแบบ คือ อีซีดอร์แห่งไมลิทัส และแอนทิเมียสแห่งทรัลเลส ชาวกรีกทั้งคู่ โดยสร้างใน ค.ศ. 537 เพื่อเป็นอาสนวิหารประจำเขตอัครบิดรคอนสแตนติโนเปิล นับเป็นโบสถ์คริสต์ที่ใหญ่ที่สุดของจักรวรรดิโรมันตะวันออกและศาสนจักรอีสเทิร์นออร์ทอดอกซ์ ยกเว้นในสมัยจักรวรรดิละตินช่วง ค.ศ. 1204–1261 ซึ่งศาสนถานนี้กลายเป็นอาสนวิหารคริสตจักรละตินประจำนครแทน ต่อมาใน ค.ศ.","history":"ฮาเกียโซเฟีย (อังกฤษ: Hagia Sophia; กรีกคอยนี: Ἁγία Σοφία, อักษรโรมัน: Hagía Sophía) หรือ อายาโซฟยา (ตุรกี: Ayasofya) แปลว่า \"พระปรีชาญาณศักดิ์สิทธิ์\" (Holy Wisdom; ละติน: Sancta Sofia) ชื่ออย่างเป็นทางการว่า มัสยิดใหญ่อายาโซฟยาอันศักดิ์สิทธิ์ (ตุรกี: Ayasofya-i Kebir Camii Şerifi) และในอดีตมีชื่อว่า คริสตจักรฮาเกียโซเฟีย (ตุรกี: Ayasofya Kilisesi; กรีก: Ναός της Αγίας του Θεού Σοφίας, อักษรโรมัน: Naós tis Ayías tou Theoú Sofías; ละติน: Ecclesia Sanctae Sophiae) เป็นศาสนสถานจากปลายสมัยโบราณ ตั้งอยู่ในอิสตันบูล ผู้ออกแบบ คือ อีซีดอร์แห่งไมลิทัส และแอนทิเมียสแห่งทรัลเลส ชาวกรีกทั้งคู่ โดยสร้างใน ค.ศ. 537 เพื่อเป็นอาสนวิหารประจำเขตอัครบิดรคอนสแตนติโนเปิล นับเป็นโบสถ์คริสต์ที่ใหญ่ที่สุดของจักรวรรดิโรมันตะวันออกและศาสนจักรอีสเทิร์นออร์ทอดอกซ์ ยกเว้นในสมัยจักรวรรดิละตินช่วง ค.ศ. 1204–1261 ซึ่งศาสนถานนี้กลายเป็นอาสนวิหารคริสตจักรละตินประจำนครแทน ต่อมาใน ค.ศ. 1453 หลังจากที่เสียคอนสแตนติโนเปิลให้แก่จักรวรรดิออตโตมัน ศาสนสถานนี้ก็ได้รับการแปรเปลี่ยนเป็นมัสยิด ใน ค.ศ. 1935 สาธารณรัฐเติร์กซึ่งเป็นกลางทางศาสนาได้จัดศาสนสถานนี้เป็นพิพิธภัณฑ์แทน (ตุรกี: Ayasofya Müzesi) กระทั่งใน ค.ศ. 2020 …","other":"Hagia Sophia"},"en":{"title":"Hagia Sophia","url":"https://en.wikipedia.org/wiki/Hagia_Sophia","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4a/Hagia_Sophia_%28228968325%29.jpeg/960px-Hagia_Sophia_%28228968325%29.jpeg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Hagia Sophia, officially the Hagia Sophia Grand Mosque, is a mosque and a major cultural and historical site in Istanbul, Turkey. It was formerly a church (360–1453) and a museum (1935–2020). The last of three church buildings to be successively erected on the site by the Eastern Roman Empire, it was completed in AD 537, becoming the world\u0027s largest interior space and among the first to employ a fully pendentive dome.","history":"The first church on the site was known as the Magna Ecclesia (Μεγάλη Ἐκκλησία, Megálē Ekklēsíā, \u0027Great Church\u0027) because of its size compared to the sizes of the contemporary churches in the city. According to the Chronicon Paschale, the church was consecrated on 15 February 360, during the reign of the emperor Constantius II (r. 337–361) by the Arian bishop Eudoxius of Antioch. It was built next to the area where the Great Palace was being developed.\nAccording to the 5th-century ecclesiastical historian Socrates of Constantinople, the emperor Constantius had c. 346 \"constructed the Great Church alongside that called Irene which because it was too small, the emperor\u0027s father [Constantine] had enlarged and beautified\". A tradition which is not older than the 7th or 8th century reports that the edifice was built by Constantius\u0027 father, Constantine the Great (r. 306–337).\nHesychius of Miletus wrote that Constantine built Hagia Sophia with a wooden roof and removed 427 (mostly pagan) statues from the site. The 12th-century chronicler Joannes Zonaras reconciles the two opinions, writing …","other":"ฮาเกียโซเฟีย"}},{"th":{"title":"มื้อค่ำครั้งสุดท้าย (เลโอนาร์โด)","url":"https://th.wikipedia.org/wiki/%E0%B8%A1%E0%B8%B7%E0%B9%89%E0%B8%AD%E0%B8%84%E0%B9%88%E0%B8%B3%E0%B8%84%E0%B8%A3%E0%B8%B1%E0%B9%89%E0%B8%87%E0%B8%AA%E0%B8%B8%E0%B8%94%E0%B8%97%E0%B9%89%E0%B8%B2%E0%B8%A2_(%E0%B9%80%E0%B8%A5%E0%B9%82%E0%B8%AD%E0%B8%99%E0%B8%B2%E0%B8%A3%E0%B9%8C%E0%B9%82%E0%B8%94)","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/08/Leonardo_da_Vinci_%281452-1519%29_-_The_Last_Supper_%281495-1498%29.jpg/960px-Leonardo_da_Vinci_%281452-1519%29_-_The_Last_Supper_%281495-1498%29.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"มื้อค่ำครั้งสุดท้าย (อิตาลี: Ultima Cena, อังกฤษ: The Last Supper) หรือชื่อที่ตั้งโดยผู้วาดคือ โถงมื้อค่ำ (Cenacolo) เป็นจิตรกรรมฝาผนังที่เลโอนาร์โด ดา วินชี วาดให้แก่ดยุกลูโดวีโก สฟอร์ซา ผู้อุปถัมภ์เขา ภาพเป็นเหตุการณ์ตามพระวรสารภาพเกี่ยวกับมื้อค่ำครั้งสุดท้ายของพระเยซูกับอัครทูต ก่อนที่จะทรงถูกนำไปตรึงกางเขน  ภาพวาดนี้ไม่สามารถเคลื่อนย้ายได้ เนื่องจากถูกวาดด้วยปูนเปียกบนผนัง ภาพวาดนี้ยังถือว่าเป็นภาพวาดที่มีขนาดใหญ่ที่สุดของเลโอนาร์โด ดา วินชี ที่ยังคงสภาพให้มองเห็นได้ในปัจจุบัน และยังถือได้ว่าเป็นหนึ่งในบรรดาจิตรกรรมที่รู้จักกันอยู่ทั่วโลก","history":"มื้อค่ำครั้งสุดท้าย (อิตาลี: Ultima Cena, อังกฤษ: The Last Supper) หรือชื่อที่ตั้งโดยผู้วาดคือ โถงมื้อค่ำ (Cenacolo) เป็นจิตรกรรมฝาผนังที่เลโอนาร์โด ดา วินชี วาดให้แก่ดยุกลูโดวีโก สฟอร์ซา ผู้อุปถัมภ์เขา ภาพเป็นเหตุการณ์ตามพระวรสารภาพเกี่ยวกับมื้อค่ำครั้งสุดท้ายของพระเยซูกับอัครทูต ก่อนที่จะทรงถูกนำไปตรึงกางเขน  ภาพวาดนี้ไม่สามารถเคลื่อนย้ายได้ เนื่องจากถูกวาดด้วยปูนเปียกบนผนัง ภาพวาดนี้ยังถือว่าเป็นภาพวาดที่มีขนาดใหญ่ที่สุดของเลโอนาร์โด ดา วินชี ที่ยังคงสภาพให้มองเห็นได้ในปัจจุบัน และยังถือได้ว่าเป็นหนึ่งในบรรดาจิตรกรรมที่รู้จักกันอยู่ทั่วโลก\nภาพวาดนี้ยังเป็นแกนสำคัญของการเดินเรื่องราวของนวนิยายชื่อดังของโลก รหัสลับดาวินชี ที่มีเนื้อหาระบุว่า เลโอนาร์โด ดา วินชี ได้แฝงปริศนาความลับไว้ในภาพโดยแสดงถึงสาวกหญิงใกล้ชิดผู้หนึ่งซึ่งมีสัมพันธ์กับพระเยซู  ซึ่งเนื้อหาดังกล่าวได้รับการคัดค้านจากศาสนาจักรคาทอลิกอย่างรุนแรง","other":"The Last Supper (Leonardo)"},"en":{"title":"The Last Supper (Leonardo)","url":"https://en.wikipedia.org/wiki/The_Last_Supper_(Leonardo)","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/48/The_Last_Supper_-_Leonardo_Da_Vinci_-_High_Resolution_32x16.jpg/960px-The_Last_Supper_-_Leonardo_Da_Vinci_-_High_Resolution_32x16.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Last Supper (Italian: Il Cenacolo [il tʃeˈnaːkolo] or L\u0027Ultima Cena [ˈlultima ˈtʃeːna]) is a mural painting by the Italian High Renaissance artist Leonardo da Vinci, dated to c. 1495–1498, housed in the refectory of the Convent of Santa Maria delle Grazie in Milan, Italy. The painting represents the scene of the Last Supper of Jesus with the Twelve Apostles, as it is told in the Gospel of John – specifically the moment after Jesus announces that one of his apostles will betray him. Its handling of space, mastery of perspective, treatment of motion and complex display of human emotion has made it one of the Western world\u0027s most recognizable paintings and among Leonardo\u0027s most celebrated works.","history":"Two early copies of The Last Supper are known to exist, presumed to be work by Leonardo\u0027s assistants. The copies are almost the size of the original, and have survived with a wealth of original detail still intact. One, by Giampietrino, is in the collection of the Royal Academy of Arts, London, and the other, by Cesare da Sesto, is installed at the Church of St. Ambrogio in Ponte Capriasca, Switzerland. A third copy (oil on canvas) was painted by Andrea Solari (c. 1520) and is on display in the Leonardo da Vinci Museum of the Tongerlo Abbey, Belgium.\nBecause Sforza had ordered the church to be rebuilt hastily, the masons filled the walls with moisture-retaining rubble. The painting was done on a thin exterior wall, so the effects of humidity were felt keenly, and the paint failed to properly adhere to it. Because of the method used, soon after the painting was completed on 9 February 1498 it began to deteriorate. In 1499, Louis XII contemplated removing the painting from the wall and taking it to France. As early as 1517, the painting was starting to flake, and in 1532 Gerolamo …","other":"มื้อค่ำครั้งสุดท้าย (เลโอนาร์โด)"}},{"th":{"title":"สโตนเฮนจ์","url":"https://th.wikipedia.org/wiki/%E0%B8%AA%E0%B9%82%E0%B8%95%E0%B8%99%E0%B9%80%E0%B8%AE%E0%B8%99%E0%B8%88%E0%B9%8C","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a6/Stonehenge_Wide_Angle.jpg/960px-Stonehenge_Wide_Angle.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"สโตนเฮนจ์ (อังกฤษ: Stonehenge) เป็นอนุสรณ์สถานยุคก่อนประวัติศาสตร์ กลางทุ่งราบกว้างใหญ่บนที่ราบซอลส์บรี (Salisbury Plain) ในบริเวณตอนใต้ของบริเตนใหญ่ ตัวอนุสรณ์สถานประกอบด้วยแท่งหินขนาดยักษ์ 112 ก้อน ตั้งเรียงกันเป็นวงกลมซ้อนกัน 3 วง แท่งหินบางอันตั้งขึ้น บางอันวางนอนลง และบางอันก็ถูกวางซ้อนกัน \nนักโบราณคดีเชื่อว่ากลุ่มกองหินนี้ถูกสร้างขึ้นจากที่ไหนสักแห่งเมื่อประมาณ 3000–2000 ปีก่อนคริสตกาล กล่าวคือ การหาอายุจากคาร์บอนกัมมันตรังสีเมื่อ พ.ศ. 2551 เผยให้เห็นว่าหินก้อนแรกถูกวางตั้งเมื่อประมาณ 2400–2200 ปีก่อนคริสตกาล ในขณะที่ทฤษฎีอื่น ๆ ระบุว่ากลุ่มหินที่ถูกวางตั้งมาตั้งแต่ก่อนหน้านั้นถึง 3000 ปีก่อนคริสตกาล\nนักวิทยาศาสตร์และนักประวัติศาสตร์ต่างสงสัยว่า คนในสมัยก่อนสามารถยกแท่งหินที่มีน้ำหนักกว่า 30 ตัน ขึ้นไปวางเรียงกันได้อย่างไร ทั้ง ๆ ที่ปราศจากเครื่องทุ่นแรงอย่างที่เราใช้อยู่ในปัจจุบัน และบริเวณที่ราบดังกล่าวไม่มีก้อนหินขนาดมหึมานี้ ดังนั้นจึงสันนิษฐานว่าผู้สร้างต้องทำการชักลากแท่งหินยักษ์ทั้งหมดมาจากที่อื่น ซึ่งคาดว่าน่าจะมาจาก \"ทุ่งมาร์ลโบโร\" ที่อยู่ไกลออกไปประมาณ 40 กิโลเมตร\nสโตนเฮนจ์และหินบริเวณโดยรอบได้ถูกขึ้นทะเบียนเป็นแหล่งมรดกโลกในปี ค.ศ.","history":"สโตนเฮนจ์ (อังกฤษ: Stonehenge) เป็นอนุสรณ์สถานยุคก่อนประวัติศาสตร์ กลางทุ่งราบกว้างใหญ่บนที่ราบซอลส์บรี (Salisbury Plain) ในบริเวณตอนใต้ของบริเตนใหญ่ ตัวอนุสรณ์สถานประกอบด้วยแท่งหินขนาดยักษ์ 112 ก้อน ตั้งเรียงกันเป็นวงกลมซ้อนกัน 3 วง แท่งหินบางอันตั้งขึ้น บางอันวางนอนลง และบางอันก็ถูกวางซ้อนกัน \nนักโบราณคดีเชื่อว่ากลุ่มกองหินนี้ถูกสร้างขึ้นจากที่ไหนสักแห่งเมื่อประมาณ 3000–2000 ปีก่อนคริสตกาล กล่าวคือ การหาอายุจากคาร์บอนกัมมันตรังสีเมื่อ พ.ศ. 2551 เผยให้เห็นว่าหินก้อนแรกถูกวางตั้งเมื่อประมาณ 2400–2200 ปีก่อนคริสตกาล ในขณะที่ทฤษฎีอื่น ๆ ระบุว่ากลุ่มหินที่ถูกวางตั้งมาตั้งแต่ก่อนหน้านั้นถึง 3000 ปีก่อนคริสตกาล\nนักวิทยาศาสตร์และนักประวัติศาสตร์ต่างสงสัยว่า คนในสมัยก่อนสามารถยกแท่งหินที่มีน้ำหนักกว่า 30 ตัน ขึ้นไปวางเรียงกันได้อย่างไร ทั้ง ๆ ที่ปราศจากเครื่องทุ่นแรงอย่างที่เราใช้อยู่ในปัจจุบัน และบริเวณที่ราบดังกล่าวไม่มีก้อนหินขนาดมหึมานี้ ดังนั้นจึงสันนิษฐานว่าผู้สร้างต้องทำการชักลากแท่งหินยักษ์ทั้งหมดมาจากที่อื่น ซึ่งคาดว่าน่าจะมาจาก \"ทุ่งมาร์ลโบโร\" ที่อยู่ไกลออกไปประมาณ 40 กิโลเมตร\nสโตนเฮนจ์และหินบริเวณโดยรอบได้ถูกขึ้นทะเบียนเป็นแหล่งมรดกโลกในปี ค.ศ. 1986 …","other":"Stonehenge"},"en":{"title":"Stonehenge","url":"https://en.wikipedia.org/wiki/Stonehenge","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3c/Stonehenge2007_07_30.jpg/960px-Stonehenge2007_07_30.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Stonehenge is a prehistoric megalithic structure on Salisbury Plain in Wiltshire, England, two miles (3 km) west of Amesbury. It consists of an outer ring of vertical sarsen standing stones, each around 13 feet (4.0 m) high, seven feet (2.1 m) wide, and weighing around 25 tons, topped by connecting horizontal lintel stones which are held in place with mortise and tenon joints—a feature unique among contemporary monuments.  Inside is a ring of smaller bluestones.","history":"Stonehenge is a prehistoric megalithic structure on Salisbury Plain in Wiltshire, England, two miles (3 km) west of Amesbury. It consists of an outer ring of vertical sarsen standing stones, each around 13 feet (4.0 m) high, seven feet (2.1 m) wide, and weighing around 25 tons, topped by connecting horizontal lintel stones which are held in place with mortise and tenon joints—a feature unique among contemporary monuments.  Inside is a ring of smaller bluestones. Inside these are free-standing trilithons: two bulkier vertical sarsens joined by a single lintel. The whole monument, now in ruins, is aligned towards the sunrise on the summer solstice and sunset on the winter solstice. The stones are set within earthworks in the middle of the densest complex of Neolithic and Bronze Age monuments in England, including several hundred tumuli (burial mounds).\nStonehenge was constructed in several phases, beginning about 3100 BC and continuing until about 1600 BC. The famous circle of large sarsen stones was placed between 2600 BC and 2400 BC. The surrounding circular earth bank and ditch, …","other":"สโตนเฮนจ์"}},{"th":{"title":"จัตุรัสนักบุญเปโตร","url":"https://th.wikipedia.org/wiki/%E0%B8%88%E0%B8%B1%E0%B8%95%E0%B8%B8%E0%B8%A3%E0%B8%B1%E0%B8%AA%E0%B8%99%E0%B8%B1%E0%B8%81%E0%B8%9A%E0%B8%B8%E0%B8%8D%E0%B9%80%E0%B8%9B%E0%B9%82%E0%B8%95%E0%B8%A3","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/59/2004_Saint_Peter%27s_Square.jpg/960px-2004_Saint_Peter%27s_Square.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"จัตุรัสนักบุญเปโตร (อังกฤษ: St. Peter\u0027s Square, ละติน: Forum Sancti Petri, อิตาลี: Piazza San Pietro   [ˈpjattsa sam ˈpjɛːtro]) เป็นจัตุรัสของเมืองขนาดใหญ่ที่ตั้งอยู่ด้านหน้าของมหาวิหารเซนต์ปีเตอร์ ในนครรัฐวาติกัน ซึ่งเป็นดินแดนแทรกที่เป็นที่ประทับของพระสันตปาปา ภายในกรุงโรม ประเทศอิตาลี ตั้งอยู่ทางฝั่งตะวันตกของย่าน (rione) บอร์โก ทั้งจัตุรัสและมหาวิหารได้รับการตั้งชื่อตามซีโมนเปโตร อัครสาวกของพระเยซู ซึ่งคริสตังถือว่าเป็นพระสันตะปาปาพระองค์แรก\nตรงใจกลางจัตุรัสคือเสาโอเบลิสก์วาติกัน ซึ่งเป็นเสาโอเบลิสก์แบบอียิปต์โบราณ ที่นำมาตั้งในสถานที่ปัจจุบันเมื่อ ค.ศ. 1586 จัน โลเรนโซ แบร์นีนี ออกแบบจัตุรัสนี้ในช่วงเกือบ 100 ปีถัดมา โดยรวมถึงเสารายขนาดใหญ่สไตล์ตอสคานี ที่มีความลึกสี่เสา ซึ่งโอบรับผู้มาเยือนใน \"อ้อมอกแห่งมารดาของวัดแม่\" น้ำพุหินแกรนิตที่สร้างโดยแบร์นินีทางด้านใต้ในปี ค.ศ.","history":"จัตุรัสนักบุญเปโตร (อังกฤษ: St. Peter\u0027s Square, ละติน: Forum Sancti Petri, อิตาลี: Piazza San Pietro   [ˈpjattsa sam ˈpjɛːtro]) เป็นจัตุรัสของเมืองขนาดใหญ่ที่ตั้งอยู่ด้านหน้าของมหาวิหารเซนต์ปีเตอร์ ในนครรัฐวาติกัน ซึ่งเป็นดินแดนแทรกที่เป็นที่ประทับของพระสันตปาปา ภายในกรุงโรม ประเทศอิตาลี ตั้งอยู่ทางฝั่งตะวันตกของย่าน (rione) บอร์โก ทั้งจัตุรัสและมหาวิหารได้รับการตั้งชื่อตามซีโมนเปโตร อัครสาวกของพระเยซู ซึ่งคริสตังถือว่าเป็นพระสันตะปาปาพระองค์แรก\nตรงใจกลางจัตุรัสคือเสาโอเบลิสก์วาติกัน ซึ่งเป็นเสาโอเบลิสก์แบบอียิปต์โบราณ ที่นำมาตั้งในสถานที่ปัจจุบันเมื่อ ค.ศ. 1586 จัน โลเรนโซ แบร์นีนี ออกแบบจัตุรัสนี้ในช่วงเกือบ 100 ปีถัดมา โดยรวมถึงเสารายขนาดใหญ่สไตล์ตอสคานี ที่มีความลึกสี่เสา ซึ่งโอบรับผู้มาเยือนใน \"อ้อมอกแห่งมารดาของวัดแม่\" น้ำพุหินแกรนิตที่สร้างโดยแบร์นินีทางด้านใต้ในปี ค.ศ. 1675 ตรงกับน้ำพุอีกแห่งทางด้านเหนือที่ออกแบบโดยการ์โล มาแดร์โน ในปี ค.ศ. 1613\nจัตุรัสนักบุญเปโตรเป็นพื้นที่สำหรับทำกิจกรรมสำคัญในนครรัฐวาติกัน เช่น ในการประชุมเลือกสันตะปาปา จัตุรัสนักบุญเปโตรเป็นสถานที่ที่คริสตังจะมารวมตัวกันเพื่อสังเกตควันที่ออกมาจากปล่องของโบสถ์น้อยซิสทีน …","other":"St. Peter\u0027s Square"},"en":{"title":"St. Peter\u0027s Square","url":"https://en.wikipedia.org/wiki/St._Peter%27s_Square","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d6/St_Peter%27s_Square%2C_Vatican_City_-_April_2007.jpg/960px-St_Peter%27s_Square%2C_Vatican_City_-_April_2007.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"St. Peter\u0027s Square (Latin: Forum Sancti Petri, Italian: Piazza San Pietro [ˈpjattsa sam ˈpjɛːtro]) is a large plaza located directly in front of St. Peter\u0027s Basilica in Vatican City, the papal enclave in Rome, directly west of the neighborhood (rione) of Borgo.","history":"The open space which lies before the basilica was redesigned by Gian Lorenzo Bernini from 1667 to 1676, under the direction of Pope Alexander VII, as an appropriate forecourt, designed \"so that the greatest number of people could see the Pope give his blessing, either from the middle of the façade of the church or from a window in the Vatican Palace\". Bernini had been working on the interior of St. Peter\u0027s for decades; now he gave order to the space with his renowned colonnades, using a Tuscan order, to avoid competing with the palace-like façade by Carlo Maderno, but he employed it on an unprecedented colossal scale to suit the space and evoke a sense of awe.\nThere were many constraints from existing structures (illustration, right). The massed accretions of the Vatican Palace crowded the space to the right of the basilica\u0027s façade; the structures needed to be masked without obscuring the papal apartments. The Vatican obelisk marked a centre, and a granite fountain by Maderno stood to one side: Bernini made the fountain appear to be one of the foci of the ovato tondo embraced by …","other":"จัตุรัสนักบุญเปโตร"}},{"th":{"title":"พิพิธภัณฑ์กุกเกนไฮม์ บิลบาโอ","url":"https://th.wikipedia.org/wiki/%E0%B8%9E%E0%B8%B4%E0%B8%9E%E0%B8%B4%E0%B8%98%E0%B8%A0%E0%B8%B1%E0%B8%93%E0%B8%91%E0%B9%8C%E0%B8%81%E0%B8%B8%E0%B8%81%E0%B9%80%E0%B8%81%E0%B8%99%E0%B9%84%E0%B8%AE%E0%B8%A1%E0%B9%8C_%E0%B8%9A%E0%B8%B4%E0%B8%A5%E0%B8%9A%E0%B8%B2%E0%B9%82%E0%B8%AD","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c7/Bilbao_-_Guggenheim_aurore.jpg/960px-Bilbao_-_Guggenheim_aurore.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"พิพิธภัณฑ์กุกเกนไฮม์ บิลบาโอ (สเปน: Museo Guggenheim Bilbao; บาสก์: Guggenheim Bilbao Museoa) เป็นอาคารพิพิธภัณฑ์งานศิลปะสมัยใหม่และร่วมสมัย ตั้งอยู่ริมฝั่งแม่น้ำเนร์บีออน (Nervion) (แม่น้ำซึ่งไหลผ่านเมืองบิลบาโอสู่ทะเลกันตาเบรียในมหาสมุทรแอตแลนติก) ณ เมืองบิลบาโอ แคว้นบาสก์ ประเทศสเปน อาคารได้รับการออกแบบโดยแฟรงก์ เกห์รี สถาปนิกรางวัลพริตซ์เกอร์สัญชาติแคนาดา-อเมริกา เปิดตัวเมื่อวันที่ 18 ตุลาคม ค.ศ. 1997 โดยสมเด็จพระราชาธิบดีควน การ์โลสที่ 1 กษัตริย์สเปน ทรงให้เกียรติเป็นประธานเปิดอาคาร พิพิธภัณฑ์กุกเกนไฮม์เป็นหนึ่งในหลายพิพิธภัณฑ์ที่เป็นของมูลนิธิโซโลมอน อาร์. กุกเกนไฮม์ (Solomon R. Guggenheim Foundation) ซึ่งยังรวมถึงพิพิธภัณฑ์โซโลมอน อาร์.","history":"พิพิธภัณฑ์กุกเกนไฮม์ บิลบาโอ (สเปน: Museo Guggenheim Bilbao; บาสก์: Guggenheim Bilbao Museoa) เป็นอาคารพิพิธภัณฑ์งานศิลปะสมัยใหม่และร่วมสมัย ตั้งอยู่ริมฝั่งแม่น้ำเนร์บีออน (Nervion) (แม่น้ำซึ่งไหลผ่านเมืองบิลบาโอสู่ทะเลกันตาเบรียในมหาสมุทรแอตแลนติก) ณ เมืองบิลบาโอ แคว้นบาสก์ ประเทศสเปน อาคารได้รับการออกแบบโดยแฟรงก์ เกห์รี สถาปนิกรางวัลพริตซ์เกอร์สัญชาติแคนาดา-อเมริกา เปิดตัวเมื่อวันที่ 18 ตุลาคม ค.ศ. 1997 โดยสมเด็จพระราชาธิบดีควน การ์โลสที่ 1 กษัตริย์สเปน ทรงให้เกียรติเป็นประธานเปิดอาคาร พิพิธภัณฑ์กุกเกนไฮม์เป็นหนึ่งในหลายพิพิธภัณฑ์ที่เป็นของมูลนิธิโซโลมอน อาร์. กุกเกนไฮม์ (Solomon R. Guggenheim Foundation) ซึ่งยังรวมถึงพิพิธภัณฑ์โซโลมอน อาร์. กุกเกนไฮม์ นครนิวยอร์ก ที่ออกแบบโดยแฟรงก์ ลอยด์ ไรต์ ด้วย อาคารแห่งนี้ได้ถูกสร้างขึ้นเพื่อใช้จัดแสดงงานศิลปะต่าง ๆ จากทั้งศิลปินชาวสเปนและทั่วโลก พิพิธภัณฑ์กุกเกนไฮม์ บิลบาโอ ยังถือได้ว่าเป็นหนึ่งในพิพิธภัณฑ์ที่ใหญ่ที่สุดแห่งหนึ่งในสเปน มีสถิติผู้เยี่ยมชมสูงถึง 1,103,211 คน\nพิพิธภัณฑ์แห่งนี้ได้เริ่มขึ้นเมื่อรัฐบาลแคว้นบาสก์เสนอมูลนิธิโซโลมอน อาร์. กุกเกนไฮม์ ให้มาสร้างพิพิธภัณฑ์บริเวณท่าเรือเก่าริมฝั่งแม่น้ำในเมืองบิลบาโอ …","other":"Guggenheim Museum Bilbao"},"en":{"title":"Guggenheim Museum Bilbao","url":"https://en.wikipedia.org/wiki/Guggenheim_Museum_Bilbao","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c7/Museo_Guggenheim%2C_Bilbao_%2831273245344%29.jpg/960px-Museo_Guggenheim%2C_Bilbao_%2831273245344%29.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Guggenheim Museum Bilbao is a museum of modern and contemporary art in Bilbao, Biscay, Spain. It is one of several museums affiliated to the Solomon R. Guggenheim Foundation and features permanent and visiting exhibits of works by Spanish and international artists. It was inaugurated on 18 October 1997 by King Juan Carlos I of Spain, with an exhibition of 250 contemporary works of art.","history":"In 1991, the Basque Government suggested to the Solomon R. Guggenheim Foundation that it would fund a Guggenheim museum to be built in Bilbao\u0027s decrepit port area, once the city\u0027s main source of income. The Basque government agreed to cover the US$100 million construction cost, to create a $50 million acquisitions fund, to pay a one-time $20 million fee to the Guggenheim and to subsidize the museum\u0027s $12 million annual budget. In exchange, the foundation agreed to manage the institution, rotate parts of its permanent collection through the Bilbao museum and organize temporary exhibitions.\nThe museum was built by Ferrovial, at a cost of $89 million. About 5,000 residents of Bilbao attended a preopening extravaganza outside the museum on the night preceding the official opening, featuring an outdoor light show and concerts. On 18 October 1997 the museum was opened by Juan Carlos I of Spain.\nOn 13 October, two ETA militants shot dead a Basque policeman who interrupted their attempt to set up grenade launchers to attack the opening.\nIn 2008, the museum revealed that it was looking into …","other":"พิพิธภัณฑ์กุกเกนไฮม์ บิลบาโอ"}},{"th":{"title":"อาสนวิหารชาทร์","url":"https://th.wikipedia.org/wiki/%E0%B8%AD%E0%B8%B2%E0%B8%AA%E0%B8%99%E0%B8%A7%E0%B8%B4%E0%B8%AB%E0%B8%B2%E0%B8%A3%E0%B8%8A%E0%B8%B2%E0%B8%97%E0%B8%A3%E0%B9%8C","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c1/LaLumiere_CathedraleDeChartres_DSC08351.jpg/960px-LaLumiere_CathedraleDeChartres_DSC08351.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"อาสนวิหารชาทร์ หรือ อาสนวิหารพระแม่แห่งชาทร์ (ฝรั่งเศส: Cathédrale Notre-Dame de Chartres) เป็นอาสนวิหารโรมันคาทอลิกในเมืองชาทร์ ประเทศฝรั่งเศส ราว 80 km (50 ไมล์) ทางตะวันตกเฉียงใต้ของปารีส และเป็นอาสนวิหารของบิชอปแห่งชาทร์ ส่วนใหญ่ของอาคารสร้างขึ้นในปี 1194 ถึง 1220 โบสถ์หลังปัจจุบันเป็นหลังที่ห้าเป็นอย่างต่ำ อาสนวิหารได้รับสถานะแหล่งมรดกโลกโดยยูเนสโกซึ่งบรรยายอาสวิหารชาทร์ว่าเป็น \"จุดสูงสุดของศิลปะกอธิกแบบฝรั่งเศส\" สถาปัตยกรรมหลักของอาสนวิหารเปลี่ยนแปลงน้อยมากนับตั้งแต่ศตวรรษที่ 13 จึงเป็นหนึ่งในสถาปัตยกรรมจากยุคนั้นในฝรั่งเศสที่ยังคงอนุรักษ์มาถึงปัจจุบัน","history":"อาสนวิหารชาทร์ หรือ อาสนวิหารพระแม่แห่งชาทร์ (ฝรั่งเศส: Cathédrale Notre-Dame de Chartres) เป็นอาสนวิหารโรมันคาทอลิกในเมืองชาทร์ ประเทศฝรั่งเศส ราว 80 km (50 ไมล์) ทางตะวันตกเฉียงใต้ของปารีส และเป็นอาสนวิหารของบิชอปแห่งชาทร์ ส่วนใหญ่ของอาคารสร้างขึ้นในปี 1194 ถึง 1220 โบสถ์หลังปัจจุบันเป็นหลังที่ห้าเป็นอย่างต่ำ อาสนวิหารได้รับสถานะแหล่งมรดกโลกโดยยูเนสโกซึ่งบรรยายอาสวิหารชาทร์ว่าเป็น \"จุดสูงสุดของศิลปะกอธิกแบบฝรั่งเศส\" สถาปัตยกรรมหลักของอาสนวิหารเปลี่ยนแปลงน้อยมากนับตั้งแต่ศตวรรษที่ 13 จึงเป็นหนึ่งในสถาปัตยกรรมจากยุคนั้นในฝรั่งเศสที่ยังคงอนุรักษ์มาถึงปัจจุบัน","other":"Chartres Cathedral"},"en":{"title":"Chartres Cathedral","url":"https://en.wikipedia.org/wiki/Chartres_Cathedral","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/28/Notre_Dame_de_Chartres.jpg/960px-Notre_Dame_de_Chartres.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Chartres Cathedral (French: Cathédrale Notre-Dame de Chartres, lit. \u0027Cathedral of Our Lady of Chartres\u0027) is a Catholic cathedral in Chartres, France, about 80 km (50 miles) southwest of Paris, and is the seat of the Bishop of Chartres. Dedicated in honour of the Virgin Mary (\u0027Our Lady\u0027), it was mostly constructed between 1194 and 1220. It stands on the site of at least five cathedrals that have occupied the site since the Diocese of Chartres was formed as an episcopal see in the 4th century.","history":"At least five cathedrals have stood on this site, each replacing an earlier building damaged by war or fire. The first church dated from no later than the 4th century and was located at the base of a Gallo-Roman wall; this was put to the torch in 743 on the orders of the Duke of Aquitaine. The second church on the site was set on fire by Danish pirates in 858. This was then reconstructed and enlarged by Bishop Gislebert, but was itself destroyed by fire in 1020. A vestige of this church, now known as Saint Lubin Chapel, remains, underneath the apse of the present cathedral. It took its name from Lubinus, the mid-6th-century Bishop of Chartres. It is lower than the rest of the crypt and may have been the shrine of a local saint, prior to the church\u0027s rededication to the Virgin Mary.\nIn 962, the church was damaged by another fire and was reconstructed yet again. A more serious fire broke out on 7 September 1020, after which Bishop Fulbert (bishop from 1006 to 1028) decided to build a new cathedral. He appealed to the royal houses of Europe, and received generous donations for the …","other":"อาสนวิหารชาทร์"}},{"th":{"title":"โบสถ์ซันตามาเรียเดลลาวิตโตเรีย","url":"https://th.wikipedia.org/wiki/%E0%B9%82%E0%B8%9A%E0%B8%AA%E0%B8%96%E0%B9%8C%E0%B8%8B%E0%B8%B1%E0%B8%99%E0%B8%95%E0%B8%B2%E0%B8%A1%E0%B8%B2%E0%B9%80%E0%B8%A3%E0%B8%B5%E0%B8%A2%E0%B9%80%E0%B8%94%E0%B8%A5%E0%B8%A5%E0%B8%B2%E0%B8%A7%E0%B8%B4%E0%B8%95%E0%B9%82%E0%B8%95%E0%B9%80%E0%B8%A3%E0%B8%B5%E0%B8%A2","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9a/Santa_Maria_della_Vittoria_in_Rome_-_Front.jpg/960px-Santa_Maria_della_Vittoria_in_Rome_-_Front.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"โบสถ์ซันตามาเรียเดลลาวิตโตเรีย หรือโบสถ์แม่พระแห่งชัย (อิตาลี: Chiesa di Santa Maria della Vittoria) เป็นโบสถ์บาซิลิกาขนาดเล็กแห่งหนึ่งในกรุงโรม","history":"โบสถ์แห่งหนึ่งเริ่มต้นสร้างเป็นวิหารในปี พ.ศ. 2148 เพื่อสักการะนักบุญเปาโลอัครทูต หลังจากฝ่ายคาทอลิกได้รับชัยชนะจากสงคราม White Mountain ในปี พ.ศ. 2163 โบสถ์แห่งนี้ก็ได้เปลี่ยนวัตถุประสงค์มาเป็นเพื่อสักการะพระแม่มารีย์","other":"Santa Maria della Vittoria, Rome"},"en":{"title":"Santa Maria della Vittoria, Rome","url":"https://en.wikipedia.org/wiki/Santa_Maria_della_Vittoria,_Rome","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9a/Santa_Maria_della_Vittoria_in_Rome_-_Front.jpg/960px-Santa_Maria_della_Vittoria_in_Rome_-_Front.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Santa Maria della Vittoria (English: Saint Mary of Victory, Latin: S. Mariae de Victoria) is a Catholic titular minor basilica and Discalced Carmelite conventual church dedicated to Our Lady of Victories in Rome, Italy, famously the home of Gian Lorenzo Bernini‘s masterpiece the Ecstasy of Saint Teresa. The church is in the Rione Sallustiano, on number 98 via XX Settembre, where this street intersects with Largo Santa Susanna. It is located next to the Fountain of Moses and mirrors the Church of Santa Susanna across the Largo.","history":"The land for the church was purchased on April 20, 1607, and the church was built from 1608 to 1620 as a chapel dedicated to Saint Paul for the Discalced Carmelites. After the Catholic victory at the Battle of White Mountain in 1620, which reversed the Reformation in Bohemia, the church was rededicated to the Virgin Mary. Ottoman standards captured at the 1683 Battle of Vienna were later hung in the church, reinforcing to the theme of the Virgin helping lead Catholic armies to victory.\nThe order itself funded the building work until the discovery of the Borghese Hermaphroditus in the excavations. Scipione Borghese, Cardinal-nephew of Pope Paul V, appropriated this sculpture but, in return, funded the rest of work on the façade and granted the order his architect, Giovanni Battista Soria. These grants only came into effect in 1624, and work was completed two years later.","other":"โบสถ์ซันตามาเรียเดลลาวิตโตเรีย"}},{"th":null,"en":{"title":"House of the Temple","url":"https://en.wikipedia.org/wiki/House_of_the_Temple","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d0/House_of_the_Temple.JPG/960px-House_of_the_Temple.JPG?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The House of the Temple (officially, Home of The Supreme Council, 33°, Ancient \u0026 Accepted Scottish Rite of Freemasonry, Southern Jurisdiction, Washington D.C., U.S.A.) is a Masonic temple in Washington, D.C., United States, that serves as the headquarters of the Scottish Rite of Freemasonry, Southern Jurisdiction, U.S.A.\nDesigned by John Russell Pope, it stands at 1733 16th Street, N.W., in the Dupont Circle neighborhood, about one mile directly north of the White House.  The full name of the Supreme Council is \"The Supreme Council (Mother Council of the World) of the Inspectors General Knights Commander of the House of the Temple of Solomon of the Thirty-third degree of the Ancient and Accepted Scottish Rite of Freemasonry of the Southern Jurisdiction of the United States of America.\"  It was modeled after the tomb of Mausolus at Halicarnassus.\nThe Temple holds one of the world\u0027s largest collection of materials related to Scottish poet and Freemason Robert Burns outside of Scotland.","history":"On May 31, 1911, 110 years after the founding of the Supreme Council, Grand Commander James D. Richardson broke ground on the spot where the House of the Temple now stands in Washington, D.C. Grand Master J. Claude Keiper, of the Grand Lodge of the District of Columbia, laid the cornerstone in the northeast corner on October 18, 1911.\nThe temple was designed by architect John Russell Pope, who modeled it after the tomb of Mausolus at Halicarnassus, one of the Seven Wonders of the Ancient World. The building was dedicated four years later on October 18, 1915.\nThe building\u0027s design was widely praised by
