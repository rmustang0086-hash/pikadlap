contemporary architects, and it won Pope the Gold Medal of the Architectural League of New York in 1917. In his 1920 book L\u0027Architecture aux États-Unis, French architect Jacques Gréber described it as \"a monument of remarkable sumptuousness ... the ensemble is an admirable study of antique architecture stamped with a powerful dignity.\" Fiske Kimball\u0027s 1928 book American Architecture describes it as \"an example of the triumph of classical form in America\". In the 1920s, a panel of …","other":null}},{"th":{"title":"มหาวิหารนักบุญมาระโก","url":"https://th.wikipedia.org/wiki/%E0%B8%A1%E0%B8%AB%E0%B8%B2%E0%B8%A7%E0%B8%B4%E0%B8%AB%E0%B8%B2%E0%B8%A3%E0%B8%99%E0%B8%B1%E0%B8%81%E0%B8%9A%E0%B8%B8%E0%B8%8D%E0%B8%A1%E0%B8%B2%E0%B8%A3%E0%B8%B0%E0%B9%82%E0%B8%81","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/61/Venezia_Basilica_di_San_Marco_Fassade_2.jpg/960px-Venezia_Basilica_di_San_Marco_Fassade_2.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"มหาวิหารนักบุญมาระโก หรือชื่อเต็มคือ อัครบิดรอาสนมหาวิหารนักบุญมาระโก (อิตาลี: Basilica Cattedrale Patriarcale di San Marco, อังกฤษ: St Mark\u0027s Basilica หรือ Saint Mark\u0027s Basilica) เป็นโบสถ์โรมันคาทอลิก ระดับมหาวิหารรอง ประจำเขตอัครบิดรเวนิสในประเทศอิตาลี สถาปัตยกรรมที่เห็นอยู่ในปัจจุบันเป็นแบบกอทิก ได้รับการเสกในปี ค.ศ. 1094\nมหาวิหารนักบุญมาระโกที่เป็นตัวอย่างอันสำคัญของสถาปัตยกรรมไบแซนไทน์ตั้งอยู่ที่จัตุรัสซันมาร์โกติดและเชื่อมกับปาลัซโซดูกาเล เดิมตัวโบสถ์เป็นโบสถ์น้อยของประมุขผู้ครองเวนิส และมิได้เป็นมหาวิหารของเมือง แต่ตั้งแต่ปี ค.ศ.","history":"มหาวิหารนักบุญมาระโก หรือชื่อเต็มคือ อัครบิดรอาสนมหาวิหารนักบุญมาระโก (อิตาลี: Basilica Cattedrale Patriarcale di San Marco, อังกฤษ: St Mark\u0027s Basilica หรือ Saint Mark\u0027s Basilica) เป็นโบสถ์โรมันคาทอลิก ระดับมหาวิหารรอง ประจำเขตอัครบิดรเวนิสในประเทศอิตาลี สถาปัตยกรรมที่เห็นอยู่ในปัจจุบันเป็นแบบกอทิก ได้รับการเสกในปี ค.ศ. 1094\nมหาวิหารนักบุญมาระโกที่เป็นตัวอย่างอันสำคัญของสถาปัตยกรรมไบแซนไทน์ตั้งอยู่ที่จัตุรัสซันมาร์โกติดและเชื่อมกับปาลัซโซดูกาเล เดิมตัวโบสถ์เป็นโบสถ์น้อยของประมุขผู้ครองเวนิส และมิได้เป็นมหาวิหารของเมือง แต่ตั้งแต่ปี ค.ศ. 1807 เป็นต้นมาจึงใช้เป็นที่นั่งของอัครบิดรแห่งเวนิส ตัวสิ่งก่อสร้างเป็นสิ่งก่อสร้างที่สร้างอย่างงดงามประดับด้วยงานโมเสกแบบไบแซนไทน์ และ ประติมากรรมต่างที่แสดงถึงความอุดมสมบูรณ์ อำนาจ และ ความมั่งคั่งของเวนิส ตั้งแต่คริสต์ศตวรรษที่ 11 ก็ได้รับสมญาว่า “Chiesa d\u0027Oro” หรือ “โบสถ์ทอง”","other":"St Mark\u0027s Basilica"},"en":{"title":"St Mark\u0027s Basilica","url":"https://en.wikipedia.org/wiki/St_Mark%27s_Basilica","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/61/Venezia_Basilica_di_San_Marco_Fassade_2.jpg/960px-Venezia_Basilica_di_San_Marco_Fassade_2.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Patriarchal Cathedral Basilica of Saint Mark (Italian: Basilica Cattedrale Patriarcale di San Marco), commonly known as St Mark\u0027s Basilica (Italian: Basilica di San Marco; Venetian: Baxéłega de San Marco), is the cathedral church of the Patriarchate of Venice; it became the episcopal seat of the Patriarch of Venice in 1807, replacing the earlier cathedral of San Pietro di Castello. It is dedicated to and holds the relics of Saint Mark the Evangelist, the patron saint of the city.\nThe church is located on the eastern end of Saint Mark\u0027s Square, the former political and religious centre of the Republic of Venice, and is attached to the Doge\u0027s Palace.","history":"Several medieval chronicles narrate the translatio, the removal of Saint Mark\u0027s body (excluding the head) from Alexandria in Egypt by two Venetian merchants and its transfer to Venice in 828/829. The Chronicon Venetum further recounts that the relics of Saint Mark were initially placed in a corner tower of the castrum, the fortified residence of the Doge and seat of government located on the site of the present Doge\u0027s Palace. Doge Giustiniano Participazio (in office 827–829) subsequently stipulated in his will that his widow and his younger brother and successor Giovanni (in office 829–832) were to erect a church dedicated to Saint Mark wherein the relics would ultimately be housed. Giustiniano further specified that the new church was to be built between the castrum and the Church of Saint Theodore to the north. Construction of the new church may have actually been underway during Doge Giustiniano\u0027s lifetime and was completed by 836 when the relics of Saint Mark were transferred.\nAlthough the Participazio church was long believed to have been a rectangular structure with a single …","other":"มหาวิหารนักบุญมาระโก"}},{"th":{"title":"มง-แซ็ง-มีแชล","url":"https://th.wikipedia.org/wiki/%E0%B8%A1%E0%B8%87-%E0%B9%81%E0%B8%8B%E0%B9%87%E0%B8%87-%E0%B8%A1%E0%B8%B5%E0%B9%81%E0%B8%8A%E0%B8%A5","img":"https://upload.wikimedia.org/wikipedia/commons/1/10/Mont_Saint_Michel_bordercropped.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail_unscaled","intro":"มง-แซ็ง-มีแชล (ฝรั่งเศส: Mont-Saint-Michel) คือวิหารที่ตั้งอยู่บนเกาะโดดเดี่ยวกลางทะเลชายฝั่งตะวันตก บริเวณจังหวัดม็องช์ แคว้นนอร์ม็องดี ประเทศฝรั่งเศส ได้รับประกาศจากยูเนสโกให้เป็นแหล่งมรดกโลกเมื่อปี พ.ศ. 2522 ภายใต้ชื่อ มง-แซ็ง-มีแชลและอ่าว \nในปีหนึ่งจะมีนักท่องเที่ยวไปเยี่ยมเยือนมง-แซ็ง-มีแชลกว่า 3 ล้าน 2 แสนคน ซึ่งทำให้ที่นี่เป็นสถานที่ท่องเที่ยวยอดนิยมอันดับที่ 3 ของประเทศฝรั่งเศสรองลงมาจากหอไอเฟลและพระราชวังแวร์ซาย \nตัวเกาะอันเป็นที่ตั้งของวิหารนั้นเป็นหินแกรนิต โดยมีเส้นรอบวงเกาะประมาณ 960 เมตร และสูง 92 เมตร แล้วถ้าบวกกับความสูงของตัววิหารนั้นแล้วก็จะมีความสูงถึง 155 แมตร ถือเป็นปราการธรรมชาติตั้งแต่สมัยยุคกลาง โดยตั้งชื่อตามวิหารที่ตั้งตระหง่านอยู่บนยอดเขานั่นเอง บนยอดวิหารเป็นรูปปั้นทองของอัครทูตสวรรค์มีคาเอล (นักบุญมิคาเอล) สร้างโดยแอมานุแอล เฟรมีเย (Emmanuel Frémiet) \nในปัจจุบัน มีประชากรอยู่อาศัยบนเกาะ 50 คน จากสถิติ ณ ปี ค.ศ.","history":"ก่อนที่จะมีการสถาปนาราชวงศ์แรกของฝรั่งเศสขึ้นในช่วงคริสต์ศตวรรษที่ 8 เกาะนี้เคยถูกเรียกว่า มงตงบ์ (Mont Tombe) และตามตำนาน วิหารที่อยู่บนเกาะนี้ถูกสร้างโดยการแนะนำของเทวดามีแชล ที่ได้เข้าฝันนักบุญโอแบร์ บิชอปแห่งมาฟร็องช์เมื่อปี พ.ศ. 1251 แต่เขาก็มิได้ปฏิบัติตาม เนื่องจากนึกว่าปีศาจได้มาเข้าฝัน เขาจึงได้เพิกเฉยไป จนมาถึงการฝันครั้งที่ 3 มีแชลได้ใช้นิ้วของเขาจิ้มที่หัวของโอแบร์ และเมื่อเขาตื่นขึ้นมา เขาก็ได้ตะลึงว่ามีรูอยู่บนหัวจริง ๆ จากนั้นมาเขาจึงตัดสินใจสร้างวิหารบนยอดเขา  \nในช่วงการปฏิวัติฝรั่งเศส เนื่องจากไม่มีพระจำพรรษา ตัววิหารได้ถูกเปลี่ยนเป็นที่คุมขังนักโทษสำคัญการเมือง จนกระทั่งวิกตอร์ อูโก ได้มีบทบาทสำคัญในการรณรงค์เพื่อคืนความเป็นสิ่งก่อสร้างสำคัญทางสถาปัตยกรรมของชาติ และในที่สุดได้มีการยกเลิกการเป็นเรือนจำ และได้ถูกเปลี่ยนสถานะเป็นสถานที่สำคัญทางประวัติศาสตร์ในปี พ.ศ. 2417 \nในปี พ.ศ. 2522 ได้มีการขึ้นทะเบียนเป็นมรดกโลกทางวัฒนธรรม ประวัติศาสตร์ และสถาปัตยกรรม โดยองค์การยูเนสโก","other":"Mont-Saint-Michel"},"en":{"title":"Mont-Saint-Michel","url":"https://en.wikipedia.org/wiki/Mont-Saint-Michel","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/78/Mont-Saint-Michel_vu_du_ciel.jpg/960px-Mont-Saint-Michel_vu_du_ciel.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Mont-Saint-Michel (French pronunciation: [lə mɔ̃ sɛ̃ miʃɛl]; Norman: Mont Saint Miché; English: Saint Michael\u0027s Mount) is a tidal island and mainland commune in Normandy, France.\nThe island lies approximately one kilometre (half a nautical mile) off France\u0027s north-western coast, at the mouth of the Couesnon River near Avranches and is 7 hectares (17 acres) in area. The mainland part of the commune is 393 hectares (971 acres) in area so that the total surface of the commune is 400 hectares (990 acres).","history":"Before the construction of the first monastic establishment in the 8th century, the island was called Mont Tombe (Latin: tumba). According to a legend, the archangel Michael appeared in 708 to Aubert of Avranches, the bishop of Avranches, and instructed him to build a church on the rocky islet.\nUnable to defend his kingdom against the assaults of the Vikings, the king of the Franks agreed to grant the Cotentin Peninsula and the Avranchin, including Mont-Saint-Michel traditionally linked to the city of Avranches, to the Bretons in the Treaty of Compiègne. This marked the beginning of a brief period of Breton possession of the Mont. In fact, these lands and Mont-Saint-Michel were never really included in the duchy of Brittany. Around 989–990 these traditional bishoprics, dependent of the archbishopric of Rouen and that had been left vacant during the time of the Viking raids, regained their bishops.\nThe mount gained strategic significance again in 933 when William I Longsword annexed the Cotentin Peninsula from the weakened Duchy of Brittany. This made the mount definitively part of …","other":"มง-แซ็ง-มีแชล"}},{"th":null,"en":{"title":"Saint-Sulpice, Paris","url":"https://en.wikipedia.org/wiki/Saint-Sulpice,_Paris","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5a/Paris_Saint-Sulpice_Fassade_4-5_A.jpg/960px-Paris_Saint-Sulpice_Fassade_4-5_A.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Church of Saint-Sulpice (French pronunciation: [sɛ̃ sylpis] ) is a Catholic church in Paris, France, on the east side of Place Saint-Sulpice, in the 6th arrondissement. It is the second largest church in the city. It is dedicated to Sulpitius the Pious.","history":"The present church is the second building on the site, erected over a Romanesque church originally constructed during the 13th century. Additions were made over the centuries, up to 1631. The new building was founded in 1646 by parish priest Jean-Jacques Olier (1608–1657) who had established the Society of Saint-Sulpice, a clerical congregation, and a seminary attached to the church. Anne of Austria laid the first stone.\nConstruction began in 1646 to designs which had been created in 1636 by Christophe Gamard, but the Fronde interfered, and only the Lady Chapel had been built by 1660, when Daniel Gittard provided a new general design for most of the church. Gittard completed the sanctuary, ambulatory, apsidal chapels, transept, and north portal (1670–1678), after which construction was halted for lack of funds.\nGilles-Marie Oppenord and Giovanni Servandoni, adhering closely to Gittard\u0027s designs, supervised further construction (mainly the nave and side-chapels, 1719–1745). The decoration was executed by the brothers Sébastien-Antoine Slodtz (1695–1742) and Paul-Ambroise Slodtz …","other":null}},{"th":{"title":"บาซิลิกาซิสเทิร์น","url":"https://th.wikipedia.org/wiki/%E0%B8%9A%E0%B8%B2%E0%B8%8B%E0%B8%B4%E0%B8%A5%E0%B8%B4%E0%B8%81%E0%B8%B2%E0%B8%8B%E0%B8%B4%E0%B8%AA%E0%B9%80%E0%B8%97%E0%B8%B4%E0%B8%A3%E0%B9%8C%E0%B8%99","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cc/Basilica_Cistern_after_restoration_2022_%2811%29.jpg/960px-Basilica_Cistern_after_restoration_2022_%2811%29.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"บาซิลิกาซิสเทิร์น (อังกฤษ: Basilica Cistern, กรีก: Βασιλική Κινστέρνα, ตุรกี: Yerebatan Sarnıcı หรือ Yerebatan Saray) เป็นโพรงน้ำใต้ดินโบราณที่ใหญ่ที่สุดในนครอิสตันบูล ประเทศตุรกี ตั้งอยู่ห่างไป 150 เมตร (490 ฟุต) ทางใต้ของอายาโซฟยา บนคาบสมุทรซารายบูร์นู บาซิลิกาซิสเทิร์นสร้างขึ้นในศตวรรษที่ 6 ในรัชสมัยของจักรพรรดิบีแซนทีน ยุสตีนยาที่หนึ่ง และมีบันทึกอ้างว่าใช้ทาสกว่า 7,000 คนในการก่อสร้าง ปัจจุบันมีการคงระดับน้ำภายในให้ต่ำสำหรับเปิดให้สาธารณชนสามารถเข้าชมได้","history":"บาซิลิกาซิสเทิร์น (อังกฤษ: Basilica Cistern, กรีก: Βασιλική Κινστέρνα, ตุรกี: Yerebatan Sarnıcı หรือ Yerebatan Saray) เป็นโพรงน้ำใต้ดินโบราณที่ใหญ่ที่สุดในนครอิสตันบูล ประเทศตุรกี ตั้งอยู่ห่างไป 150 เมตร (490 ฟุต) ทางใต้ของอายาโซฟยา บนคาบสมุทรซารายบูร์นู บาซิลิกาซิสเทิร์นสร้างขึ้นในศตวรรษที่ 6 ในรัชสมัยของจักรพรรดิบีแซนทีน ยุสตีนยาที่หนึ่ง และมีบันทึกอ้างว่าใช้ทาสกว่า 7,000 คนในการก่อสร้าง ปัจจุบันมีการคงระดับน้ำภายในให้ต่ำสำหรับเปิดให้สาธารณชนสามารถเข้าชมได้\nชื่อบาซิลิกานี้ได้มาจากในอดีตซิสเทิร์นนี้ตั้งอยู่ใต้จัตุรัสสาธารณะขนาดใหญ่ที่ชื่อ สโตอาบาซิลิกา (Stoa Basilica) บนเนินเขาที่หนึ่ง ก่อนหน้านี้จัตุรัสเคยเป็นที่ตั้งของบาซิลิกาที่สร้างขึ้นในต้นศตวรรษที่ 3-4\n== อ้างอิง ==","other":"Basilica Cistern"},"en":{"title":"Basilica Cistern","url":"https://en.wikipedia.org/wiki/Basilica_Cistern","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ae/Cisterna_Bas%C3%ADlica%2C_Estambul%2C_Turqu%C3%ADa%2C_2024-09-28%2C_DD_58-60_HDR.jpg/960px-Cisterna_Bas%C3%ADlica%2C_Estambul%2C_Turqu%C3%ADa%2C_2024-09-28%2C_DD_58-60_HDR.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Basilica Cistern, or Cisterna Basilica (Greek: Βασιλική Κινστέρνα, Turkish: Yerebatan Sarnıcı or Yerebatan Sarayı, \"Subterranean Cistern\" or \"Subterranean Palace\"), is the largest of several hundred ancient cisterns that lie beneath the city of Istanbul, Turkey. The cistern, located 150 metres (490 ft) southwest of the Hagia Sophia on the historical peninsula of Sarayburnu, was built in the 6th century during the reign of Byzantine emperor Justinian I. Today, it is kept with little water for public access inside the space.","history":"Prior to the cistern\u0027s construction, a great basilica stood on the spot. It had been built during the Early Roman Age between the 3rd and 4th centuries as a commercial, legal, and artistic centre. The subterranean cistern was built in the 6th century during the reign of Byzantine emperor Justinian I. It was called Basilica because it was located under a large public square, the Stoa Basilica, on the First Hill of Constantinople.\nAncient texts indicated that the basilica cistern contained gardens surrounded by a colonnade that faced the Hagia Sophia.\nHistorical texts claim that 7,000 enslaved people were involved in the construction of the cistern.\nThe existence of the cistern was eventually forgotten by all but the locals who still drew water from it until, in 1565, the French traveller Petrus Gyllius left a record of it. Gyllius recorded being rowed in between the columns and seeing fish swimming in the water beneath the boat.\nThe Istanbul Metropolitan Municipality undertook the first major modern restoration of the Basilica Cistern between 1985 and 1987. More than 50,000 tons of …","other":"บาซิลิกาซิสเทิร์น"}},{"th":null,"en":{"title":"Santa Maria de Montserrat Abbey","url":"https://en.wikipedia.org/wiki/Santa_Maria_de_Montserrat_Abbey","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d5/Abbey_of_Montserrat_02.jpg/960px-Abbey_of_Montserrat_02.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Santa Maria de Montserrat (Catalan pronunciation: [ˈsantə məˈɾi.ə ðə munsəˈrat]) is an abbey of the Order of Saint Benedict located on the mountain of Montserrat in Monistrol de Montserrat, Catalonia, Spain. It is notable for enshrining the image of the Virgin of Montserrat. The monastery was founded in 1025 and rebuilt between the 19th and 20th centuries.","history":"The legend places the finding of the statue of the Virgin of Montserrat around 880. Then began the cult of the Moreneta virgin, which materialized in four earlier hermitages in the 9th century: Santa Maria, Sant Iscle, Sant Pere and Sant Martí. However, the origin of the monastery is uncertain. It is known that around 1011 a monk from the monastery of Santa Maria de Ripoll came to the mountain to take charge of the monastery of Santa Cecília de Montserrat, thus leaving the monastery under the orders of Abbot Oliba of Ripoll. Santa Cecília did not accept this new situation, so Oliba decided to found the monastery of Santa Maria in the place where there was an old hermitage of the same name (1025). As of 1082, Santa Maria gained an abbot of her own and ceased to depend on the abbot of Ripoll. This hermitage had become the most important of all those that existed in the mountain thanks to the statue of the Virgin that was venerated in it since 880.\nIn 1811 and in 1812, during Napoleon\u0027s invasion of Spain, the abbey was twice burned down and ransacked by Napoleon\u0027s troops, and many of …","other":null}},{"en":{"title":"Fontana dei Quattro Fiumi","url":"https://en.wikipedia.org/wiki/Fontana_dei_Quattro_Fiumi","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a5/Obelisco_Fontana_dei_Fiumi_Piazza_Navona_Roma.jpg/960px-Obelisco_Fontana_dei_Fiumi_Piazza_Navona_Roma.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Fontana dei Quattro Fiumi (Fountain of the Four Rivers) is a fountain in the Piazza Navona in Rome, Italy. It was designed in 1651 by Gian Lorenzo Bernini for Pope Innocent X whose family palace, the Palazzo Pamphili, faced onto the piazza as did the church of Sant\u0027Agnese in Agone of which Innocent was the sponsor.","history":"Fontana dei Quattro Fiumi (Fountain of the Four Rivers) is a fountain in the Piazza Navona in Rome, Italy. It was designed in 1651 by Gian Lorenzo Bernini for Pope Innocent X whose family palace, the Palazzo Pamphili, faced onto the piazza as did the church of Sant\u0027Agnese in Agone of which Innocent was the sponsor.","other":null},"th":{"title":"จัตุรัสนาโวนา","url":"https://th.wikipedia.org/wiki/%E0%B8%88%E0%B8%B1%E0%B8%95%E0%B8%B8%E0%B8%A3%E0%B8%B1%E0%B8%AA%E0%B8%99%E0%B8%B2%E0%B9%82%E0%B8%A7%E0%B8%99%E0%B8%B2","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/80/Piazza_Navona%2C_Rome.jpg/960px-Piazza_Navona%2C_Rome.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"จัตุรัสนาโวนา (อิตาลี: Piazza Navona) เป็นจัตุรัสแห่งหนึ่งในกรุงโรม เคยเป็นสนามกีฬาโรมันโบราณในคริสต์ศตวรรษที่ 1 ที่ชื่อว่า Stadium of Domitian ซึ่งชาวโรมันจะเดินทางมาที่นี่เพื่อชม agones (\"กีฬา\") โดยในสมัยนั้นสถานที่แห่งนี้รู้จักในชื่อว่า \u0027Circus Agonalis\u0027 (สนามกีฬา) เชื่อกันว่าชื่อของจัตุรัสนี้มาจากการเรียกชื่อสถานที่เพี้ยนจาก \u0027in agone\u0027 เป็น \u0027navone\u0027 จนกระทั่งกลายมาเป็น \u0027navona\u0027 ในที่สุด","history":"จัตุรัสนาโวนา (อิตาลี: Piazza Navona) เป็นจัตุรัสแห่งหนึ่งในกรุงโรม เคยเป็นสนามกีฬาโรมันโบราณในคริสต์ศตวรรษที่ 1 ที่ชื่อว่า Stadium of Domitian ซึ่งชาวโรมันจะเดินทางมาที่นี่เพื่อชม agones (\"กีฬา\") โดยในสมัยนั้นสถานที่แห่งนี้รู้จักในชื่อว่า \u0027Circus Agonalis\u0027 (สนามกีฬา) เชื่อกันว่าชื่อของจัตุรัสนี้มาจากการเรียกชื่อสถานที่เพี้ยนจาก \u0027in agone\u0027 เป็น \u0027navone\u0027 จนกระทั่งกลายมาเป็น \u0027navona\u0027 ในที่สุด","other":"Piazza Navona"}},{"th":null,"en":{"title":"Rennes-le-Château","url":"https://en.wikipedia.org/wiki/Rennes-le-Ch%C3%A2teau","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/39/Rennes-le-Ch%C3%A2teau.jpg/960px-Rennes-le-Ch%C3%A2teau.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Rennes-le-Château (French pronunciation: [ʁɛn lə ʃato] ; Occitan: Rènnas del Castèl) is a commune approximately 5 km (3 miles) south of Couiza, in the Aude department in the Occitanie region in Southern France.\nThis hilltop village is known internationally; it receives tens of thousands of visitors per year, drawn by conspiracy theories surrounding a putative buried treasure discovered by its 19th-century priest Bérenger Saunière, the precise nature of which is disputed among those who credit its existence.","history":"Mountains frame both ends of the region—the Cévennes to the northeast and the Pyrenees to the south. The area is known for its scenery, with jagged ridges, deep river canyons and rocky limestone plateaus, with large caves underneath. Rennes-le-Château was the site of a prehistoric encampment, and later a Roman colony, or at least Roman villa or temple, such as is confirmed to have been built at Fa, 5 km (3.1 mi) west of Couiza, part of the Roman province of Gallia Narbonensis, the wealthiest part of Roman Gaul.\nRennes-le-Château was part of Septimania in the 6th and 7th centuries. It has been suggested that it was once an important Visigothic town, with some 30,000 people living in the city around 500–600 AD. Until 1659–1745 the area was not considered French territory, being part of the Catalan Country since 988. However, British archaeologist Bill Putnam and British physicist John Edwin Wood argued that, while there may have been a Visigothic town on the site of the present village, it would have had \"a population closer to 300 than 30,000\".\nBy 1050 the Counts of Toulouse held …","other":null}},{"th":null,"en":{"title":"Temple Church","url":"https://en.wikipedia.org/wiki/Temple_Church","img":"https://upload.wikimedia.org/wikipedia/commons/f/f4/Temple_Church%2C_Temple%2C_London_EC4_%282%29.jpeg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail_unscaled","intro":"The Temple Church, a royal peculiar in the Church of England, is a church in the Inner and Middle Temples located between Fleet Street and the River Thames in London, England. It was built by the Knights Templar for their English headquarters in the Temple precinct and consecrated on 10 February 1185 by Patriarch Heraclius of Jerusalem. During the reign of King John (1199–1216) it served as the royal treasury, supported by the role of the Knights Templar as proto-international bankers.","history":"In the mid-12th century, before the construction of the church, the Knights Templar in London had met at a site in High Holborn in a structure originally established by Hugues de Payens (the site had been historically the location of a Roman temple in Londinium, now known as London). Because of the rapid growth of the order, by the 1160s the site had become too confined, and the order purchased the current site for the establishment of a larger monastic complex as their headquarters in England. In addition to the church, the new compound originally contained residences, military training facilities, and recreational grounds for the military brethren and novices, who were not permitted to go into the City without the permission of the Master of the Temple.\nThe church building comprises two separate sections: The original circular church building, called the Round Church and now acting as a nave, and a later rectangular section adjoining on the east side, built approximately half a century later, forming the chancel.\nAfter the capture of Jerusalem in 1099 by the Crusaders, the Dome of …","other":null}},{"th":{"title":"อาสนวิหารน็อทร์-ดามแห่งปารีส","url":"https://th.wikipedia.org/wiki/%E0%B8%AD%E0%B8%B2%E0%B8%AA%E0%B8%99%E0%B8%A7%E0%B8%B4%E0%B8%AB%E0%B8%B2%E0%B8%A3%E0%B8%99%E0%B9%87%E0%B8%AD%E0%B8%97%E0%B8%A3%E0%B9%8C-%E0%B8%94%E0%B8%B2%E0%B8%A1%E0%B9%81%E0%B8%AB%E0%B9%88%E0%B8%87%E0%B8%9B%E0%B8%B2%E0%B8%A3%E0%B8%B5%E0%B8%AA","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f7/Notre-Dame_de_Paris%2C_4_October_2017.jpg/960px-Notre-Dame_de_Paris%2C_4_October_2017.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"อาสนวิหารน็อทร์-ดามแห่งปารีส (ฝรั่งเศส: Cathédrale Notre-Dame de Paris [nɔtʁ(ə) dam də paʁi] ) เป็นอาสนวิหารประจำอัครมุขมณฑลปารีส ตั้งอยู่ทางฝั่งตะวันออกของกรุงปารีส ประเทศฝรั่งเศส และเป็นที่ตั้งคาเทดราของอาร์ชบิชอปแห่งปารีส อาสนวิหารน็อทร์-ดามถือกันว่าเป็นโบสถ์ที่สวยงามที่สุดในลักษณะกอทิกแบบฝรั่งเศส โบสถ์นี้ได้รับการบูรณปฏิสังขรณ์โดยเออแฌน วียอแล-เลอ-ดุก ผู้เป็นสถาปนิกคนสำคัญที่สุดคนหนึ่งของฝรั่งเศส\nการก่อสร้างเป็นแบบกอทิก นับเป็นอาสนวิหารแรกที่สร้างในลักษณะนี้ และการก่อสร้างทำต่อเนื่องมาตลอดสมัยกอทิก ประติมากรรม และหน้าต่างประดับกระจกสี (stained glass) มีอิทธิพลจากศิลปะแบบแนทเชอราลลิสม์ ทำให้แตกต่างจากศิลปะโรมาเนสก์ที่สร้างก่อนหน้านั้น\nน็อทร์-ดามเป็นหนึ่งในบรรดาสิ่งก่อสร้างแรกที่ใช้ \"ครีบยันลอย\" ตามแบบเดิมไม่ได้บ่งถึงกำแพงค้ำยันรอบอาสนวิหาร \"บริเวณร้องเพลงสวด\" หรือ รอบบริเวณกลางโบสถ์ เมื่อเริ่มสร้างกำแพงโบสถ์สูงขึ้นกำแพงเริ่มร้าวเพราะน้ำหนักของสิ่งก่อสร้าง เพราะสถาปนิกสมัยกอทิกจะเน้นการสร้างสิ่งก่อสร้างที่สูง บาง และโปร่ง  เมื่อสร้างสูงขึ้นไปกำแพงไม่สามารถรับน้ำหนักและความกดดันของกำแพงและหลังคาได้ทำให้กำแพงโก่งออกไปและร้าว สถาปนิกจึงใช้วิธีแก้ด้วยการเติม \"กำแพงค้ำยัน\" ที่กางออกไปคล้ายปีกนกด้านนอกตัววัด เพื่อให้กำแพงค้ำยันนี้หนุนหรือค้ำกำแพงตัวโบสถ์เอาไว้ เมื่อทำไปแล้วนอกจากจะมีประโยชน์ทางการใช้สอยแล้วยังกลายเป็นเครื่องตกแต่งที่ทำให้สิ่งก่อสร้างความสวยงามขึ้น ฉะนั้นวิธีแก้ปัญหานี้จึงกลายเป็นเอกลักษณ์ส่วนหนึ่งของโบสถ์ที่สร้างแบบกอทิกไปในตัว\nในปี ค.ศ. 1793 ระหว่างการปฏิวัติฝรั่งเศส โบสถ์ได้รับความเสียหายอย่างหนัก ประติมากรรมและศิลปะทางศาสนาถูกทำลายไปมาก  อาสนวิหารได้รับการบูรณปฏิสังขรณ์ครั้งใหญ่ระหว่างคริสต์ศตวรรษที่ 19 จนมีสภาพเหมือนก่อนหน้าที่ถูกทำลาย\nเมื่อวันที่ 15 เมษายน ค.ศ. 2019 เกิดเหตุเพลิงไหม้อาสนวิหาร สร้างความเสียหายอย่างหนัก โดยไฟได้โหมไหม้ตรงด้านบนของอาสนวิหาร (สาเหตุเพลิงไหม้ คาดว่าเกิดมาจากการบูรณะวิหารตั้งแต่ปี ค.ศ.","history":"อาสนวิหารน็อทร์-ดามแห่งปารีส (ฝรั่งเศส: Cathédrale Notre-Dame de Paris [nɔtʁ(ə) dam də paʁi] ) เป็นอาสนวิหารประจำอัครมุขมณฑลปารีส ตั้งอยู่ทางฝั่งตะวันออกของกรุงปารีส ประเทศฝรั่งเศส และเป็นที่ตั้งคาเทดราของอาร์ชบิชอปแห่งปารีส อาสนวิหารน็อทร์-ดามถือกันว่าเป็นโบสถ์ที่สวยงามที่สุดในลักษณะกอทิกแบบฝรั่งเศส โบสถ์นี้ได้รับการบูรณปฏิสังขรณ์โดยเออแฌน วียอแล-เลอ-ดุก ผู้เป็นสถาปนิกคนสำคัญที่สุดคนหนึ่งของฝรั่งเศส\nการก่อสร้างเป็นแบบกอทิก นับเป็นอาสนวิหารแรกที่สร้างในลักษณะนี้ และการก่อสร้างทำต่อเนื่องมาตลอดสมัยกอทิก ประติมากรรม และหน้าต่างประดับกระจกสี (stained glass) มีอิทธิพลจากศิลปะแบบแนทเชอราลลิสม์ ทำให้แตกต่างจากศิลปะโรมาเนสก์ที่สร้างก่อนหน้านั้น\nน็อทร์-ดามเป็นหนึ่งในบรรดาสิ่งก่อสร้างแรกที่ใช้ \"ครีบยันลอย\" ตามแบบเดิมไม่ได้บ่งถึงกำแพงค้ำยันรอบอาสนวิหาร \"บริเวณร้องเพลงสวด\" หรือ รอบบริเวณกลางโบสถ์ เมื่อเริ่มสร้างกำแพงโบสถ์สูงขึ้นกำแพงเริ่มร้าวเพราะน้ำหนักของสิ่งก่อสร้าง เพราะสถาปนิกสมัยกอทิกจะเน้นการสร้างสิ่งก่อสร้างที่สูง บาง และโปร่ง  เมื่อสร้างสูงขึ้นไปกำแพงไม่สามารถรับน้ำหนักและความกดดันของกำแพงและหลังคาได้ทำให้กำแพงโก่งออกไปและร้าว สถาปนิกจึงใช้วิธีแก้ด้วยการเติม \"กำแพงค้ำยัน\" …","other":"Notre-Dame de Paris"},"en":{"title":"Notre-Dame de Paris","url":"https://en.wikipedia.org/wiki/Notre-Dame_de_Paris","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f7/Notre-Dame_de_Paris%2C_4_October_2017.jpg/960px-Notre-Dame_de_Paris%2C_4_October_2017.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Notre-Dame de Paris (French: Cathédrale Notre-Dame de Paris French: [nɔtʁ(ə) dam də paʁi] : \"Cathedral of Our Lady of Paris\"), often referred to simply as Notre-Dame, is a medieval Catholic cathedral and basilica on the Île de la Cité (an island in the River Seine), in the 4th arrondissement of Paris, France. It is the cathedral church of the Roman Catholic Archdiocese of Paris.\nThe cathedral, dedicated to the Virgin Mary (\"Our Lady\"), is considered one of the finest examples of French Gothic architecture.","history":"It is believed that before the arrival of Christianity in France, a Gallo-Roman temple dedicated to Jupiter stood on the site of Notre-Dame. Evidence for this includes the Pillar of the Boatmen, discovered beneath the cathedral in 1710. In the 4th or 5th century, a large early Christian church, the Cathedral of Saint Étienne, was built on the site, close to the royal palace. The entrance was situated about 40 metres (130 ft) west of the present west front of Notre-Dame, and the apse was located about where the west façade is today. It was roughly half the size of the later Notre-Dame, 70 metres (230 ft) long—and separated into nave and four aisles by marble columns, then decorated with mosaics.\nThe last church before the cathedral of Notre-Dame was a Romanesque remodelling of Saint-Étienne that, although enlarged and remodelled, was found to be unfit for the growing population of Paris. A baptistery, the Church of Saint-John-le-Rond, built about 452, was located on the north side of the west front of Notre-Dame until the work of Jacques-Germain Soufflot in the 18th century.\nIn 1160, …","other":"อาสนวิหารน็อทร์-ดามแห่งปารีส"}},{"th":null,"en":{"title":"Catacombs of Paris","url":"https://en.wikipedia.org/wiki/Catacombs_of_Paris","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6c/Catacumbas%2C_Par%C3%ADs%2C_Francia%2C_2022-11-01%2C_DD_105-107_HDR.jpg/960px-Catacumbas%2C_Par%C3%ADs%2C_Francia%2C_2022-11-01%2C_DD_105-107_HDR.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Catacombs of Paris (French: Catacombes de Paris, )  are underground ossuaries in Paris, France, which hold the remains of more than six million people. Built to consolidate Paris\u0027s ancient stone quarries, they extend south from the Barrière d\u0027Enfer (\"Gate of Hell\") former city gate. The ossuary was created as part of the effort to eliminate the effects of the city\u0027s overflowing cemeteries.","history":"Paris\u0027s newest burial grounds were to the southern outskirts of the Roman-era Left Bank city. In ruins after the Western Roman Empire\u0027s 5th-century end and the ensuing Frankish invasions, this settlement was eventually abandoned for the marshy Right Bank: from the 4th century, the first known settlement there was on higher ground around a Saint-Etienne church and burial ground (behind the present Hôtel de Ville), and urban expansion on the Right Bank began in earnest after other ecclesiastical landowners filled in the marshlands from the late 10th century. Thus, instead of burying its dead away from inhabited areas as usual, the Paris Right Bank settlement began with cemeteries near its centre.\nThe most central of these cemeteries, a burial ground around the 5th-century Notre-Dame-des-Bois church, became the property of the Saint-Opportune parish after the original church was demolished by the 9th-century Norman invasions. When it became its own parish associated with the church of the \"Saints Innocents\" from 1130, this burial ground, filling the land between the present rue …","other":null}},{"th":{"title":"พระราชวังแวร์ซาย","url":"https://th.wikipedia.org/wiki/%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%A3%E0%B8%B2%E0%B8%8A%E0%B8%A7%E0%B8%B1%E0%B8%87%E0%B9%81%E0%B8%A7%E0%B8%A3%E0%B9%8C%E0%B8%8B%E0%B8%B2%E0%B8%A2","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/54/Vue_a%C3%A9rienne_du_domaine_de_Versailles_par_ToucanWings_-_Creative_Commons_By_Sa_3.0_-_073.jpg/960px-Vue_a%C3%A9rienne_du_domaine_de_Versailles_par_ToucanWings_-_Creative_Commons_By_Sa_3.0_-_073.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"พระราชวังแวร์ซาย (ฝรั่งเศส: Château de Versailles [ʃɑto d(ə) vɛʁsɑj] ) เป็นพระราชวังหลวงแห่งหนึ่งของประเทศฝรั่งเศส ตั้งอยู่ที่แวร์ซาย ห่างจากกรุงปารีสไปทางตะวันตกประมาณ 12 ไมล์ (19 กิโลเมตร) พระราชวังแวร์ซายถือครองโดยสาธารณรัฐฝรั่งเศสและได้รับการจัดการภายใต้การกำกับของกระทรวงวัฒนธรรมฝรั่งเศส โดยสถาบันสาธารณะของพระราชวัง พิพิธภัณฑ์ และมรดกแห่งชาติของแวร์ซาย (Public Establishment of the Palace, Museum and National Estate of Versailles) มาตั้งแต่ ค.ศ. 1995 มีนักท่องเที่ยวมาเยี่ยมชมพระราชวังหรือสวนแวร์ซาย 15,000,000 คนต่อปี ทำให้เป็นหนึ่งในสถานที่ท่องเที่ยวที่ยอดนิยมที่สุดในโลก อย่างไรก็ตาม เนื่องจากการระบาดทั่วของโควิด-19 ทำให้มีนักท่องเที่ยวลดลงร้อยละ 75 จนเหลือเพียงแปดล้านคนใน ค.ศ. 2019 ถึงสองล้านคนใน ค.ศ.","history":"เดิมเมืองแวร์ซายเป็นเพียงเมืองเล็ก ๆ แห่งหนึ่ง มีผู้คนอาศัยอยู่เบาบาง บริเวณส่วนใหญ่เป็นป่าเขาเยี่ยงชนบทอื่น ๆ ของฝรั่งเศส เมื่อพระเจ้าหลุยส์ที่ 13 แห่งฝรั่งเศส ยังทรงพระเยาว์ ขณะพระชนมายุได้ 23 พระชันษา ทรงนิยมล่าสัตว์ในป่า และทรงเห็นว่าตำบลแวร์ซายน่าจะเหมาะแก่การประทับเพื่อล่าสัตว์ จึงโปรดเกล้าฯ ให้สร้างพระตำหนักขึ้นมาใน ค.ศ. 1623 โดยในช่วงแรกเป็นเพียงกระท่อมเล็ก ๆ สำหรับพักชั่วคราวเท่านั้น\nเมื่อพระเจ้าหลุยส์ที่ 14 แห่งฝรั่งเศส ขึ้นครองบัลลังก์ มีประสงค์ที่จะสร้างพระราชวังแห่งใหม่ เพื่อเป็นศูนย์กลางในการปกครองของพระองค์ จึงเริ่มปรับปรุงพระตำหนักเดิมในปี ค.ศ. 1661 ใช้เงินทั้งหมด 500,000,000 ฟรังก์ คนงาน 30,000 คน และใช้เวลาอยู่ถึง 30 ปีจึงแล้วเสร็จใน ค.ศ. 1688 ทุกส่วนทำด้วยหินอ่อนสีขาว เป็นแบบอย่างศิลปกรรมที่งดงาม ภายในแบ่งออกเป็นห้อง ๆ เช่น ห้องบรรทม ห้องเสวย ห้องสำราญ ฯลฯ ทุกห้องล้วนมีเครื่องประดับงดงามตระการตาและภาพเขียนที่มีชื่อเสียง \nการก่อสร้างพระราชวังแวร์ซายแห่งนี้ได้นำเงินมาจากค่าภาษีอากรของราษฎรชาวฝรั่งเศส ต่อมาในช่วงการปฏิวัติฝรั่งเศสได้มีกองทัพประชาชนและผู้ประท้วงบุกเข้าพระราชวังเพื่อตามหาพระเจ้าหลุยส์ที่ 16 แห่งฝรั่งเศส กับพระนางมารี อองตัวเนต …","other":"Palace of Versailles"},"en":{"title":"Palace of Versailles","url":"https://en.wikipedia.org/wiki/Palace_of_Versailles","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/95/Vue_a%C3%A9rienne_du_domaine_de_Versailles_par_ToucanWings_-_Creative_Commons_By_Sa_3.0_-_081_%28cropped%29.jpg/960px-Vue_a%C3%A9rienne_du_domaine_de_Versailles_par_ToucanWings_-_Creative_Commons_By_Sa_3.0_-_081_%28cropped%29.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Palace of Versailles (French: Château de Versailles) is a château and historic monument in Versailles in the Yvelines department of France, southwest of Paris. It served as the principal residence of the French kings Louis XIV, Louis XV, and Louis XVI.\nThe king, the court, and the royal government lived there permanently from 6 May 1682 until 6 October 1789, except during the Regency years (1715–1723). Conceived by Louis XIV to glorify the French monarchy, the palace became the most important architectural project of his reign and is considered one of the masterpieces of French classical architecture.","history":"The site of Versailles is first mentioned in 1038 in a charter of the Abbey of Saint‑Père de Chartres. During the Middle Ages, the area consisted of small villages, farmland, and woodland. In the 16th century, the lands that would become Versailles were owned by the Gondi family, who were influential at the French court. Louis XIII acquired part of the land in 1623 and purchased the remainder in 1632.\nBefore the later palace existed, Louis XIII built a modest brick‑and‑stone hunting lodge in 1623. The building consisted of a central block flanked by two wings and measured about 35 metres in length. Surrounded by marshland, it was sometimes mocked by contemporaries as the “chétif château” (“puny château”) or the “château de cartes” (“house of cards”) because of its red brick, white stone, and slate colours. The lodge included a small gallery, several rooms hung with tapestries, and a central salon that later became the location of Louis XIV’s bedchamber. In 1630, the château was the site of the political event known as the Day of the Dupes, during which Cardinal Richelieu regained …","other":"พระราชวังแวร์ซาย"}},{"th":{"title":"พระราชวังช็องบอร์","url":"https://th.wikipedia.org/wiki/%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%A3%E0%B8%B2%E0%B8%8A%E0%B8%A7%E0%B8%B1%E0%B8%87%E0%B8%8A%E0%B9%87%E0%B8%AD%E0%B8%87%E0%B8%9A%E0%B8%AD%E0%B8%A3%E0%B9%8C","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/80/Chambord_pano.jpg/960px-Chambord_pano.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"พระราชวังช็องบอร์ (ฝรั่งเศส: Château de Chambord) เป็นวังที่ตั้งอยู่ที่บนฝั่งแม่น้ำลัวร์ในช็องบอร์ในจังหวัดลัวเรแชร์ ประเทศฝรั่งเศส พระราชวังช็องบอร์เป็นวังที่เป็นที่รู้จักกันดีที่สุดวังหนึ่งในโลกจากลักษณะสถาปัตยกรรมฟื้นฟูศิลปวิทยาที่เป็นเอกลักษณ์ของสิ่งก่อสร้างที่มีลักษณะผสานระหว่างการก่อสร้างแบบยุคกลางของฝรั่งเศสกับสถาปัตยกรรมคลาสสิกของอิตาลี\nพระราชวังช็องบอร์สร้างโดยพระเจ้าฟร็องซัวที่ 1 แห่งฝรั่งเศสสำหรับเป็นที่ประทับที่ตั้งอยู่ไม่ไกลจากโกลด โรอ็อง พระสนมเคาน์เทสส์แห่งตูรี ภรรยาของฌูว์เลียง เคานต์แห่งแกลร์มง ซึ่งเป็นตระกูลสำคัญตระกูลหนึ่งของฝรั่งเศส ที่พำนักอยู่ที่วังมุยด์ที่ตั้งอยู่ไม่ไกลนัก ตราอาร์มของโคลดใช้ตกแต่งพระราชวัง\nช็องบอร์เป็นพระราชวังที่ใหญ่ที่สุดในบรรดาวังต่าง ๆ ในลุ่มแม่น้ำลัวร์ แต่เดิมเป็นเพียงตำหนักล่าสัตว์ของพระเจ้าฟร็องซัว ผู้ทรงมีที่ประทับอยู่ที่พระราชวังบลัวและพระราชวังอ็องบวซ กล่าวกันว่าช็องบอร์เดิมออกแบบโดยโดเมนีโก ดา กอร์โตนา ผู้ที่มีจำลองไม้ที่มีอายุยืนพอที่จะให้อ็องเดร เฟลีเบียงวาดในคริสต์ศตวรรษที่ 16 แต่นักเขียนบางท่านกล่าวว่าผู้มีส่วนสำคัญในการออกแบบคือสถาปนิกยุคฟื้นฟูศิลปวิทยาชาวฝรั่งเศสฟีลีแบร์ เดอลอร์ม ในระยะยี่สิบปีของการก่อสร้างระหว่างปี ค.ศ. 1519 และ ค.ศ. 1547 โครงสร้างช็องบอร์ก็เปลี่ยนไปจากที่ออกแบบไว้เป็นอันมาก โดยมี Pierre Nepveu เป็นผู้ควบคุมดูแลการก่อสร้าง ในปี ค.ศ.","history":"พระราชวังช็องบอร์ (ฝรั่งเศส: Château de Chambord) เป็นวังที่ตั้งอยู่ที่บนฝั่งแม่น้ำลัวร์ในช็องบอร์ในจังหวัดลัวเรแชร์ ประเทศฝรั่งเศส พระราชวังช็องบอร์เป็นวังที่เป็นที่รู้จักกันดีที่สุดวังหนึ่งในโลกจากลักษณะสถาปัตยกรรมฟื้นฟูศิลปวิทยาที่เป็นเอกลักษณ์ของสิ่งก่อสร้างที่มีลักษณะผสานระหว่างการก่อสร้างแบบยุคกลางของฝรั่งเศสกับสถาปัตยกรรมคลาสสิกของอิตาลี\nพระราชวังช็องบอร์สร้างโดยพระเจ้าฟร็องซัวที่ 1 แห่งฝรั่งเศสสำหรับเป็นที่ประทับที่ตั้งอยู่ไม่ไกลจากโกลด โรอ็อง พระสนมเคาน์เทสส์แห่งตูรี ภรรยาของฌูว์เลียง เคานต์แห่งแกลร์มง ซึ่งเป็นตระกูลสำคัญตระกูลหนึ่งของฝรั่งเศส ที่พำนักอยู่ที่วังมุยด์ที่ตั้งอยู่ไม่ไกลนัก ตราอาร์มของโคลดใช้ตกแต่งพระราชวัง\nช็องบอร์เป็นพระราชวังที่ใหญ่ที่สุดในบรรดาวังต่าง ๆ ในลุ่มแม่น้ำลัวร์ แต่เดิมเป็นเพียงตำหนักล่าสัตว์ของพระเจ้าฟร็องซัว ผู้ทรงมีที่ประทับอยู่ที่พระราชวังบลัวและพระราชวังอ็องบวซ กล่าวกันว่าช็องบอร์เดิมออกแบบโดยโดเมนีโก ดา กอร์โตนา ผู้ที่มีจำลองไม้ที่มีอายุยืนพอที่จะให้อ็องเดร เฟลีเบียงวาดในคริสต์ศตวรรษที่ 16 แต่นักเขียนบางท่านกล่าวว่าผู้มีส่วนสำคัญในการออกแบบคือสถาปนิกยุคฟื้นฟูศิลปวิทยาชาวฝรั่งเศสฟีลีแบร์ เดอลอร์ม ในระยะยี่สิบปีของการก่อสร้างระหว่างปี ค.ศ. 1519 …","other":"Château de Chambord"},"en":{"title":"Château de Chambord","url":"https://en.wikipedia.org/wiki/Ch%C3%A2teau_de_Chambord","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1f/Aerial_image_of_Ch%C3%A2teau_de_Chambord_%28view_from_the_southeast%29.jpg/960px-Aerial_image_of_Ch%C3%A2teau_de_Chambord_%28view_from_the_southeast%29.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Château de Chambord (French pronunciation: [ʃɑto d(ə) ʃɑ̃bɔʁ]) in Chambord, Centre-Val de Loire, France, is one of the most recognisable châteaux in the world because of its very distinctive French Renaissance architecture, which blends traditional French medieval forms with classical Renaissance structures. The building was commissioned by Francis I of France and built between 1519 and 1547.\nChambord is the largest château in the Loire Valley; it was built to serve as a hunting lodge for Francis I, who maintained his royal residences at the Château de Blois and Amboise.","history":"Who designed the Château de Chambord is a matter of controversy. The original design is attributed, though with several doubts, to Domenico da Cortona, whose wooden model for the design survived long enough to be drawn by André Félibien in the 17th century. In the drawings of the model, the main staircase of the keep is shown with two straight, parallel flights of steps separated by a passage and is located in one of the arms of the cross. According to Jean-Guillaume, this Italian design was later replaced with the centrally located spiral staircase, which is similar to that at Blois, and a design more compatible with the French preference for spectacular grand staircases. However, \"at the same time the result was also a triumph of the centralised layout—itself a wholly Italian element.\" In 1913 Marcel Reymond suggested that Leonardo da Vinci, a guest of Francis at Clos Lucé near Amboise, was responsible for the original design, which reflects Leonardo\u0027s plans for a château at Romorantin for the king\u0027s mother, and his interests in central planning and double-spiral staircases; the …","other":"พระราชวังช็องบอร์"}},{"th":null,"en":{"title":"Clos Lucé","url":"https://en.wikipedia.org/wiki/Clos_Luc%C3%A9","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/98/Clos_luce_04.jpg/960px-Clos_luce_04.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Château du Clos Lucé (French pronunciation: [ʃato dy klo lyse]; or simply Clos Lucé), formerly called Manoir du Cloux, is a château located in the center of Amboise, in the department of Indre-et-Loire, in the Centre-Val de Loire region of France. It is located in the Val de Loire (formerly called Touraine) region. Built by Hugues d\u0027Amboise in 1471, the palace has known several famous owners such as the French king Charles VIII and Leonardo da Vinci.","history":"The house was built by Hugues d\u0027Amboise on a Gallo-Roman foundation. It was organized around an octagonal tower, within which a spiral staircase stood. Around the spiral staircase were two buildings that had two floors each. The elegant facade made with pink bricks and whites stones was typical of the 15th century. Formally called Château de Cloux, the building was the property of the Chateau D’Amboise, and the lands of Lucé were annexed to the castle from the 14th century. At the time, the manor was surrounded by fortifications; only one still remains, the watchtower.\nFor a short time the building housed religious people of the abbaye of Moncé, they resided in the building until 1471. The Clos Lucé was then sold on 26 May to Etienne le Loup, who was Louis XI\u0027s Counselor and Amboise beadle. The building was in ruin when Etienne acquired the lands, he restored it giving it the famous visual aspect that we see today - a square tower with Gothic windows that created a towering and well protected medieval fortress.\nOn the 2 July 1490, Charles VIII bought the castle from Etienne Le Loup …","other":null}},{"th":null,"en":{"title":"Cité de Carcassonne","url":"https://en.wikipedia.org/wiki/Cit%C3%A9_de_Carcassonne","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/25/1_carcassonne_aerial_2016.jpg/960px-1_carcassonne_aerial_2016.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Cité de Carcassonne (Occitan: Ciutat de Carcassona [siwˈtat de kaɾkaˈsunɔ]) is a medieval citadel located in the French city of Carcassonne, in the Aude department, Occitania region. It is situated on a hill on the right bank of the river Aude, in the south-eastern part of the city proper.\nThe citadel was restored at the end of the 19th century by the theorist and architect Eugène Viollet-le-Duc.","history":"Founded during the Gallo-Roman period, the citadel derives its reputation from its 3 kilometres (1.9 mi) long double surrounding walls interspersed by 52 towers. The town has about 2,500 years of history and has been occupied in different ages by Romans, Visigoths, and Crusaders. At the beginning of its history it was a Gaulish settlement; in the 3rd century CE, the Romans decided to transform it into a fortified town. The Roman defences were in place by 333 CE, when the town is described as a castellum. The original walls were supported by between 34 and 40 towers, spaced from 18 to 30 metres apart along the curtain wall. Each tower was semicircular in plan and about 14 metres tall. There were probably 40 main entrances to the town. The Gallo-Roman walls were rebuilt during the town\u0027s occupation by the Visigoths in the 5th and 6th centuries, but the original structure remained in place.\nBernard Aton IV Trencavel, vicomte of Albi, Nîmes, and Béziers, introduced a period of prosperity for the city with numerous construction projects. During this period, a new sect known as Catharism …","other":null}},{"th":{"title":"อาสนวิหารโคโลญ","url":"https://th.wikipedia.org/wiki/%E0%B8%AD%E0%B8%B2%E0%B8%AA%E0%B8%99%E0%B8%A7%E0%B8%B4%E0%B8%AB%E0%B8%B2%E0%B8%A3%E0%B9%82%E0%B8%84%E0%B9%82%E0%B8%A5%E0%B8%8D","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0d/K%C3%B6lner_Dom_von_Osten.jpg/960px-K%C3%B6lner_Dom_von_Osten.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"อาสนวิหารโคโลญ (อังกฤษ: Cologne Cathedral; เยอรมัน: Kölner Dom) เป็นโบสถ์โรมันคาทอลิกระดับอาสนวิหารในเมืองโคโลญ เป็นวิหารประจำมุขนายกแห่งโคโลญ สถานที่นี่มีชื่อเสียงในฐานะเป็นที่ศาสนสถาน นิกายโรมันคาทอลิก สถานที่แห่งสร้างขึ้นมาเพื่อเป็นสถานที่ประพิธีกรรมของสามมหากษัตริย์แห่งจักรพรรดิโรมันอันศักดิ์สิทธิ์และเป็นสถานที่เก็บหีบสามกษัตริย์ไว้ ณ ที่แห่งนี้ด้วย  ปัจจุบันเป็นสถานที่ท่องเที่ยวที่สำคัญของเมืองแห่งนี้ มีผู้เยี่ยมชมราวๆ  20,000 คนต่อวัน","history":"อาสนวิหารโคโลญ (อังกฤษ: Cologne Cathedral; เยอรมัน: Kölner Dom) เป็นโบสถ์โรมันคาทอลิกระดับอาสนวิหารในเมืองโคโลญ เป็นวิหารประจำมุขนายกแห่งโคโลญ สถานที่นี่มีชื่อเสียงในฐานะเป็นที่ศาสนสถาน นิกายโรมันคาทอลิก สถานที่แห่งสร้างขึ้นมาเพื่อเป็นสถานที่ประพิธีกรรมของสามมหากษัตริย์แห่งจักรพรรดิโรมันอันศักดิ์สิทธิ์และเป็นสถานที่เก็บหีบสามกษัตริย์ไว้ ณ ที่แห่งนี้ด้วย  ปัจจุบันเป็นสถานที่ท่องเที่ยวที่สำคัญของเมืองแห่งนี้ มีผู้เยี่ยมชมราวๆ  20,000 คนต่อวัน \nอาสนวิหารโคโลญได้ก่อสร้างมาตั้งแต่ปี 1248 แต่มีปัญหาให้ต้องหยุดพักการก่อสร้างไปบ้าง จึงต้องใช้เวลากว่าหกร้อยปีจึงสร้างเสร็จสมบูรณ์ และ สร้างเสร็จในปี 1880 พร้อมกับมีพีธีวางหลักหินบันทึกข้อมูลการก่อสร้าง อาสนวิหารโคโลญเป็นศาสนสถานของคริสต์ศาสนาโรมันคาทอลิก นับเป็นวิหารที่ใหญ่และเป็นอาคารที่สูงที่สุดในโลกในเป็นเวลา 4 ปี ( ปี ค.ศ 1880-1884) ต่อมาในช่วงสงครามโลกครั้งที่สอง เมืองโคโลญ ถูกทิ้งระเบิดทางอากาศทั้งหมด 14 ลูก แม้วิหารจะได้รับความเสียหายบางส่วน แต่ก็ไม่พังทลายลงมา ซึ่งเชื่อว่าเป็นปาฏิหาริย์ บ้างก็เชื่อว่า เพราะวิหารเป็นจุดสังเกตที่สำคัญของนักบิน จึงไม่ต้องการจะระเบิดทำลายทิ้งไปเสียทีเดียว จากความเสียหายดังกล่าว …","other":"Cologne Cathedral"},"en":{"title":"Cologne Cathedral","url":"https://en.wikipedia.org/wiki/Cologne_Cathedral","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/04/K%C3%B6lner_Dom_-_Westfassade_2022_ohne_Ger%C3%BCst-0968_b.jpg/960px-K%C3%B6lner_Dom_-_Westfassade_2022_ohne_Ger%C3%BCst-0968_b.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Cologne Cathedral (German: Kölner Dom, pronounced [ˌkœlnɐ ˈdoːm] ) is a Catholic cathedral in Cologne, North Rhine-Westphalia, Germany. It is the seat of the Archbishop of Cologne and of the administration of the Archdiocese of Cologne. It is a renowned monument of German Catholicism and Gothic architecture and was declared a World Heritage Site in 1996.","history":"Cologne Cathedral (German: Kölner Dom, pronounced [ˌkœlnɐ ˈdoːm] ) is a Catholic cathedral in Cologne, North Rhine-Westphalia, Germany. It is the seat of the Archbishop of Cologne and of the administration of the Archdiocese of Cologne. It is a renowned monument of German Catholicism and Gothic architecture and was declared a World Heritage Site in 1996. It is Germany\u0027s most visited landmark, attracting an average of 6 million people a year. At 157 m (515 ft), the cathedral is the tallest twin-spired church in the world, the third tallest church in Europe after Sagrada Família and Ulm Minster, and the tallest cathedral in the world.\nConstruction of Cologne Cathedral began in 1248, but was halted in the years around 1560. Attempts to complete construction began around 1814, but the project was not properly funded until the 1840s. The edifice was completed to its original medieval plan in 1880. The towers for its two huge spires give the cathedral the largest façade of any church in the world.\nCologne\u0027s medieval builders had planned a grand structure to house the reliquary of the …","other":"อาสนวิหารโคโลญ"}},{"th":{"title":"ปราสาทน็อยชวานชไตน์","url":"https://th.wikipedia.org/wiki/%E0%B8%9B%E0%B8%A3%E0%B8%B2%E0%B8%AA%E0%B8%B2%E0%B8%97%E0%B8%99%E0%B9%87%E0%B8%AD%E0%B8%A2%E0%B8%8A%E0%B8%A7%E0%B8%B2%E0%B8%99%E0%B8%8A%E0%B9%84%E0%B8%95%E0%B8%99%E0%B9%8C","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f8/Schloss_Neuschwanstein_2013.jpg/960px-Schloss_Neuschwanstein_2013.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"ปราสาทน็อยชวานชไตน์ (เยอรมัน: Schloss Neuschwanstein, ออกเสียง: [ˈʃlɔs nɔʏˈʃvaːnʃtaɪn]; บาวาเรียใต้: Schloss Neischwanstoa) เป็นปราสาทย้อนยุค สร้างขึ้นศตวรรษที่ 19 ตั้งบนเนินเขาในแถบเชิงเขาของเทือกเขาแอลป์ ตั้งอยู่ทางใต้ของประเทศเยอรมนี ใกล้กับพรมแดนประเทศออสเตรีย ในภูมิภาคชวาเบินของไบเอิร์น ภายในเขตเทศบาลชวานเกา เหนือหมู่บ้านโฮเฮินชวานเกาซึ่งเป็นที่ตั้งของอีกปราสาท ซึ่งคือปราสาทโฮเฮินชวานเกา เมืองใหญ่ที่อยู่ใกล้สุดคือฟึสเซิน","history":"ปราสาทน็อยชวานชไตน์ (เยอรมัน: Schloss Neuschwanstein, ออกเสียง: [ˈʃlɔs nɔʏˈʃvaːnʃtaɪn]; บาวาเรียใต้: Schloss Neischwanstoa) เป็นปราสาทย้อนยุค สร้างขึ้นศตวรรษที่ 19 ตั้งบนเนินเขาในแถบเชิงเขาของเทือกเขาแอลป์ ตั้งอยู่ทางใต้ของประเทศเยอรมนี ใกล้กับพรมแดนประเทศออสเตรีย ในภูมิภาคชวาเบินของไบเอิร์น ภายในเขตเทศบาลชวานเกา เหนือหมู่บ้านโฮเฮินชวานเกาซึ่งเป็นที่ตั้งของอีกปราสาท ซึ่งคือปราสาทโฮเฮินชวานเกา เมืองใหญ่ที่อยู่ใกล้สุดคือฟึสเซิน\nแม้ว่าในเวลานั้นกษัตริย์แห่งไบเอิร์นจะประทับอยู่ที่มึนเชินเรซีเดินซ์ซึ่งเป็นหนึ่งในพระราชวังที่โอ่อ่ามากที่สุด แต่กษัตริย์ลูทวิชที่สองมีประสงค์ที่จะหลบหนีข้อจำกัดต่าง ๆ ที่มีในนครมึนเชิน จึงดำริให้สร้างปราสาทขึ้นในพื้นที่ห่างไกลบนชายขอบของเทือกเขาแอลป์เป็นที่พำนัก\nลูทวิชจ่ายค่าก่อสร้างปราสาทนี้โดยใช้ราชทรัพย์ส่วนพระองค์ ถึงขั้นที่ยอมยืมเงินผู้อื่น แทนที่จะใช้เงินจากคงคลังของรัฐ การก่อสร้างเริ่มต้นในปี 1869 แต่ไม่เคยแล้วเสร็จสมบูรณ์ ปราสาทนี้ตั้งใจจะสร้างขึ้นเป็นที่พำนักส่วนตัว แต่กระนั้นกษัตริย์ลูทวิชสิ้นพระชนม์ไปก่อนในปี 1886 ไม่นานหลังจากนั้น ปราสาทได้เปิดสู่สาธารณชน นับตั้งแต่นั้น มียอดผู้เข้าชมปราสาทรวมมากกว่า 61 ล้านคน ณ ปี 2009 และมากกว่า 1.3 ล้านคนต่อปี …","other":"Neuschwanstein Castle"},"en":{"title":"Neuschwanstein Castle","url":"https://en.wikipedia.org/wiki/Neuschwanstein_Castle","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f8/Schloss_Neuschwanstein_2013.jpg/960px-Schloss_Neuschwanstein_2013.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Neuschwanstein Castle (German: Schloss Neuschwanstein, pronounced [ˈʃlɔs nɔʏˈʃvaːnʃtaɪn]; Southern Bavarian: Schloss Neischwanstoa; lit. \u0027Newswanstone\u0027) is a 19th-century historicist palace on a rugged hill of the foothills of the Alps in the very south of Germany, near the border with Austria. It is located in the Swabia region of Bavaria, in the municipality of Schwangau, above the incorporated village of Hohenschwangau, which is also the location of Hohenschwangau Castle. The closest larger town is Füssen.","history":"Neuschwanstein embodies both the contemporaneous architectural fashion known as castle Romanticism (German: Burgenromantik) and King Ludwig II\u0027s enthusiasm for the operas of Richard Wagner. In the 19th century, many castles were constructed or reconstructed, often with significant changes, to make them more picturesque. Palace-building projects similar to Neuschwanstein had been undertaken earlier in several of the German states. They included Hohenschwangau Castle, Lichtenstein Castle, Hohenzollern Castle, and numerous buildings on the Rhine, such as Stolzenfels Castle. Marienburg Castle, begun in 1858 for the King of Hanover, was completed in 1867. The more detailed inspiration for the construction of Neuschwanstein came from two journeys that Ludwig took in 1867: one in May to the reconstructed Wartburg near Eisenach, site of the mythical Sängerkrieg and thus setting of Wagner\u0027s opera Tannhäuser and the Singers\u0027 Contest at Wartburg, and another in July to the Château de Pierrefonds, which Eugène Viollet-le-Duc was transforming from a ruined castle into a historicist palace for …","other":"ปราสาทน็อยชวานชไตน์"}},{"th":null,"en":{"title":"Sedlec Ossuary","url":"https://en.wikipedia.org/wiki/Sedlec_Ossuary","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ab/Kostnice_Sedlec.JPG/960px-Kostnice_Sedlec.JPG?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Sedlec Ossuary (Czech: Kostnice v Sedlci; German: Sedletz-Beinhaus) is a Roman Catholic chapel, located beneath the Cemetery Church of All Saints (Czech: Hřbitovní kostel Všech Svatých), part of the former Sedlec Abbey in Sedlec, a suburb of Kutná Hora in the Czech Republic. The ossuary is estimated to contain the skeletons of between 40,000 and 70,000 people, whose bones have, in many cases, been artistically arranged to form decorations and furnishings for the chapel. The ossuary is among the most visited tourist attractions of the Czech Republic, drawing over 200,000 visitors annually.","history":"In 1278, Henry, the abbot of the Cistercian monastery in Sedlec, was sent to the Holy Land by King Ottokar II of Bohemia. He returned with a small amount of earth he had removed from Golgotha and sprinkled it over the abbey cemetery. The word of this pious act soon spread and the cemetery in Sedlec became a desirable burial site throughout Central Europe.\nIn the mid 14th century, during the Black Death and after the Hussite Wars in the early 15th century, many thousands were buried in the abbey cemetery, so it had to be greatly enlarged.\nAround 1400, a Gothic church was built in the center of the cemetery with a vaulted upper level and a lower chapel to be used as an ossuary for the mass graves unearthed during construction, or simply slated for demolition to make room for new burials.\nAfter 1511, the task of exhuming skeletons and stacking their bones in the chapel was given to a half-blind monk of the order according to a legend.\nBetween 1703 and 1710, a new entrance was constructed to support the front wall, which was leaning outward, and the upper chapel was rebuilt. This work, …","other":null}},{"th":{"title":"ปราสาทบรัน","url":"https://th.wikipedia.org/wiki/%E0%B8%9B%E0%B8%A3%E0%B8%B2%E0%B8%AA%E0%B8%B2%E0%B8%97%E0%B8%9A%E0%B8%A3%E0%B8%B1%E0%B8%99","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/17/Castelul_Bran2.jpg/960px-Castelul_Bran2.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"ปราสาทบรัน (โรมาเนีย: Castelul Bran; เยอรมัน: Schloss Bran หรือ Törzburg; ฮังการี: Törcsvári kastély) เป็นปราสาทและป้อมปราการในบรัน ราว 25 กิโลเมตร (16 ไมล์) ทางใต้ของบราชอฟ ประเทศโรมาเนีย ปราสาทถือเป็นอนุสรณ์แห่งชาติและเป็นจุดหมายตาสำคัญของภูมิภาคทรานซิลเวเนีย","history":"ในปี 1212 Teutonic Order ได้สร้างปราสาทไม้ในชื่อ Dietrichstein เป็นป้อมปราการตั้งรับให้กับภูมิภาค Burzenland ตรงจุดที่เป็นช่องเขาที่มีพ่อค้าเดินทางผ่านเป็นเวลานับสหัสวรรษ ปราสาทนี้ถูกทำลายโดยชาวมองโกลในปี 1242\nชื่อเดิมของปราสาทว่า Dietrichstein หรือ lapis Theoderici ในภาษาละติน ซึ่งแปลว่า \"หินของ Dietrich\" น่าจะมาจากคำว่า Comthur (ผู้การ) และผู้ตั้งกฎของท้องถิ่น frater Theodericus ดังที่ปรากฏในเอกสารจากปี 1212 เข้าใจว่า Dietrich น่าจะเป็นผู้สร้างปราสาทนี้ขึ้นมา เอกสารจากปี 1509 ยืนยันว่ามณฑล Törzburg เคยเป็นของผู้การ Dietrich แห่ง Teutonic Order มาก่อน\nปราสาทหินหลังใหม่สร้างขึ้นเพื่อเป็นป้อมปราการโดยเฉพาะ เพื่อป้องกันบรรดาเจ้าอาณานิคมขาวเยอรมันในทรานซิลเวเนีย เชื่อกันว่าปราสาทเคยถูกยึดครองชั่วคราวโดย Mircea the Elder แห่งวาลาเกีย (ครองราชย์ 1386–95, 1397–1418) ซึ่งในสมัยนี้เองที่มีการตั้งจุดศุลกากรขึ้น ส่วน Vlad Țepeș (วลาด นักเสียบ; 1448–1476) ไม่ได้มีบทบาทสำคัญมากนักในประวัติศาสตร์ของป้อมปราการนี้ มีเคยใช้เป็นทางผ่านหลายครั้งผ่านทางลำธารหุบเขาบรัน มีอยู่ช่วงหนึ่งที่ปราสาทบรันกลายเป็นของกษัตริย์แห่งฮังการี หลังกษัตริย์ Vladislas II (ครองราชย์ 1471–1516) ไม่สามารถจ่ายคืนค่าเช่าได้ …","other":"Bran Castle"},"en":{"title":"Bran Castle","url":"https://en.wikipedia.org/wiki/Bran_Castle","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/17/Castelul_Bran2.jpg/960px-Castelul_Bran2.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Bran Castle (Romanian: Castelul Bran; German: Schloss Bran or Die Törzburg; ) is a castle in Bran, 25 kilometres (16 mi) southwest of Brașov. The castle was built by Saxons in 1377 who were given the privilege by Louis I of Hungary. It is a national monument and landmark in Transylvania.","history":"Based on the controversial information in the \"Székely Chronicle of Csik\" (Hungarian: Csíki székely krónika), whose veracity is questionable, it can be concluded that the original fortification was built in the 11th century by the Székelys, who were settled here by King Ladislaus I of Hungary, under the leadership of Stephen Sándor (Hungarian: Sándor István), to protect this strategically important territory from attacks by the Cumans and Pechenegs. It was likely subsequently destroyed during their next raid, as the territory was ceded to the Teutonic Order in the 13th century, and construction of a new fortification began.\nIn 1211, the Teutonic Order received this land as a gift from Andrew II to ensure the protection of Hungary from the Cumans. In 1212, the Teutonic Order built the wooden castle of Dietrichstein as a fortified position in the Burzenland at the entrance to a mountain pass through which traders had travelled for more than a millennium. This castle was destroyed by royal troops during the expulsion of the Teutonic Order from the territory of the Kingdom of Hungary, …","other":"ปราสาทบรัน"}},{"th":{"title":"โคลอสเซียม","url":"https://th.wikipedia.org/wiki/%E0%B9%82%E0%B8%84%E0%B8%A5%E0%B8%AD%E0%B8%AA%E0%B9%80%E0%B8%8B%E0%B8%B5%E0%B8%A2%E0%B8%A1","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/de/Colosseo_2020.jpg/960px-Colosseo_2020.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"โคลอสเซียม (อังกฤษ: Colosseum), โคลิเซียม (อังกฤษ: Coliseum) หรือ ทวิอัฒจันทร์ฟลาเวียน (อังกฤษ: Flavian Amphitheatre; ละติน: Amphitheatrum Flavium; อิตาลี: Anfiteatro Flavio หรือ Colosseo) เป็นสนามกีฬากลางแจ้งขนาดใหญ่ตั้งอยู่ใจกลางกรุงโรม เริ่มสร้างขึ้นในสมัยจักรพรรดิแว็สปาซิอานุสแห่งจักรวรรดิโรมัน และสร้างเสร็จในสมัยของจักรพรรดิติตุสในคริสต์ศตวรรษที่ 1 อัฒจันทร์เป็นรูปวงกลมก่อด้วยอิฐและหินทรายวัดโดยรอบได้ประมาณ 527 เมตร สูง 57 เมตร สามารถจุผู้ชมได้ประมาณ 50,000 คน มีการออกแบบอย่างชาญฉลาดโดยสร้างให้สนามกีฬามีลักษณะเป็นรูปวงรี เพื่อให้ผู้ชมรู้สึกเข้าใกล้นักกีฬา และมีการออกแบบทางระบายน้ำเพื่อไม่ให้น้ำท่วมขังในสนามขณะเกิดฝนตก ถือเป็นต้นแบบของสนามกีฬาต่าง ๆ ในปัจจุบัน ใช้เวลาก่อสร้างประมาณ 10 ปี\n7 กรกฎาคม พ.ศ.","history":"โคลอสเซียม (อังกฤษ: Colosseum), โคลิเซียม (อังกฤษ: Coliseum) หรือ ทวิอัฒจันทร์ฟลาเวียน (อังกฤษ: Flavian Amphitheatre; ละติน: Amphitheatrum Flavium; อิตาลี: Anfiteatro Flavio หรือ Colosseo) เป็นสนามกีฬากลางแจ้งขนาดใหญ่ตั้งอยู่ใจกลางกรุงโรม เริ่มสร้างขึ้นในสมัยจักรพรรดิแว็สปาซิอานุสแห่งจักรวรรดิโรมัน และสร้างเสร็จในสมัยของจักรพรรดิติตุสในคริสต์ศตวรรษที่ 1 อัฒจันทร์เป็นรูปวงกลมก่อด้วยอิฐและหินทรายวัดโดยรอบได้ประมาณ 527 เมตร สูง 57 เมตร สามารถจุผู้ชมได้ประมาณ 50,000 คน มีการออกแบบอย่างชาญฉลาดโดยสร้างให้สนามกีฬามีลักษณะเป็นรูปวงรี เพื่อให้ผู้ชมรู้สึกเข้าใกล้นักกีฬา และมีการออกแบบทางระบายน้ำเพื่อไม่ให้น้ำท่วมขังในสนามขณะเกิดฝนตก ถือเป็นต้นแบบของสนามกีฬาต่าง ๆ ในปัจจุบัน ใช้เวลาก่อสร้างประมาณ 10 ปี\n7 กรกฎาคม พ.ศ. 2550 โคลอสเซียมได้รับเลือกให้เป็น 1 ในเจ็ดสิ่งมหัศจรรย์ของโลกยุคใหม่ จากการลงคะแนนทั่วโลกทั้งทางอินเทอร์เน็ตและโทรศัพท์มือถือ","other":"Colosseum"},"en":{"title":"Colosseum","url":"https://en.wikipedia.org/wiki/Colosseum","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/de/Colosseo_2020.jpg/960px-Colosseo_2020.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Colosseum ( KOL-ə-SEE-əm; Italian: Colosseo [kolosˈsɛːo]) is an elliptical amphitheatre in the centre of the city of Rome, Italy, just east of the Roman Forum. It is the largest ancient amphitheatre ever built, and is the largest standing amphitheatre in the world.  Construction began under the Emperor Vespasian (r. 69–79 AD) in 72 and was completed in AD 80 under his successor and heir, Titus (r. 79–81).","history":"The site chosen was a flat area on the floor of a low valley between the Caelian, Esquiline and Palatine Hills, through which a canalised stream ran as well as an artificial lake/marsh. By the 2nd century BC the area was densely inhabited. It was devastated by the Great Fire of Rome in 64 AD, following which Nero seized much of the area to add to his personal domain. He built the grandiose Domus Aurea on the site, in front of which he created an artificial lake surrounded by pavilions, gardens and porticoes. The existing Aqua Claudia aqueduct was extended to supply water to the area and the gigantic bronze Colossus of Nero was set up nearby at the entrance to the Domus Aurea.\nAlthough the Colossus was preserved, much of the Domus Aurea was torn down. The lake was filled in and the land reused as the location for the new Flavian Amphitheatre. Gladiatorial schools and other support buildings were constructed nearby within the former grounds of the Domus Aurea. Vespasian\u0027s decision to build the Colosseum on the site of Nero\u0027s lake can be seen as a populist gesture of returning to the …","other":"โคลอสเซียม"}},{"th":{"title":"หอเอนปิซา","url":"https://th.wikipedia.org/wiki/%E0%B8%AB%E0%B8%AD%E0%B9%80%E0%B8%AD%E0%B8%99%E0%B8%9B%E0%B8%B4%E0%B8%8B%E0%B8%B2","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/66/The_Leaning_Tower_of_Pisa_SB.jpeg/960px-The_Leaning_Tower_of_Pisa_SB.jpeg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"หอเอนเมืองปิซา (อิตาลี: Torre pendente di Pisa หรือ La Torre di Pisa; อังกฤษ: Leaning Tower of Pisa) ตั้งอยู่ที่เมืองปิซา ประเทศอิตาลี ในจัตุรัสเปียซซา เดล ดูโอโม (Piazza Del Duomo) เป็นหอระฆังของศาสนาคริสต์นิกายโรมันคาทอลิก มีลักษณะเป็นหอทรงกระบอก 8 ชั้น สร้างด้วยหินอ่อนสีขาว สูง 183.3 ฟุต (55.86 เมตร) น้ำหนักรวมประมาณ 14,500 ตัน มีบันไดรวมทั้งสิ้น 293 ขั้น เอียง 3.97 องศา ยอดของหอห่างจากแนวตั้งฉาก 3.9 เมตร","history":"เริ่มสร้างเมื่อวันที่ 9 สิงหาคม ค.ศ. 1173 และสร้างเสร็จเมื่อปี ค.ศ. 1350 ใช้เวลาสร้างประมาณ 175 ปี แต่การก่อสร้างนั้นมีการหยุดชะงักถึง 2 ครั้ง ครั้งแรกหยุดสร้าง เมื่อสร้างไปได้ถึงชั้น 3 เนื่องจากพื้นใต้ดินเป็นพื้นดินที่นิ่ม ทำให้หอมีการยุบตัว โดยตอนแรกหอเอนปิซาได้เอนไปทางทิศเหนือ และต่อมาในปี ค.ศ. 1272 จีโอแวนนี่ ดี สิโมน สร้างให้เอนกลับไปอีกด้านหนึ่งเพื่อให้เกิดความสมดุล โดยการสร้างถ่วงไปทางทิศใต้ แต่การก่อสร้างในครั้งนี้ ก็ต้องหยุดชะงักลงอีกครั้งเนื่องจากเกิดสงคราม ภายหลังได้มีการสร้างหอต่อขึ้นอีก ทำให้หอมีความสูงทั้งหมด 7 ชั้น ในปี ค.ศ. 1319 แต่หอเอนนี้ถูกสร้างเสร็จในปี ค.ศ. 1372  หลังจากนั้น ในปี ค.ศ. 1990-2001 หอเอนปีซาได้รับการปรับปรุงฐานให้แข็งแรงยิ่งขึ้น เพื่อป้องกันไม่ให้หอล้มลงมา และปัจจุบัน ในทุก ๆ 20 ปี หอจะเอนลง 1 นิ้ว(ไปทางทิศใต้) โดยมีการคาดเดาว่า หอจะล้มลงมาในปี ค.ศ. 2220 ถ้าหากไม่มีการป้องกันใด ๆ ปัจจุบันได้มีการคิดค้นสปริงลูกตุ้มไปถ่วงอีกฝั่ง เพื่อชะลอการถ่วงลงมานั่นเอง","other":"Leaning Tower of Pisa"},"en":{"title":"Leaning Tower of Pisa","url":"https://en.wikipedia.org/wiki/Leaning_Tower_of_Pisa","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4b/Italy_-_Pisa_-_Leaning_Tower.jpg/960px-Italy_-_Pisa_-_Leaning_Tower.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Leaning Tower of Pisa (Italian: torre pendente di Pisa [ˈtorre penˈdɛnte di ˈpiːza, - ˈpiːsa]), or simply the Tower of Pisa (torre di Pisa), is the campanile, or freestanding bell tower, of Pisa Cathedral. It is known for its nearly four-degree lean, the result of an unstable foundation. The tower is one of three structures in Pisa\u0027s Cathedral Square (Piazza del Duomo), which includes the cathedral and Pisa Baptistry.","history":"Between 1589 and 1592, Galileo Galilei, who lived in Pisa at the time, is said to have dropped two cannonballs of different masses from the tower to demonstrate that their speed of descent was independent of their mass, in keeping with the scientific law of free fall. The primary source for this is the biography Racconto istorico della vita di Galileo Galilei (Historical Account of the Life of Galileo Galilei), written by Galileo\u0027s pupil and secretary Vincenzo Viviani in 1654, but published in 1717, long after his death.\nDuring World War II, the Allies suspected that the Germans were using the tower as an observation post. Leon Weckstein, a U.S. Army sergeant sent to confirm the presence of German troops in the tower, was impressed by the beauty of the cathedral and its campanile, and thus refrained from ordering an artillery strike, sparing it from destruction.\nNumerous efforts have been made to restore the tower to a vertical orientation, or at least keep it from falling over. Most of these efforts failed; some worsened the tilt. On 27 February 1964, the government of Italy …","other":"หอเอนปิซา"}},{"th":{"title":"ปอมเปอี","url":"https://th.wikipedia.org/wiki/%E0%B8%9B%E0%B8%AD%E0%B8%A1%E0%B9%80%E0%B8%9B%E0%B8%AD%E0%B8%B5","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d4/Theathres_of_Pompeii.jpg/960px-Theathres_of_Pompeii.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"ปอมเปอี (อิตาลี: Pompeii; ละติน: [pɔmˈpei̯.iː]) เป็นอดีตนครในเขตเทศบาลปอมเปย์ใกล้กับนครนาโปลี ในแคว้นคัมปาเนีย ประเทศอิตาลี ปอมเปอี, เฮอร์คูลาเนอุม, สตาบีเอ และ วีญาโดยรอบ ถูกฝังอยู่ใต้เถ้าภูเขาไฟและหินพัมมิซลึกระหว่าง 4 ถึง 6 m (13 ถึง 20 ft) จากการปะทุของเขาวิซูเวียสในปี ค.ศ.","history":"ปอมเปอี (อิตาลี: Pompeii; ละติน: [pɔmˈpei̯.iː]) เป็นอดีตนครในเขตเทศบาลปอมเปย์ใกล้กับนครนาโปลี ในแคว้นคัมปาเนีย ประเทศอิตาลี ปอมเปอี, เฮอร์คูลาเนอุม, สตาบีเอ และ วีญาโดยรอบ ถูกฝังอยู่ใต้เถ้าภูเขาไฟและหินพัมมิซลึกระหว่าง 4 ถึง 6 m (13 ถึง 20 ft) จากการปะทุของเขาวิซูเวียสในปี ค.ศ. 79\nปอมเปอีซึ่งถูกฝังอยู่ใต้เถ้าภูเขาไฟมายาวนานจึงกลายเป็นตัวแทนของช่วงขณะหนึ่งที่แสดงถึงวิถีชีวิตชาวโรมันอันถูกแช่แข็งในกาลเวลาตั้งแต่ตอนที่ภูเขาไฟปะทุ รวมถีงเป็นตัวอย่างชั้นดีของการวางผังนครสมัยโรมันในสภาพที่สมบูรณ์ ปอมเปอีเป็นนครที่มีความมั่งคั่ง ด้วยประชากรจำนวน 10,000 ถึง 20,000 คน ณ ขณะที่ภูเขาไฟปะทุ ซากของนครปอมเปอีมีอาคารสาธารณะ, บ้านเรือนหรูหราที่ประดับอย่างวิจิตรตระการตา, เครื่องประดับบ้านเรือนและงานศิลปะ ซึ่งดึงดูดผู้คนมาตั้งแต่การขุดค้นในยุคแรก ๆ การขุดค้นในภายหลังต่อมาพบบ้านเรือนและธุรกิจหลายร้อยหลังที่มีรูปแบบสถาปัตยกรรมและสะท้อนถึงชนชั้นทางสังคมที่หลากหลาย ตลอดจนอาคารสาธารณะมากมาย ซากออร์แกนิกต่าง ๆ ซึ่งรวมทั้งวัตถุที่ทำจากไม้และศพของมนุษย์ถูกฝังและคงสภาพอยู่ในเถ้าภูเขาไฟก่อนจะย่อยสลายและเกิดเป็นแม่พิมพ์ที่นักโบราณคดีสามารถหล่อหรือถอดแบบมาแสดงจังหวะสุดท้ายของชีวิตของศพเหล่านี้ …","other":"Pompeii"},"en":{"title":"Pompeii","url":"https://en.wikipedia.org/wiki/Pompeii","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f5/Aerial_image_of_Pompeii_and_Mount_Vesuvius_%28view_from_the_southeast%29.jpg/960px-Aerial_image_of_Pompeii_and_Mount_Vesuvius_%28view_from_the_southeast%29.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Pompeii ( ; Latin: [pɔmˈpei̯.iː]) was a city in what is now the municipality of Pompei, near Naples, in the Campania region of Italy. Along with Herculaneum, Stabiae, and many surrounding villas, it was buried under 4 to 6 m (13 to 20 ft) of volcanic ash and pumice in the eruption of Mount Vesuvius in 79 AD.\nLargely preserved under the ash, Pompeii offers a snapshot of Roman life, frozen at the moment it was buried, as well as insight into ancient urban planning. It was a wealthy town of 10,000 to 20,000 residents at the time it was destroyed.","history":"Although best known for its Roman remains visible today, dating from AD 79, it was built upon a substantial city dating from much earlier times. Expansion of the city from an early nucleus (the old town) accelerated after 450 BC under the Greeks following the Battle of Cumae.\nThe first stable settlements on the site date to the 8th century BC when the Oscans, a population of central Italy, founded five villages in the area.\nWith the arrival of the Greeks in Campania from around 740 BC, Pompeii entered the orbit of the Hellenic people. The most important building of this period is the Doric Temple, built away from the centre in what would later become the Triangular Forum. At the same time the cult of Apollo was introduced. Greek and Phoenician sailors used the location as a safe port.\nIn the early 6th century BC, the settlement merged into a single community centred on the important crossroad between Cumae, Nola, and Stabiae and was surrounded by a tufa city wall (the pappamonte wall). The first wall (which was also used as a base for the later wall) unusually enclosed a much …","other":"ปอมเปอี"}},{"th":{"title":"อาลัมบรา","url":"https://th.wikipedia.org/wiki/%E0%B8%AD%E0%B8%B2%E0%B8%A5%E0%B8%B1%E0%B8%A1%E0%B8%9A%E0%B8%A3%E0%B8%B2","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/de/Dawn_Charles_V_Palace_Alhambra_Granada_Andalusia_Spain.jpg/960px-Dawn_Charles_V_Palace_Alhambra_Granada_Andalusia_Spain.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"อาลัมบรา (สเปน: Alhambra) คือพระราชวังและป้อมปราการตั้งอยู่ที่เมืองกรานาดาในแคว้นอันดาลูซิอา ทางภาคใต้ของประเทศสเปน สร้างขึ้นระหว่างปี ค.ศ.","history":"อาลัมบรา (สเปน: Alhambra) คือพระราชวังและป้อมปราการตั้งอยู่ที่เมืองกรานาดาในแคว้นอันดาลูซิอา ทางภาคใต้ของประเทศสเปน สร้างขึ้นระหว่างปี ค.ศ. 1248-1354 โดยกษัตริย์มุสลิมชาวมัวร์ สุลต่านมุฮัมมัดที่ 1 อิบน์ นัสร์แห่งราชวงศ์นาสริด ซึ่งเป็นราชวงศ์ของชาวมุสลิมราชวงศ์สุดท้ายในสเปน  คำว่า \"อาลัมบรา\" มาจากคำในภาษาอาหรับว่า \"อัลฮัมรออ์\" (อาหรับ: الْحَمْرَاء, Al-Ḥamrā) แปลว่า \"(สิ่ง) ที่มีสีแดง\" เนื่องจากตัวป้อมปราการนั้นก่อสร้างด้วยหิน ดิน และอิฐสีแดง ส่วนอาคารอื่น ๆ ซึ่งสร้างด้วยใช้ปูนขาวเป็นส่วนประกอบก็จะเห็นเป็นสีออกแดง ๆ เช่นกัน\nสถาปัตยกรรมของพระราชวังอาลัมบรามีความโดดเด่นด้วยลายแกะสลักอย่างละเอียดและประณีต ทั้งผนัง เสา เพดาน โค้งซุ้มประตูต่าง ๆ ล้วนแกะสลักอย่างละเอียด นับเป็นงานศิลป์ชั้นยอดของชาวมัวร์ในยุคนั้น อาลัมบราถือเป็นผลงานชิ้นเอกของสถาปัตยกรรมมัวร์\nแม้อาลัมบราจะมีที่ตั้งอยู่บนเนินเขาสูง แต่ก็มีระบบการจัดการเกี่ยวกับน้ำที่ดี มีการทำคูคลองส่งน้ำจากด้านล่างขึ้นมายังพระราชวังเพื่อใช้ในการอุปโภคบริโภค ซึ่งเป็นการแสดงให้เห็นถึงภูมิปัญญาด้านการชลประทานของชาวมัวร์ได้เป็นอย่างดี\nในช่วงคริสต์ศตวรรษที่ 18 ถึงต้นคริสต์ศตวรรษที่ 19 อาลัมบราถูกทอดทิ้งจนค่อย ๆ …","other":"Alhambra"},"en":{"title":"Alhambra","url":"https://en.wikipedia.org/wiki/Alhambra","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/de/Dawn_Charles_V_Palace_Alhambra_Granada_Andalusia_Spain.jpg/960px-Dawn_Charles_V_Palace_Alhambra_Granada_Andalusia_Spain.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Alhambra (, Spanish: [aˈlambɾa]; Arabic: الْحَمْرَاء, romanized: al-ḥamrāʼ ) is a palace and fortress complex located in Granada, Spain. It is one of the most famous monuments of Islamic architecture and the only well-preserved palace from the medieval Islamic world. Additionally, the palace contains notable examples of Spanish Renaissance architecture.","history":"The evidence for a Roman presence is unclear but archaeologists have found remains of ancient foundations on the Sabika hill. A fortress or citadel, probably dating from the Visigothic period, existed on the hill in the 9th century. The first reference to the Qal‘at al-Ḥamra was during the battles between the Arabs and the Muladies during the rule of ‘Abdallah ibn Muhammad (r. 888–912). According to surviving documents from the era, the red castle was quite small, and its walls were not capable of deterring an army intent on conquering. The first reference to al-Ḥamrāʼ  came in lines of poetry attached to an arrow shot over the ramparts, recorded by Ibn Hayyan (d. 1076):\nAt the beginning of the 11th century, the region of Granada was dominated by the Zirids, a Sanhaja Berber group and offshoot of the Zirids who ruled parts of North Africa. When the Caliphate of Córdoba collapsed after 1009 and the Fitna (civil war) began, the Zirid leader Zawi ben Ziri established an independent kingdom for himself, the Taifa of Granada. The Zirids built their citadel and palace, known as the …","other":"อาลัมบรา"}},{"th":null,"en":{"title":"Santiago de Compostela Cathedral","url":"https://en.wikipedia.org/wiki/Santiago_de_Compostela_Cathedral","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a9/Santiago_cathedral_2021.jpg/960px-Santiago_cathedral_2021.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Santiago de Compostela Archcathedral Basilica (Spanish and Galician: Catedral Basílica de Santiago de Compostela) is part of the Metropolitan Archdiocese of Santiago de Compostela and is an integral component of the Santiago de Compostela World Heritage Site in Galicia, Spain. The cathedral is the reputed burial place of Saint James the Great, one of the apostles of Jesus Christ. It is also among the remaining churches in the world built over the tomb of an apostle, the other ones being St Peter\u0027s Basilica in Vatican City, St Thomas Cathedral Basilica in Chennai, India, and Basilica of St.","history":"According to legend, the tomb in Santiago was rediscovered in AD 814 by Pelagius the Hermit, after he witnessed strange lights in the night sky above the Libredon forest. Bishop Theodomirus of Iria recognized this as a miracle and informed king Alfonso II of Asturias and Galicia (791–842). The king ordered the construction of a chapel on the site. Legend has it that the king was the first pilgrim to this shrine. This was followed by the first church in AD 829 and then in AD 899 by a pre-Romanesque church, ordered by king Alfonso III of León, which caused the gradual development of this major place of pilgrimage.\nIn 997 the early church was reduced to ashes by Al-Mansur Ibn Abi Aamir (938–1002), army commander of the caliph of Córdoba. St James\u0027s tomb and relics were left undisturbed. The gates and the bells, carried by local Christian captives to Córdoba, were added to the Aljama Mosque. When Córdoba was taken by king Ferdinand III of Castile in 1236, these same gates and bells were then transported by Muslim captives to Toledo, to be inserted in the Cathedral of Saint Mary of …","other":null}},{"th":null,"en":{"title":"Quinta da Regaleira","url":"https://en.wikipedia.org/wiki/Quinta_da_Regaleira","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e7/Exterior_of_the_Quinta_da_Regaleira_20.jpg/960px-Exterior_of_the_Quinta_da_Regaleira_20.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Quinta da Regaleira [ˈkĩtɐ ðɐ ˈʁɨɣɐlɐjɾɐ] is a quinta (manor house) constructed from 1904 to \u002710 and located near the historic centre of Sintra, Portugal. It is classified as a World Heritage Site by UNESCO within the \"Cultural Landscape of Sintra\". Along with the other palaces in the area such as the Quinta do Relógio, Pena, Monserrate and Seteais palaces, it is considered one of the principal tourist attractions of Sintra.","history":"The land that is now Quinta da Regaleira had many owners over the years. It belonged to the Viscountess of Regaleira, a family of wealthy merchants from Porto, when it was sold in 1892 to Carvalho Monteiro for 25,000 réis. Monteiro was eager to build a bewildering place where he could collect symbols that reflected his interests and ideologies. With the assistance of the Italian architect Luigi Manini, he recreated the 4-hectare estate.\nIn addition to other new features, he added enigmatic buildings that allegedly held symbols related to alchemy, Masonry, the Knights Templar, and the Rosicrucians. The architecture Manini designed evoked Roman, Gothic, Renaissance, and Manueline styles. The construction of the current estate commenced in 1904 and much of it was completed by 1910.\nThe estate was later sold in 1942 to Waldemar d\u0027Orey, who used it as private residence for his extensive family. He ordered repairs and restoration work for the property. In 1987, the estate was sold, once again, to the Japanese Aoki Corporation and ceased to serve as a residence. The corporation kept the …","other":null}},{"th":{"title":"มัสยิด–อาสนวิหารกอร์โดบา","url":"https://th.wikipedia.org/wiki/%E0%B8%A1%E0%B8%B1%E0%B8%AA%E0%B8%A2%E0%B8%B4%E0%B8%94%E2%80%93%E0%B8%AD%E0%B8%B2%E0%B8%AA%E0%B8%99%E0%B8%A7%E0%B8%B4%E0%B8%AB%E0%B8%B2%E0%B8%A3%E0%B8%81%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B9%82%E0%B8%94%E0%B8%9A%E0%B8%B2","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6c/Mezquita_de_C%C3%B3rdoba_desde_el_aire_%28C%C3%B3rdoba%2C_Espa%C3%B1a%29.jpg/960px-Mezquita_de_C%C3%B3rdoba_desde_el_aire_%28C%C3%B3rdoba%2C_Espa%C3%B1a%29.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"อาสนวิหาร และอดีต มัสยิดใหญ่แห่งกอร์โดบา มีชื่อเรียกในศาสนาคริสต์ว่า อาสนวิหารแม่พระรับเกียรติยกขึ้นสวรรค์ (สเปน: Catedral de Nuestra Señora de la Asunción) และเป็นที่รู้จักในท้องถิ่นว่า มัสยิด-อาสนวิหารกอร์โดบา (Mezquita-Catedral de Córdoba) ปัจจุบันเป็นแหล่งมรดกโลกร่วมกับพื้นที่ส่วนประวัติศาสตร์ ตั้งอยู่ในเมืองกอร์โดบา ในแคว้นอันดาลูซิอา ทางตอนใต้ของประเทศสเปน\nด้านประวัติความเป็นมานั้น เริ่มจากใน ค.ศ. 768 หลังจากการรุกรานของชาวมุสลิมบนคาบสมุทรไอบีเรีย การก่อสร้างได้เริ่มขึ้นบนพื้นที่ซึ่งแต่เดิมเป็นที่ตั้งของโบสถ์แห่งนักบุญบิเซนเต โดยที่โบสถ์แห่งนี้ได้ถูกทำลายลงและสร้างมัสยิดกอร์โดบาขึ้นมาแทนที่ \nถ้ามองในมุมมองของมัสยิดแล้ว มัสยิดกอร์โดบาถือได้ว่าเป็นสิ่งที่แสดงถึงความเจริญรุ่งเรืองของอาณาจักรกาหลิบแห่งกอร์โดบา ด้วยพื้นที่ขนาด 23,400 ตารางเมตร ทำให้มัสยิดกอร์โดบามีขนาดใหญ่เป็นอันดับที่สองของโลกเมื่อตอนที่สร้าง อันดับที่หนึ่งเป็นของมัสยิดแห่งนครมักกะฮ์ (ภายหลังใน ค.ศ. 1588 อันดับที่สองตกเป็นของมัสยิดแห่งสุลต่านอะห์มัด ประเทศตุรกี) ลักษณะเด่นอย่างหนึ่งที่น่าสนใจมากคือ กิบลัต (ชุมทิศที่ชาวมุสลิมหันหน้าไปยามละหมาดและขอดุอาอ์) นั้นไม่ได้ชี้ไปยังทิศของนครมักกะฮ์ แต่ว่าชี้ไปยัง 51 องศาทางใต้ของทิศที่เป็นที่ตั้งนครมักกะฮ์ เหตุผลที่เป็นเช่นนี้ก็เพราะว่าที่ตั้งที่ติดกับแม่น้ำกัวดัลกิบีร์ จึงไม่สามารถทำการขยายการก่อสร้างออกไปทางทิศใต้ได้\nจนกระทั่งภายหลังชาวสเปนสามารถพิชิตดินแดนคืนได้สำเร็จ ใน ค.ศ.","history":"อาสนวิหาร และอดีต มัสยิดใหญ่แห่งกอร์โดบา มีชื่อเรียกในศาสนาคริสต์ว่า อาสนวิหารแม่พระรับเกียรติยกขึ้นสวรรค์ (สเปน: Catedral de Nuestra Señora de la Asunción) และเป็นที่รู้จักในท้องถิ่นว่า มัสยิด-อาสนวิหารกอร์โดบา (Mezquita-Catedral de Córdoba) ปัจจุบันเป็นแหล่งมรดกโลกร่วมกับพื้นที่ส่วนประวัติศาสตร์ ตั้งอยู่ในเมืองกอร์โดบา ในแคว้นอันดาลูซิอา ทางตอนใต้ของประเทศสเปน\nด้านประวัติความเป็นมานั้น เริ่มจากใน ค.ศ. 768 หลังจากการรุกรานของชาวมุสลิมบนคาบสมุทรไอบีเรีย การก่อสร้างได้เริ่มขึ้นบนพื้นที่ซึ่งแต่เดิมเป็นที่ตั้งของโบสถ์แห่งนักบุญบิเซนเต โดยที่โบสถ์แห่งนี้ได้ถูกทำลายลงและสร้างมัสยิดกอร์โดบาขึ้นมาแทนที่ \nถ้ามองในมุมมองของมัสยิดแล้ว มัสยิดกอร์โดบาถือได้ว่าเป็นสิ่งที่แสดงถึงความเจริญรุ่งเรืองของอาณาจักรกาหลิบแห่งกอร์โดบา ด้วยพื้นที่ขนาด 23,400 ตารางเมตร ทำให้มัสยิดกอร์โดบามีขนาดใหญ่เป็นอันดับที่สองของโลกเมื่อตอนที่สร้าง อันดับที่หนึ่งเป็นของมัสยิดแห่งนครมักกะฮ์ (ภายหลังใน ค.ศ. 1588 อันดับที่สองตกเป็นของมัสยิดแห่งสุลต่านอะห์มัด ประเทศตุรกี) ลักษณะเด่นอย่างหนึ่งที่น่าสนใจมากคือ กิบลัต (ชุมทิศที่ชาวมุสลิมหันหน้าไปยามละหมาดและขอดุอาอ์) นั้นไม่ได้ชี้ไปยังทิศของนครมักกะฮ์ แต่ว่าชี้ไปยัง 51 …","other":"Mosque–Cathedral of Córdoba"},"en":{"title":"Mosque–Cathedral of Córdoba","url":"https://en.wikipedia.org/wiki/Mosque%E2%80%93Cathedral_of_C%C3%B3rdoba","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6c/Mezquita_de_C%C3%B3rdoba_desde_el_aire_%28C%C3%B3rdoba%2C_Espa%C3%B1a%29.jpg/960px-Mezquita_de_C%C3%B3rdoba_desde_el_aire_%28C%C3%B3rdoba%2C_Espa%C3%B1a%29.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Mosque–Cathedral of Córdoba (Spanish: Mezquita-Catedral de Córdoba [meθˈkita kateˈðɾal de ˈkoɾðoβa]) is the cathedral of the Roman Catholic Diocese of Córdoba in the Spanish region of Andalusia. Officially called the Cathedral of Our Lady of the Assumption (Spanish: Catedral de Nuestra Señora de la Asunción), it is dedicated to the Assumption of Mary. Due to its status as a former mosque, it is also known as the Mezquita (Spanish for \u0027mosque\u0027) and, in a historical sense, as the Great Mosque of Córdoba.","history":"A claim that the site of the mosque-cathedral was once a Roman temple dedicated to Janus dates as far back as Pablo de Céspedes and is sometimes still repeated today. However, Robert Knapp, in his 1983 study of Roman-era Córdoba, dismissed this claim as speculation based on a misunderstanding of Roman milestones found in the area.\nAccording to traditional accounts, the present-day site of the Cathedral–Mosque of Córdoba was originally a Visigothic Christian church dedicated to Saint Vincent of Saragossa, which was divided and shared by Christians and Muslims after the Umayyad conquest of Hispania. As the Muslim community grew and this existing space became too small for prayer, the basilica was expanded little by little through piecemeal additions to the buil
