<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>พิกัดลับ · Secret Spot</title>
<meta name="description" content="ปริศนารายวันแบบนักสัญลักษณ์วิทยา: ถอดรหัสคำใบ้ 5 ข้อ แล้วปักหมุดสถานที่ประวัติศาสตร์บนแผนที่โลก · A daily symbologist's riddle: decode five clues and pin the historic place on the world map.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+Thai:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Single dark look: a candle-lit archive. Gold leaf for structure, wax red for the live pin. */
:root {
  --bg: #100e0b; --panel: #1a1611; --panel-2: #221d16; --ink: #ece2c8; --muted: #a8997a; --line: #3a3124; --gold: #c9a24a; --gold-dim: #8a7034;
  --wax: #b3362b; --wax-ink: #fff4e6;
  --hit: #4e9a5f; --warm: #c9a24a; --mid: #c8702e; --cold: #a8322a; --empty: #1f1a14;
  --font-display: "Cinzel", "Noto Serif Thai", Georgia, serif;
  --font-body: "Noto Serif Thai", Georgia, "Leelawadee UI", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  background-image: radial-gradient(1200px 600px at 70% -10%, rgba(201,162,74,.08), transparent 60%);
  font-family: var(--font-body); font-size: 15.5px; line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(16px, env(safe-area-inset-top, 0px)) 24px;
}
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
[hidden] { display: none !important; }

.top { max-width: 1280px; margin: 0 auto 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 27px; letter-spacing: .06em; line-height: 1; display: flex; align-items: center; gap: 10px; color: var(--gold); }
.caseno { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; }
.top .spacer { flex: 1; }
.ghost { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 14px; color: var(--ink); }
.ghost:hover { border-color: var(--gold-dim); }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.lang button { background: none; border: 0; padding: 6px 11px; cursor: pointer; font-size: 14px; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--gold); color: #1a1408; }

.app { max-width: 1280px; margin: 0 auto; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.mapwrap { position: relative; height: clamp(380px, 64vh, 560px); border-radius: 10px; overflow: hidden; border: 1px solid var(--gold-dim); box-shadow: 0 0 0 4px var(--panel), 0 0 0 5px var(--line); }
@media (min-width: 900px) {
  .app { grid-template-columns: minmax(0, 1.3fr) minmax(340px, 1fr); align-items: start; }
  .mapwrap { position: sticky; top: 16px; height: min(880px, calc(100dvh - 96px)); min-height: 560px; }
}
#map { width: 100%; height: 100%; cursor: crosshair; background: #2a241b; }
#map .leaflet-tile-pane { filter: sepia(.25) contrast(1.03); }
.leaflet-container { font-family: var(--font-body); }
.leaflet-bar a { background: var(--panel); color: var(--ink); border-color: var(--line); }
.leaflet-control-attribution { background: rgba(26,22,17,.85) !important; color: var(--muted); }
.leaflet-control-attribution a { color: var(--gold); }
.hud { position: absolute; left: 10px; right: 10px; bottom: 24px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; z-index: 500; pointer-events: none; }
.hud > * { pointer-events: auto; }
.readout { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 13px; min-width: 0; }
.readout .mono { color: var(--muted); font-family: var(--font-mono); font-size: 12px; }
.confirm { background: var(--wax); color: var(--wax-ink); border: 0; border-radius: 6px; padding: 9px 16px; font-family: var(--font-display); font-weight: 700; letter-spacing: .04em; font-size: 15px; cursor: pointer; }
.confirm:disabled { opacity: .4; cursor: not-allowed; }
.pin { background: none; border: 0; }

.file { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; min-width: 0; }
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-dim); }
.object { font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1.25; margin: 4px 0 6px; color: var(--ink); }
.brief { margin: 0; max-width: 62ch; color: var(--muted); }
.clues { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.clue { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: center; padding: 11px 14px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); }
.clue .n { font-family: "Cinzel", Georgia, serif; font-weight: 700; font-size: 15px; color: var(--gold); text-align: center; border-right: 1px solid var(--line); padding-right: 8px; }
.clue .txt { margin: 0; }
.clue:first-child .txt { font-style: italic; }
.clue.locked { background: none; border-style: dashed; color: var(--muted); }
.clue.locked .n { color: var(--gold-dim); }
.clue.new { animation: reveal .6s ease-out; }
@keyframes reveal { from { opacity: .2; filter: blur(3px); } to { opacity: 1; filter: none; } }

.rows { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.row { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto 30px; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 7px; background: var(--empty); min-height: 42px; }
.row .i { font-family: "Cinzel", Georgia, serif; font-size: 13px; color: var(--gold-dim); }
.row .place { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .km { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 13.5px; }
.row .dir { width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; color: #fff; }
.row.filled { background: transparent; border: 1px solid var(--line); }
.t-hit { background: var(--hit); } .t-warm { background: var(--warm); color: #1a1408 !important; } .t-mid { background: var(--mid); } .t-cold { background: var(--cold); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

.result { border-color: var(--gold-dim); }
.result h2 { font-family: var(--font-display); font-size: 22px; margin: 2px 0 4px; line-height: 1.3; color: var(--gold); }
.result p { margin: 0 0 10px; }
.share { font-family: var(--font-mono); white-space: pre; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 10px 12px; font-size: 13.5px; line-height: 1.5; overflow-x: auto; user-select: all; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
.btn { background: var(--gold); color: #1a1408; border: 0; border-radius: 6px; padding: 9px 14px; cursor: pointer; font-weight: 500; text-decoration: none; display: inline-block; }
.btn.alt { background: none; color: var(--ink); border: 1px solid var(--line); }
.next { font-size: 13px; color: var(--muted); }

.foot { max-width: 1280px; margin: 18px auto 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.foot img { height: 20px; display: block; }
.foot a { color: var(--gold); }

dialog { border: 1px solid var(--gold-dim); border-radius: 10px; background: var(--panel); color: var(--ink); max-width: min(540px, calc(100vw - 32px)); padding: 20px 22px; }
dialog::backdrop { background: rgba(0, 0, 0, .6); }
dialog h3 { font-family: var(--font-display); font-size: 21px; margin: 0 0 8px; color: var(--gold); }
dialog ol { padding-left: 20px; margin: 0 0 12px; }
@media (prefers-reduced-motion: reduce) { .clue.new { animation: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M13 3 L20 18 H6 Z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M13 23 L6 8 H20 Z" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".55"/></svg>
    <span data-t="brand">พิกัดลับ</span>

  <span class="caseno" id="caseno"></span>
  <span class="spacer"></span>
  <div class="lang" role="group" aria-label="Language">

    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
  <button class="ghost" id="helpBtn" type="button" data-t="help">วิธีเล่น</button>
</header>

<main class="app">

    <div id="map"></div>
    <div class="hud">
      <div class="readout" id="readout"></div>

    </div>
  </section>

  <div class="file">
    <article class="card">
      <div class="eyebrow" data-t="daily"></div>
      <h1 class="object" data-t="question"></h1>
      <p class="brief" data-t="brief"></p>
      <ol class="clues" id="clues"></ol>
    </article>

    <article class="card result" id="resultCard" hidden></article>

    <article class="card">
      <div class="eyebrow"><span data-t="yourPins"></span> <span id="tries"></span></div>
      <div class="rows" id="rows"></div>
      <div class="legend">
        <span><i class="t-hit"></i><span data-t="lgHit"></span></span>
        <span><i class="t-warm"></i>≤ 50 <span data-t="km"></span></span>
        <span><i class="t-mid"></i>≤ 500 <span data-t="km"></span></span>
        <span><i class="t-cold"></i><span data-t="lgCold"></span></span>
      </div>
    </article>
  </div>
</main>

<footer class="foot">
  <span data-t="visits"></span>
  <img id="visitBadge" alt="">
  <span>·</span>
  <a href="./" data-t="thaiLink"></a>
</footer>

<dialog id="help">
  <h3 data-t="helpTitle"></h3>
  <ol id="helpList"></ol>
  <form method="dialog"><button class="btn" type="submit" data-t="gotIt"></button></form>
</dialog>

    en: { place: "Temple Church, London", clues: [
      "Knights lie on the stone floor, yet no one is buried beneath them",
      "A round church modelled on the Holy Sepulchre in Jerusalem",
      "Built by the Knights Templar and consecrated in 1185",
      "In London, in the lawyers' quarter",
      "Named after the knights who built it" ] } }
];


const ROMAN = ["I", "II", "III", "IV", "V"];
const T = {
  th: {
    brand: "พิกัดลับ", help: "วิธีเล่น", confirm: "ยืนยันหมุด", daily: "แฟ้มปริศนาประจำวัน", question: "รหัสนี้ชี้ไปที่ใด?",
    brief: "ถอดความหมายของคำใบ้ แล้วปักหมุดให้ตรงสถานที่ประวัติศาสตร์ที่ซ่อนอยู่", yourPins: "หมุดของคุณ",
    km: "กม.", lgHit: "≤ 5 กม. ไขได้!", lgCold: "ไกลกว่านั้น", visits: "จำนวนครั้งที่เปิดเกม", gotIt: "เริ่มไขปริศนา",
    thaiLink: "เล่นเวอร์ชันสถานที่ในไทย", helpTitle: "วิธีเล่นพิกัดลับ",
    helpItems: [
      "ทุกเที่ยงคืน (เวลาไทย) จะมีแฟ้มปริศนาใหม่ ทุกคนได้ข้อเดียวกัน",
      "คำใบ้ข้อ I เป็นรหัสลึกลับ ข้อต่อๆ ไปจะชัดขึ้นเรื่อยๆ: สัญลักษณ์ บุคคล ภูมิภาค และเบาะแสสุดท้าย",
      "ปักหมุดได้ 5 ครั้ง พลาดแต่ละครั้งจะเปิดคำใบ้ข้อถัดไป พร้อมบอกระยะทางและทิศ",
      "ปักห่างจากสถานที่จริงไม่เกิน 5 กม. ถือว่าไขได้",
      "เล่นจบแล้วคัดลอกผลไปแปะในกลุ่ม ใครใช้หมุดน้อยกว่าชนะ ถ้าเท่ากัน ใครปักใกล้กว่าชนะ" ],
    caseNo: (n, d) => `แฟ้ม #${n} · ${d.getUTCDate()} ${["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."][d.getUTCMonth()]} ${d.getUTCFullYear() + 543}`,
    practice: n => `ลองเล่นแฟ้ม #${n}`,
    tapPrompt: (i, n) => `หมุดที่ ${i} จาก ${n}: แตะแผนที่เพื่อเลือกจุด`,
    doneToday: "ปิดแฟ้มนี้แล้ว", locked: i => `ปิดผนึก: เปิดเมื่อหมุดที่ ${i} พลาด`,
    looking: "กำลังระบุตำแหน่ง…", sea: "กลางทะเล / ไม่ทราบชื่อ",
    solvedEb: "ไขปริศนาสำเร็จ", missedEb: "ปริศนายังไม่คลี่คลาย",
    solvedH: (n, d) => `ไขได้ใน ${n} หมุด ห่าง ${d} กม.`, missedH: d => `ใกล้ที่สุด ${d} กม.`,
    answer: p => `คำตอบ: ${p}`, copy: "คัดลอกผลไปแชร์", copied: "คัดลอกแล้ว", selectCopy: "เลือกข้อความแล้ว กดคัดลอก",
    gmaps: "ดูใน Google Maps", nextIn: t => `แฟ้มถัดไปใน ${t}`, found: "ไขได้", toward: "ทิศไปยังคำตอบ"
  },
  en: {
    brand: "Secret Spot", help: "How to play", confirm: "Drop pin", daily: "Today's case file", question: "Where does the code point?",
    brief: "Decode the clues, then pin the hidden historic place as precisely as you can.", yourPins: "Your pins",
    km: "km", lgHit: "≤ 5 km solved!", lgCold: "further", visits: "Game opened", gotIt: "Start decoding",
    thaiLink: "Play the Thailand edition", helpTitle: "How to play Secret Spot",
    helpItems: [
      "A new case file every midnight (Thailand time). Everyone gets the same one.",
      "Clue I is cryptic. The rest get clearer: a symbol, a person, the region, a final lead.",
      "You have 5 pins. Each miss unseals the next clue and shows distance and direction.",
      "Within 5 km of the real place counts as solved.",
      "Copy your result to your group chat. Fewer pins wins; on a tie, the closer pin wins." ],
    caseNo: (n, d) => `File #${n} · ${d.getUTCDate()} ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getUTCMonth()]} ${d.getUTCFullYear()}`,
    practice: n => `Practice file #${n}`,
    tapPrompt: (i, n) => `Pin ${i} of ${n}: tap the map to choose a spot`,
    doneToday: "Case closed", locked: i => `Sealed: opens if pin ${i} misses`,
    looking: "Locating…", sea: "At sea / unnamed",
    solvedEb: "Case solved", missedEb: "Case unsolved",
    solvedH: (n, d) => `Solved in ${n} ${n === 1 ? "pin" : "pins"}, ${d} km away`, missedH: d => `Closest pin: ${d} km`,
    answer: p => `Answer: ${p}`, copy: "Copy result", copied: "Copied", selectCopy: "Text selected, copy it",
    gmaps: "Open in Google Maps", nextIn: t => `Next file in ${t}`, found: "solved", toward: "direction to the answer"
  }
};
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let LANG = (() => { try { const v = localStorage.getItem("pikadlap:lang"); if (v === "th" || v === "en") return v; } catch (e) {} return /^th\b/i.test(navigator.language || "th") ? "th" : "en"; })();
const t = k => T[LANG][k];

function applyStatic() {
  document.documentElement.lang = LANG;
  document.title = LANG === "en" ? "Secret Spot · พิกัดลับ" : "พิกัดลับ · Secret Spot";
  document.querySelectorAll("[data-t]").forEach(el => { const v = t(el.dataset.t); if (typeof v === "string") el.textContent = v; });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
  $("helpList").replaceChildren(...t("helpItems").map(s => { const li = document.createElement("li"); li.textContent = s; return li; }));
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => {
  LANG = b.dataset.lang;
  try { localStorage.setItem("pikadlap:lang", LANG); } catch (e) {}
  applyStatic(); setCaseNo(); renderAll();
});

// ---------- day / case ----------
const MAX_GUESSES = 5, HIT_KM = 5;
const DAY = 86400000, TZ = 7 * 3600000, EPOCH = Date.UTC(2026, 9, 20);
// A link ending in #N (e.g. index.html#2) opens file N as practice instead of today's.
const PRACTICE = (() => { const m = location.hash.match(/^#(\d+)$/); return m && +m[1] >= 1 ? +m[1] - 1 : null; })();
window.addEventListener("hashchange", () => location.reload());
let dayIdx, dateKey, CASE;
function setupDay() {
  dayIdx = PRACTICE !== null ? PRACTICE : Math.max(0, Math.floor((Date.now() + TZ - EPOCH) / DAY));
  dateKey = new Date(EPOCH + dayIdx * DAY).toISOString().slice(0, 10);
  CASE = CASES[dayIdx % CASES.length];
  setCaseNo();
}
function setCaseNo() { $("caseno").textContent = PRACTICE !== null ? t("practice")(dayIdx + 1) : t("caseNo")(dayIdx + 1, new Date(EPOCH + dayIdx * DAY)); }
const caseText = () => CASE[LANG];

// ---------- geo ----------
function km(a, b) {
  const R = 6371, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function bearing(a, b) {
  const r = Math.PI / 180;
  const y = Math.sin((b.lon - a.lon) * r) * Math.cos(b.lat * r);
  const x = Math.cos(a.lat * r) * Math.sin(b.lat * r) - Math.sin(a.lat * r) * Math.cos(b.lat * r) * Math.cos((b.lon - a.lon) * r);
  return (Math.atan2(y, x) / r + 360) % 360;
}
const tier = d => d <= HIT_KM ? "hit" : d <= 50 ? "warm" : d <= 500 ? "mid" : "cold";
const TIER_EMOJI = { hit: "🟩", warm: "🟨", mid: "🟧", cold: "🟥" };
const ARROWS = ["⬆️", "↗️", "➡️", "↘️", "⬇️", "↙️", "⬅️", "↖️"];
const fmtKm = d => d < 10 ? d.toFixed(1) : Math.round(d).toLocaleString(LANG === "en" ? "en-US" : "th-TH");

// Place names for confirmed pins via OpenStreetMap Nominatim (one request per pin, cached per language).
const placeCache = (() => { try { return JSON.parse(localStorage.getItem("pikadlap:places") || "{}"); } catch (e) { return {}; } })();
const pendingLookups = new Set();
const placeKey = (g, lang) => `${g[0].toFixed(3)},${g[1].toFixed(3)},${lang}`;
function placeName(g) {
  const key = placeKey(g, LANG);
  if (key in placeCache) return placeCache[key] || t("sea");
  if (!pendingLookups.has(key)) {
    pendingLookups.add(key);
    fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=10&lat=${g[0]}&lon=${g[1]}&accept-language=${LANG}`)
      .then(r => r.ok ? r.json() : null)
      .then(j => {
        const a = j && j.address;
        placeCache[key] = a ? [a.city || a.town || a.village || a.county || a.state, a.country].filter(Boolean).join(", ") : "";
        try { localStorage.setItem("pikadlap:places", JSON.stringify(placeCache)); } catch (e) {}
        renderRows();
      })
      .catch(() => { placeCache[key] = `${g[0].toFixed(2)}, ${g[1].toFixed(2)}`; renderRows(); });
  }
  return t("looking");
}

// ---------- map ----------
const map = L.map("map", { zoomControl: true, minZoom: 2, maxZoom: 18, worldCopyJump: true }).setView([35, 15], 2);
// Esri National Geographic style basemap (no key), with Esri World Street Map for close zoom.
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/NatGeo_World_Map/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 12, attribution: "Tiles &copy; Esri, National Geographic"
}).addTo(map);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
  minZoom: 13, maxZoom: 19, maxNativeZoom: 18, attribution: "&copy; Esri"
}).addTo(map);
const layer = L.layerGroup().addTo(map);
function pinIcon(color, label, star) {
  const html = star
    ? `<svg width="36" height="36" viewBox="-18 -18 36 36"><circle r="15" fill="none" stroke="${color}" stroke-width="2"/><path d="M0 -11 L9.5 5.5 H-9.5 Z" fill="${color}"/><path d="M0 11 L-9.5 -5.5 H9.5 Z" fill="none" stroke="${color}" stroke-width="1.6"/></svg>`
    : `<svg width="28" height="36" viewBox="-14 -34 28 36"><path d="M0 0 C-2 -9 -12 -13 -12 -21 a12 12 0 0 1 24 0 c0 8 -10 12 -12 21Z" fill="${color}" stroke="#100e0b" stroke-width="1.5"/>${label ? `<text y="-17" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="11" font-weight="700" fill="#fff">${label}</text>` : ""}</svg>`;
  return L.divIcon({ className: "pin", html, iconSize: star ? [36, 36] : [28, 36], iconAnchor: star ? [18, 18] : [14, 34] });
}

// ---------- state ----------
let state = { g: [], done: false, solved: false };
let pending = null, justRevealed = -1;
const LS = () => "pikadlap:world:v1:" + dateKey;
function loadLocal() { try { const v = JSON.parse(localStorage.getItem(LS()) || "null"); if (v && Array.isArray(v.g)) return v; } catch (e) {} return null; }
function saveLocal() { try { localStorage.setItem(LS(), JSON.stringify(state)); } catch (e) {} }
const target = () => ({ lat: CASE.lat, lon: CASE.lon });
const guessKm = g => km({ lat: g[0], lon: g[1] }, target());
const bestKm = st => Math.min(...st.g.map(guessKm));

// ---------- counters (hits.sh, no sign-up) ----------
const COUNTER = "https://hits.sh/rmustang0086-hash.github.io/pikadlap";
$("visitBadge").src = `${COUNTER}.svg?label=visits&color=8a7034`;
function countFinish() {
  // One count per device per daily file; practice games are not counted.
  if (PRACTICE !== null) return;
  const key = "pikadlap:counted:world:" + dateKey;
  try { if (localStorage.getItem(key)) return; localStorage.setItem(key, "1"); } catch (e) {}
  new Image().src = `${COUNTER}/finished.svg`;
  new Image().src = `${COUNTER}/finished-${dateKey}.svg`;
}

map.on("click", e => {
  if (state.done) return;
  const ll = e.latlng.wrap();
  pending = [+ll.lat.toFixed(5), +ll.lng.toFixed(5)];
  renderPending(); renderPins();
});
function renderPending() {
  const ro = $("readout"), btn = $("confirm");
  if (state.done) { ro.textContent = t("doneToday"); btn.hidden = true; return; }
  btn.hidden = false;
  if (!pending) { ro.textContent = t("tapPrompt")(state.g.length + 1, MAX_GUESSES); btn.disabled = true; return; }
  ro.replaceChildren();
  const m = document.createElement("span"); m.className = "mono";
  m.textContent = `${Math.abs(pending[0]).toFixed(4)}°${pending[0] >= 0 ? "N" : "S"}  ${Math.abs(pending[1]).toFixed(4)}°${pending[1] >= 0 ? "E" : "W"}`;
  ro.append(m); btn.disabled = false;
}
$("confirm").onclick = () => {
  if (!pending || state.done) return;
  state.g.push(pending); pending = null;
  const d = guessKm(state.g[state.g.length - 1]);
  if (d <= HIT_KM) { state.solved = true; state.done = true; }
  else if (state.g.length >= MAX_GUESSES) state.done = true;
  if (!state.done) justRevealed = state.g.length;
  saveLocal(); renderAll();
  if (state.done) { fitResult(); countFinish(); }
};
function fitResult() { map.fitBounds(L.latLngBounds([...state.g, [CASE.lat, CASE.lon]]).pad(0.25), { maxZoom: 13 }); }

// ---------- rendering ----------
function renderPins() {
  layer.clearLayers();
  if (state.done) {
    for (const g of state.g) L.polyline([g, [CASE.lat, CASE.lon]], { color: css("--gold"), weight: 1.5, dashArray: "4 6", opacity: .8 }).addTo(layer);
    L.circle([CASE.lat, CASE.lon], { radius: HIT_KM * 1000, color: css("--gold"), weight: 1.5, fillOpacity: .12 }).addTo(layer);
  }
  state.g.forEach((g, i) => L.marker(g, { icon: pinIcon(css("--" + tier(guessKm(g))), ROMAN[i]), interactive: false }).addTo(layer));
  if (pending) L.marker(pending, { icon: pinIcon(css("--wax"), ROMAN[state.g.length]), interactive: false }).addTo(layer);
  if (state.done) L.marker([CASE.lat, CASE.lon], { icon: pinIcon(css("--gold"), "", true), interactive: false, zIndexOffset: 1000 }).addTo(layer);
}
function renderClues() {
  const open = state.done ? 5 : Math.min(5, state.g.length + 1);
  const ol = $("clues"); ol.replaceChildren();
  caseText().clues.forEach((text, i) => {
    const li = document.createElement("li");
    li.className = "clue" + (i < open ? "" : " locked") + (i === justRevealed ? " new" : "");
    const n = document.createElement("span"); n.className = "n"; n.textContent = ROMAN[i];
    const p = document.createElement("p"); p.className = "txt";
    p.textContent = i < open ? (i === 0 ? `“${text}”` : text) : t("locked")(ROMAN[i - 1]);
    li.append(n, p); ol.appendChild(li);
  });
  justRevealed = -1;
}
function renderRows() {
  const box = $("rows"); box.replaceChildren();
  $("tries").textContent = `· ${state.g.length}/${MAX_GUESSES}`;
  for (let i = 0; i < MAX_GUESSES; i++) {
    const row = document.createElement("div"); row.className = "row";
    const idx = document.createElement("span"); idx.className = "i"; idx.textContent = ROMAN[i];
    const place = document.createElement("span"); place.className = "place";
    const kmEl = document.createElement("span"); kmEl.className = "km";
    const dir = document.createElement("span"); dir.className = "dir";
    const g = state.g[i];
    if (g) {
      const d = guessKm(g), tr = tier(d);
      row.classList.add("filled");
      place.textContent = placeName(g);
      kmEl.textContent = fmtKm(d) + " " + t("km");
      dir.classList.add("t-" + tr);
      dir.innerHTML = tr === "hit"
        ? `<svg width="16" height="16" viewBox="0 0 16 16" aria-label="${t("found")}"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`
        : `<svg width="16" height="16" viewBox="0 0 16 16" style="transform:rotate(${bearing({ lat: g[0], lon: g[1] }, target())}deg)" aria-label="${t("toward")}"><path d="M8 2l5 7H9.5v5h-3V9H3z" fill="currentColor"/></svg>`;
    }
    row.append(idx, place, kmEl, dir); box.appendChild(row);
  }
}
function shareText() {
  const lines = state.g.map(g => { const d = guessKm(g), tr = tier(d); return TIER_EMOJI[tr] + (tr === "hit" ? "📍" : ARROWS[Math.round(bearing({ lat: g[0], lon: g[1] }, target()) / 45) % 8]) + " " + fmtKm(d) + " " + t("km"); });
  return `${t("brand")} #${dayIdx + 1} ${state.solved ? state.g.length : "X"}/${MAX_GUESSES}\n` + lines.join("\n") + (location.protocol.startsWith("http") ? "\n" + location.href.split("#")[0] : "");
}
function renderResult() {
  const card = $("resultCard");
  if (!state.done) { card.hidden = true; return; }
  card.hidden = false; card.replaceChildren();
  const eb = document.createElement("div"); eb.className = "eyebrow"; eb.textContent = state.solved ? t("solvedEb") : t("missedEb");
  const h = document.createElement("h2");
  h.textContent = state.solved ? t("solvedH")(state.g.length, fmtKm(bestKm(state))) : t("missedH")(fmtKm(bestKm(state)));
  const p = document.createElement("p"); p.textContent = t("answer")(caseText().place);
  const pre = document.createElement("div"); pre.className = "share"; pre.textContent = shareText();
  const acts = document.createElement("div"); acts.className = "actions";
  const copy = document.createElement("button"); copy.className = "btn"; copy.type = "button"; copy.textContent = t("copy");
  copy.onclick = async () => {
    try { await navigator.clipboard.writeText(shareText()); copy.textContent = t("copied"); }
    catch (e) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); copy.textContent = t("selectCopy"); }
    setTimeout(() => copy.textContent = t("copy"), 2200);
  };
  const gm = document.createElement("a"); gm.className = "btn alt"; gm.target = "_blank"; gm.rel = "noopener";
  gm.href = `https://www.google.com/maps/search/?api=1&query=${CASE.lat},${CASE.lon}`; gm.textContent = t("gmaps");
  const nx = document.createElement("span"); nx.className = "next"; nx.id = "countdown";
  acts.append(copy, gm, nx);
  card.append(eb, h, p, pre, acts);
  tick();
}
function tick() {
  if (PRACTICE !== null) return;
  const left = EPOCH + (dayIdx + 1) * DAY - TZ - Date.now();
  if (left <= 0) { setupDay(); state = loadLocal() || { g: [], done: false, solved: false }; pending = null; map.setView([35, 15], 2); renderAll(); return; }
  const el = $("countdown");
  if (el) { const h = Math.floor(left / 3600000), m = Math.floor(left / 60000) % 60, s = Math.floor(left / 1000) % 60; el.textContent = t("nextIn")(`${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`); }
}
setInterval(tick, 1000);
function renderAll() { renderPending(); renderClues(); renderRows(); renderResult(); renderPins(); }

// ---------- boot ----------
$("helpBtn").onclick = () => $("help").showModal();
applyStatic();
setupDay();
state = loadLocal() || state;
renderAll();
if (state.done) fitResult();
try { if (!state.g.length && !localStorage.getItem("pikadlap:seenHelpWorld")) { localStorage.setItem("pikadlap:seenHelpWorld", "1"); $("help").showModal(); } } catch (e) {}
</script>
</body>
</html>
