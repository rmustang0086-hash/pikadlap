จัตุรัสซันมาร์โกติดและเชื่อมกับปาลัซโซดูกาเล เดิมตัวโบสถ์เป็นโบสถ์น้อยของประมุขผู้ครองเวนิส และมิได้เป็นมหาวิหารของเมือง แต่ตั้งแต่ปี ค.ศ. 1807 เป็นต้นมาจึงใช้เป็นที่นั่งของอัครบิดรแห่งเวนิส ตัวสิ่งก่อสร้างเป็นสิ่งก่อสร้างที่สร้างอย่างงดงามประดับด้วยงานโมเสกแบบไบแซนไทน์ และ ประติมากรรมต่างที่แสดงถึงความอุดมสมบูรณ์ อำนาจ และ ความมั่งคั่งของเวนิส ตั้งแต่คริสต์ศตวรรษที่ 11 ก็ได้รับสมญาว่า “Chiesa d\u0027Oro” หรือ “โบสถ์ทอง”","other":"St Mark\u0027s Basilica"},"en":{"title":"St Mark\u0027s Basilica","url":"https://en.wikipedia.org/wiki/St_Mark%27s_Basilica","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/61/Venezia_Basilica_di_San_Marco_Fassade_2.jpg/960px-Venezia_Basilica_di_San_Marco_Fassade_2.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Patriarchal Cathedral Basilica of Saint Mark (Italian: Basilica Cattedrale Patriarcale di San Marco), commonly known as St Mark\u0027s Basilica (Italian: Basilica di San Marco; Venetian: Baxéłega de San Marco), is the cathedral church of the Patriarchate of Venice; it became the episcopal seat of the Patriarch of Venice in 1807, replacing the earlier cathedral of San Pietro di Castello. It is dedicated to and holds the relics of Saint Mark the Evangelist, the patron saint of the city.\nThe church is located on the eastern end of Saint Mark\u0027s Square, the former political and religious centre of the Republic of Venice, and is attached to the Doge\u0027s Palace.","history":"Several medieval chronicles narrate the translatio, the removal of Saint Mark\u0027s body (excluding the head) from Alexandria in Egypt by two Venetian merchants and its transfer to Venice in 828/829. The Chronicon Venetum further recounts that the relics of Saint Mark were initially placed in a corner tower of the castrum, the fortified residence of the Doge and seat of government located on the site of the present Doge\u0027s Palace. Doge Giustiniano Participazio (in office 827–829) subsequently stipulated in his will that his widow and his younger brother and successor Giovanni (in office 829–832) were to erect a church dedicated to Saint Mark wherein the relics would ultimately be housed. Giustiniano further specified that the new church was to be built between the castrum and the Church of Saint Theodore to the north. Construction of the new church may have actually been underway during Doge Giustiniano\u0027s lifetime and was completed by 836 when the relics of Saint Mark were transferred.\nAlthough the Participazio church was long believed to have been a rectangular structure with a single …","other":"มหาวิหารนักบุญมาระโก"}},{"th":{"title":"มง-แซ็ง-มีแชล","url":"https://th.wikipedia.org/wiki/%E0%B8%A1%E0%B8%87-%E0%B9%81%E0%B8%8B%E0%B9%87%E0%B8%87-%E0%B8%A1%E0%B8%B5%E0%B9%81%E0%B8%8A%E0%B8%A5","img":"https://upload.wikimedia.org/wikipedia/commons/1/10/Mont_Saint_Michel_bordercropped.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail_unscaled","intro":"มง-แซ็ง-มีแชล (ฝรั่งเศส: Mont-Saint-Michel) คือวิหารที่ตั้งอยู่บนเกาะโดดเดี่ยวกลางทะเลชายฝั่งตะวันตก บริเวณจังหวัดม็องช์ แคว้นนอร์ม็องดี ประเทศฝรั่งเศส ได้รับประกาศจากยูเนสโกให้เป็นแหล่งมรดกโลกเมื่อปี พ.ศ. 2522 ภายใต้ชื่อ มง-แซ็ง-มีแชลและอ่าว \nในปีหนึ่งจะมีนักท่องเที่ยวไปเยี่ยมเยือนมง-แซ็ง-มีแชลกว่า 3 ล้าน 2 แสนคน ซึ่งทำให้ที่นี่เป็นสถานที่ท่องเที่ยวยอดนิยมอันดับที่ 3 ของประเทศฝรั่งเศสรองลงมาจากหอไอเฟลและพระราชวังแวร์ซาย \nตัวเกาะอันเป็นที่ตั้งของวิหารนั้นเป็นหินแกรนิต โดยมีเส้นรอบวงเกาะประมาณ 960 เมตร และสูง 92 เมตร แล้วถ้าบวกกับความสูงของตัววิหารนั้นแล้วก็จะมีความสูงถึง 155 แมตร ถือเป็นปราการธรรมชาติตั้งแต่สมัยยุคกลาง โดยตั้งชื่อตามวิหารที่ตั้งตระหง่านอยู่บนยอดเขานั่นเอง บนยอดวิหารเป็นรูปปั้นทองของอัครทูตสวรรค์มีคาเอล (นักบุญมิคาเอล) สร้างโดยแอมานุแอล เฟรมีเย (Emmanuel Frémiet) \nในปัจจุบัน มีประชากรอยู่อาศัยบนเกาะ 50 คน จากสถิติ ณ ปี ค.ศ.","history":"ก่อนที่จะมีการสถาปนาราชวงศ์แรกของฝรั่งเศสขึ้นในช่วงคริสต์ศตวรรษที่ 8 เกาะนี้เคยถูกเรียกว่า มงตงบ์ (Mont Tombe) และตามตำนาน วิหารที่อยู่บนเกาะนี้ถูกสร้างโดยการแนะนำของเทวดามีแชล ที่ได้เข้าฝันนักบุญโอแบร์ บิชอปแห่งมาฟร็องช์เมื่อปี พ.ศ. 1251 แต่เขาก็มิได้ปฏิบัติตาม เนื่องจากนึกว่าปีศาจได้มาเข้าฝัน เขาจึงได้เพิกเฉยไป จนมาถึงการฝันครั้งที่ 3 มีแชลได้ใช้นิ้วของเขาจิ้มที่หัวของโอแบร์ และเมื่อเขาตื่นขึ้นมา เขาก็ได้ตะลึงว่ามีรูอยู่บนหัวจริง ๆ จากนั้นมาเขาจึงตัดสินใจสร้างวิหารบนยอดเขา  \nในช่วงการปฏิวัติฝรั่งเศส เนื่องจากไม่มีพระจำพรรษา ตัววิหารได้ถูกเปลี่ยนเป็นที่คุมขังนักโทษสำคัญการเมือง จนกระทั่งวิกตอร์ อูโก ได้มีบทบาทสำคัญในการรณรงค์เพื่อคืนความเป็นสิ่งก่อสร้างสำคัญทางสถาปัตยกรรมของชาติ และในที่สุดได้มีการยกเลิกการเป็นเรือนจำ และได้ถูกเปลี่ยนสถานะเป็นสถานที่สำคัญทางประวัติศาสตร์ในปี พ.ศ. 2417 \nในปี พ.ศ. 2522 ได้มีการขึ้นทะเบียนเป็นมรดกโลกทางวัฒนธรรม ประวัติศาสตร์ และสถาปัตยกรรม โดยองค์การยูเนสโก","other":"Mont-Saint-Michel"},"en":{"title":"Mont-Saint-Michel","url":"https://en.wikipedia.org/wiki/Mont-Saint-Michel","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/78/Mont-Saint-Michel_vu_du_ciel.jpg/960px-Mont-Saint-Michel_vu_du_ciel.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Mont-Saint-Michel (French pronunciation: [lə mɔ̃ sɛ̃ miʃɛl]; Norman: Mont Saint Miché; English: Saint Michael\u0027s Mount) is a tidal island and mainland commune in Normandy, France.\nThe island lies approximately one kilometre (half a nautical mile) off France\u0027s north-western coast, at the mouth of the Couesnon River near Avranches and is 7 hectares (17 acres) in area. The mainland part of the commune is 393 hectares (971 acres) in area so that the total surface of the commune is 400 hectares (990 acres).","history":"Before the construction of the first monastic establishment in the 8th century, the island was called Mont Tombe (Latin: tumba). According to a legend, the archangel Michael appeared in 708 to Aubert of Avranches, the bishop of Avranches, and instructed him to build a church on the rocky islet.\nUnable to defend his kingdom against the assaults of the Vikings, the king of the Franks agreed to grant the Cotentin Peninsula and the Avranchin, including Mont-Saint-Michel traditionally linked to the city of Avranches, to the Bretons in the Treaty of Compiègne. This marked the beginning of a brief period of Breton possession of the Mont. In fact, these lands and Mont-Saint-Michel were never really included in the duchy of Brittany. Around 989–990 these traditional bishoprics, dependent of the archbishopric of Rouen and that had been left vacant during the time of the Viking raids, regained their bishops.\nThe mount gained strategic significance again in 933 when William I Longsword annexed the Cotentin Peninsula from the weakened Duchy of Brittany. This made the mount definitively part of …","other":"มง-แซ็ง-มีแชล"}},{"th":null,"en":{"title":"Saint-Sulpice, Paris","url":"https://en.wikipedia.org/wiki/Saint-Sulpice,_Paris","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5a/Paris_Saint-Sulpice_Fassade_4-5_A.jpg/960px-Paris_Saint-Sulpice_Fassade_4-5_A.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Church of Saint-Sulpice (French pronunciation: [sɛ̃ sylpis] ) is a Catholic church in Paris, France, on the east side of Place Saint-Sulpice, in the 6th arrondissement. It is the second largest church in the city. It is dedicated to Sulpitius the Pious.","history":"The present church is the second building on the site, erected over a Romanesque church originally constructed during the 13th century. Additions were made over the centuries, up to 1631. The new building was founded in 1646 by parish priest Jean-Jacques Olier (1608–1657) who had established the Society of Saint-Sulpice, a clerical congregation, and a seminary attached to the church. Anne of Austria laid the first stone.\nConstruction began in 1646 to designs which had been created in 1636 by Christophe Gamard, but the Fronde interfered, and only the Lady Chapel had been built by 1660, when Daniel Gittard provided a new general design for most of the church. Gittard completed the sanctuary, ambulatory, apsidal chapels, transept, and north portal (1670–1678), after which construction was halted for lack of funds.\nGilles-Marie Oppenord and Giovanni Servandoni, adhering closely to Gittard\u0027s designs, supervised further construction (mainly the nave and side-chapels, 1719–1745). The decoration was executed by the brothers Sébastien-Antoine Slodtz (1695–1742) and Paul-Ambroise Slodtz …","other":null}},{"th":{"title":"บาซิลิกาซิสเทิร์น","url":"https://th.wikipedia.org/wiki/%E0%B8%9A%E0%B8%B2%E0%B8%8B%E0%B8%B4%E0%B8%A5%E0%B8%B4%E0%B8%81%E0%B8%B2%E0%B8%8B%E0%B8%B4%E0%B8%AA%E0%B9%80%E0%B8%97%E0%B8%B4%E0%B8%A3%E0%B9%8C%E0%B8%99","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cc/Basilica_Cistern_after_restoration_2022_%2811%29.jpg/960px-Basilica_Cistern_after_restoration_2022_%2811%29.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"บาซิลิกาซิสเทิร์น (อังกฤษ: Basilica Cistern, กรีก: Βασιλική Κινστέρνα, ตุรกี: Yerebatan Sarnıcı หรือ Yerebatan Saray) เป็นโพรงน้ำใต้ดินโบราณที่ใหญ่ที่สุดในนครอิสตันบูล ประเทศตุรกี ตั้งอยู่ห่างไป 150 เมตร (490 ฟุต) ทางใต้ของอายาโซฟยา บนคาบสมุทรซารายบูร์นู บาซิลิกาซิสเทิร์นสร้างขึ้นในศตวรรษที่ 6 ในรัชสมัยของจักรพรรดิบีแซนทีน ยุสตีนยาที่หนึ่ง และมีบันทึกอ้างว่าใช้ทาสกว่า 7,000 คนในการก่อสร้าง ปัจจุบันมีการคงระดับน้ำภายในให้ต่ำสำหรับเปิดให้สาธารณชนสามารถเข้าชมได้","history":"บาซิลิกาซิสเทิร์น (อังกฤษ: Basilica Cistern, กรีก: Βασιλική Κινστέρνα, ตุรกี: Yerebatan Sarnıcı หรือ Yerebatan Saray) เป็นโพรงน้ำใต้ดินโบราณที่ใหญ่ที่สุดในนครอิสตันบูล ประเทศตุรกี ตั้งอยู่ห่างไป 150 เมตร (490 ฟุต) ทางใต้ของอายาโซฟยา บนคาบสมุทรซารายบูร์นู บาซิลิกาซิสเทิร์นสร้างขึ้นในศตวรรษที่ 6 ในรัชสมัยของจักรพรรดิบีแซนทีน ยุสตีนยาที่หนึ่ง และมีบันทึกอ้างว่าใช้ทาสกว่า 7,000 คนในการก่อสร้าง ปัจจุบันมีการคงระดับน้ำภายในให้ต่ำสำหรับเปิดให้สาธารณชนสามารถเข้าชมได้\nชื่อบาซิลิกานี้ได้มาจากในอดีตซิสเทิร์นนี้ตั้งอยู่ใต้จัตุรัสสาธารณะขนาดใหญ่ที่ชื่อ สโตอาบาซิลิกา (Stoa Basilica) บนเนินเขาที่หนึ่ง ก่อนหน้านี้จัตุรัสเคยเป็นที่ตั้งของบาซิลิกาที่สร้างขึ้นในต้นศตวรรษที่ 3-4\n== อ้างอิง ==","other":"Basilica Cistern"},"en":{"title":"Basilica Cistern","url":"https://en.wikipedia.org/wiki/Basilica_Cistern","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ae/Cisterna_Bas%C3%ADlica%2C_Estambul%2C_Turqu%C3%ADa%2C_2024-09-28%2C_DD_58-60_HDR.jpg/960px-Cisterna_Bas%C3%ADlica%2C_Estambul%2C_Turqu%C3%ADa%2C_2024-09-28%2C_DD_58-60_HDR.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"The Basilica Cistern, or Cisterna Basilica (Greek: Βασιλική Κινστέρνα, Turkish: Yerebatan Sarnıcı or Yerebatan Sarayı, \"Subterranean Cistern\" or \"Subterranean Palace\"), is the largest of several hundred ancient cisterns that lie beneath the city of Istanbul, Turkey. The cistern, located 150 metres (490 ft) southwest of the Hagia Sophia on the historical peninsula of Sarayburnu, was built in the 6th century during the reign of Byzantine emperor Justinian I. Today, it is kept with little water for public access inside the space.","history":"Prior to the cistern\u0027s construction, a great basilica stood on the spot. It had been built during the Early Roman Age between the 3rd and 4th centuries as a commercial, legal, and artistic centre. The subterranean cistern was built in the 6th century during the reign of Byzantine emperor Justinian I. It was called Basilica because it was located under a large public square, the Stoa Basilica, on the First Hill of Constantinople.\nAncient texts indicated that the basilica cistern contained gardens surrounded by a colonnade that faced the Hagia Sophia.\nHistorical texts claim that 7,000 enslaved people were involved in the construction of the cistern.\nThe existence of the cistern was eventually forgotten by all but the locals who still drew water from it until, in 1565, the French traveller Petrus Gyllius left a record of it. Gyllius recorded being rowed in between the columns and seeing fish swimming in the water beneath the boat.\nThe Istanbul Metropolitan Municipality undertook the first major modern restoration of the Basilica Cistern between 1985 and 1987. More than 50,000 tons of …","other":"บาซิลิกาซิสเทิร์น"}},{"th":null,"en":{"title":"Santa Maria de Montserrat Abbey","url":"https://en.wikipedia.org/wiki/Santa_Maria_de_Montserrat_Abbey","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d5/Abbey_of_Montserrat_02.jpg/960px-Abbey_of_Montserrat_02.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Santa Maria de Montserrat (Catalan pronunciation: [ˈsantə məˈɾi.ə ðə munsəˈrat]) is an abbey of the Order of Saint Benedict located on the mountain of Montserrat in Monistrol de Montserrat, Catalonia, Spain. It is notable for enshrining the image of the Virgin of Montserrat. The monastery was founded in 1025 and rebuilt between the 19th and 20th centuries.","history":"The legend places the finding of the statue of the Virgin of Montserrat around 880. Then began the cult of the Moreneta virgin, which materialized in four earlier hermitages in the 9th century: Santa Maria, Sant Iscle, Sant Pere and Sant Martí. However, the origin of the monastery is uncertain. It is known that around 1011 a monk from the monastery of Santa Maria de Ripoll came to the mountain to take charge of the monastery of Santa Cecília de Montserrat, thus leaving the monastery under the orders of Abbot Oliba of Ripoll. Santa Cecília did not accept this new situation, so Oliba decided to found the monastery of Santa Maria in the place where there was an old hermitage of the same name (1025). As of 1082, Santa Maria gained an abbot of her own and ceased to depend on the abbot of Ripoll. This hermitage had become the most important of all those that existed in the mountain thanks to the statue of the Virgin that was venerated in it since 880.\nIn 1811 and in 1812, during Napoleon\u0027s invasion of Spain, the abbey was twice burned down and ransacked by Napoleon\u0027s troops, and many of …","other":null}},{"en":{"title":"Fontana dei Quattro Fiumi","url":"https://en.wikipedia.org/wiki/Fontana_dei_Quattro_Fiumi","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a5/Obelisco_Fontana_dei_Fiumi_Piazza_Navona_Roma.jpg/960px-Obelisco_Fontana_dei_Fiumi_Piazza_Navona_Roma.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"Fontana dei Quattro Fiumi (Fountain of the Four Rivers) is a fountain in the Piazza Navona in Rome, Italy. It was designed in 1651 by Gian Lorenzo Bernini for Pope Innocent X whose family palace, the Palazzo Pamphili, faced onto the piazza as did the church of Sant\u0027Agnese in Agone of which Innocent was the sponsor.","history":"Fontana dei Quattro Fiumi (Fountain of the Four Rivers) is a fountain in the Piazza Navona in Rome, Italy. It was designed in 1651 by Gian Lorenzo Bernini for Pope Innocent X whose family palace, the Palazzo Pamphili, faced onto the piazza as did the church of Sant\u0027Agnese in Agone of which Innocent was the sponsor.","other":null},"th":{"title":"จัตุรัสนาโวนา","url":"https://th.wikipedia.org/wiki/%E0%B8%88%E0%B8%B1%E0%B8%95%E0%B8%B8%E0%B8%A3%E0%B8%B1%E0%B8%AA%E0%B8%99%E0%B8%B2%E0%B9%82%E0%B8%A7%E0%B8%99%E0%B8%B2","img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/80/Piazza_Navona%2C_Rome.jpg/960px-Piazza_Navona%2C_Rome.jpg?utm_source=th.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail","intro":"จัตุรัสนาโวนา (อิตาลี: Piazza Navona) เป็นจัตุรัสแห่งหนึ่งในกรุงโรม เคยเป็นสนามกีฬาโรมันโบราณในคริสต์ศตวรรษที่ 1 ที่ชื่อว่า Stadium of Domitian ซึ่งชาวโรมันจะเดินทางมาที่นี่เพื่อชม agones (\"กีฬา\") โดยในสมัยนั้นสถานที่แห่งนี้รู้จักในชื่อว่า \u0027Circus Agonalis\u0027 (สนามกีฬา) เชื่อกันว่าชื่อของจัตุรัสนี้มาจากการเรียกชื่อสถานที่เพี้ยนจาก \u0027in agone\u0027 เป็น \u0027navone\u0027 จนกระทั่งกลายมาเป็น \u0027navona\u0027 ในที่สุด","his g in the city around 500–600 AD. Until 1659–1745 the area was not considered French territory, being part of the Catalan Country since 988. However, British archaeologist Bill Putnam and British physicist John Edwin Wood argued that, while there may have been a Visigothic town on the site of the present village, it would have had \"a population closer to 300 than 30,000\".\nBy 1050 the Counts of Toulouse held …","other":null}},{"th":null,"en":{"title":"Temple Church","url":"https://en.wikipedia.org/wiki/Temple_Church","img":"https://upload.wikimedia.org/wikipedia/commons/f/f4/Temple_Church%2C_Temple%2C_London_EC4_%282%29.jpeg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail_unscaled","intro":"The Temple Church, a royal peculiar in the Church of England, is a church in the Inner and Middle Temples located between Fleet Street and the River Thames in London, England. It was built by the Knights Templar for their English headquarters in the Temple precinct and consecrated on 10 February 1185 by Patriarch Heraclius of Jerusalem. During the reign of King John (1199–1216) it served as the royal treasury, supported by the role of the Knights Templar as proto-international bankers.","history":"In the mid-12th century, before the construction of the church, the Knights Templar in London had met at a site in High Holborn in a structure originally established by Hugues de Payens (the site had been historically the location of a Roman temple in Londinium, now known as London). Because of the rapid growth of the order, by the 1160s the site had become too confined, and the order purchased the current site for the establishment of a larger monastic complex as their headquarters in England. In addition to the church, the new compound originally contained residences, military training facilities, and recreational grounds for the military brethren and novices, who were not permitted to go into the City without the permission of the Master of the Temple.\n const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let LANG = (() => { try { const v = localStorage.getItem("pikadlap:lang"); if (v === "th" || v === "en") return v; } catch (e) {} return /^th\b/i.test(navigator.language || "th") ? "th" : "en"; })();
const t = k => T[LANG][k];

function applyStatic() {
  document.documentElement.lang = LANG;
  document.title = LANG === "en" ? "Secret Spot · พิกัดลับ" : "พิกัดลับ · Secret Spot";
  document.querySelectorAll("[data-t]").forEach(el => { const v = t(el.dataset.t); if (typeof v === "string") el.textContent = v; });

}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => {
  LANG = b.dataset.lang;
  try { localStorage.setItem("pikadlap:lang", LANG); } catch (e) {}
  applyStatic(); setCaseNo(); renderAll();
});

// ---------- day / case ----------
const MAX_GUESSES = 5, HIT_KM = 5;
const DAY = 86400000, TZ = 7 * 3600000, EPOCH = Date.UTC(2026, 9, 20);
// A link ending in #N (e.g. index.html#2) opens file N as practice instead of today's.
const PRACTICE = (() => { const m = location.hash.match(/^#(\d+)$/); return m && +m[1] >= 1 ? +m[1] - 1 : null; })();
window.addEventListener("hashchange", () => location.reload());
let dayIdx, dateKey, CASE;
function setupDay() {
  dayIdx = PRACTICE !== null ? PRACTICE : Math.max(0, Math.floor((Date.now() + TZ - EPOCH) / DAY));
  dateKey = new Date(EPOCH + dayIdx * DAY).toISOString().slice(0, 10);
  CASE = CASES[dayIdx % CASES.length];
  setCaseNo();
}
function setCaseNo() { $("caseno").textContent = PRACTICE !== null ? t("practice")(dayIdx + 1) : t("caseNo")(dayIdx + 1, new Date(EPOCH + dayIdx * DAY)); }
const caseText = () => CASE[LANG];

// ---------- geo ----------
function km(a, b) {
  const R = 6371, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function bearing(a, b) {
  const r = Math.PI / 180;
  const y = Math.sin((b.lon - a.lon) * r) * Math.cos(b.lat * r);
  const x = Math.cos(a.lat * r) * Math.sin(b.lat * r) - Math.sin(a.lat * r) * Math.cos(b.lat * r) * Math.cos((b.lon - a.lon) * r);
  return (Math.atan2(y, x) / r + 360) % 360;
}
const tier = d => d <= HIT_KM ? "hit" : d <= 50 ? "warm" : d <= 500 ? "mid" : "cold";
const TIER_EMOJI = { hit: "🟩", warm: "🟨", mid: "🟧", cold: "🟥" };
const ARROWS = ["⬆️", "↗️", "➡️", "↘️", "⬇️", "↙️", "⬅️", "↖️"];
const fmtKm = d => d < 10 ? d.toFixed(1) : Math.round(d).toLocaleString(LANG === "en" ? "en-US" : "th-TH");

// Place names for confirmed pins via OpenStreetMap Nominatim (one request per pin, cached per language).
const placeCache = (() => { try { return JSON.parse(localStorage.getItem("pikadlap:places") || "{}"); } catch (e) { return {}; } })();
const pendingLookups = new Set();
const placeKey = (g, lang) => `${g[0].toFixed(3)},${g[1].toFixed(3)},${lang}`;
function placeName(g) {
  const key = placeKey(g, LANG);
  if (key in placeCache) return placeCache[key] || t("sea");
  if (!pendingLookups.has(key)) {
    pendingLookups.add(key);
    fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=10&lat=${g[0]}&lon=${g[1]}&accept-language=${LANG}`)
      .then(r => r.ok ? r.json() : null)
      .then(j => {
        const a = j && j.address;
        placeCache[key] = a ? [a.city || a.town || a.village || a.county || a.state, a.country].filter(Boolean).join(", ") : "";
        try { localStorage.setItem("pikadlap:places", JSON.stringify(placeCache)); } catch (e) {}
        renderRows();
      })
      .catch(() => { placeCache[key] = `${g[0].toFixed(2)}, ${g[1].toFixed(2)}`; renderRows(); });
  }
  return t("looking");
}

map.on("click", e => {

function renderPending() {
  const ro = $("readout"), btn = $("confirm");
  if (state.done) { ro.textContent = t("doneToday"); btn.hidden = true; return; }
  btn.hidden = false;
  if (!pending) { ro.textContent = t("tapPrompt")(state.g.length + 1, MAX_GUESSES); btn.disabled = true; return; }
  ro.replaceChildren();
  const m = document.createElement("span"); m.className = "mono";
  m.textContent = `${Math.abs(pending[0]).toFixed(4)}°${pending[0] >= 0 ? "N" : "S"}  ${Math.abs(pending[1]).toFixed(4)}°${pending[1] >= 0 ? "E" : "W"}`;

}
$("confirm").onclick = () => {
  if (!pending || state.done) return;
  state.g.push(pending); pending = null;
  const d = guessKm(state.g[state.g.length - 1]);
  if (d <= HIT_KM) { state.solved = true; state.done = true; }
  else if (state.g.length >= MAX_GUESSES) state.done = true;

  layer.clearLayers();
  if (state.done) {
    for (const g of state.g) L.polyline([g, [CASE.lat, CASE.lon]], { color: css("--gold"), weight: 1.5, dashArray: "4 6", opacity: .8 }).addTo(layer);
    L.circle([CASE.lat, CASE.lon], { radius: HIT_KM * 1000, color: css("--gold"), weight: 1.5, fillOpacity: .12 }).addTo(layer);
  }
  state.g.forEach((g, i) => L.marker(g, { icon: pinIcon(css("--" + tier(guessKm(g))), ROMAN[i]), interactive: false }).addTo(layer));
  if (pending) L.marker(pending, { icon: pinIcon(css("--wax"), ROMAN[state.g.length]), interactive: false }).addTo(layer);
  if (state.done) L.marker([CASE.lat, CASE.lon], { icon: pinIcon(css("--gold"), "", true), interactive: false, zIndexOffset: 1000 }).addTo(layer);
}
function renderClues() {
  const open = state.done ? 5 : Math.min(5, state.g.length + 1);
  const ol = $("clues"); ol.replaceChildren();
  caseText().clues.forEach((text, i) => {
    const li = document.createElement("li");
    li.className = "clue" + (i < open ? "" : " locked") + (i === justRevealed ? " new" : "");
    const n = document.createElement("span"); n.className = "n"; n.textContent = ROMAN[i];
    const p = document.createElement("p"); p.className = "txt";
    p.textContent = i < open ? (i === 0 ? `“${text}”` : text) : t("locked")(ROMAN[i - 1]);
    li.append(n, p); ol.appendChild(li);
  });
  justRevealed = -1;
}
function renderRows() {
  const box = $("rows"); box.replaceChildren();
  $("tries").textContent = `· ${state.g.length}/${MAX_GUESSES}`;
  for (let i = 0; i < MAX_GUESSES; i++) {
    const row = document.createElement("div"); row.className = "row";
    const idx = document.createElement("span"); idx.className = "i"; idx.textContent = ROMAN[i];
    const place = document.createElement("span"); place.className = "place";
    const kmEl = document.createElement("span"); kmEl.className = "km";
    const dir = document.createElement("span"); dir.className = "dir";
    const g = state.g[i];
    if (g) {
      const d = guessKm(g), tr = tier(d);
      row.classList.add("filled");
      place.textContent = placeName(g);
      kmEl.textContent = fmtKm(d) + " " + t("km");
      dir.classList.add("t-" + tr);
      dir.innerHTML = tr === "hit"
        ? `<svg width="16" height="16" viewBox="0 0 16 16" aria-label="${t("found")}"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`
        : `<svg width="16" height="16" viewBox="0 0 16 16" style="transform:rotate(${bearing({ lat: g[0], lon: g[1] }, target())}deg)" aria-label="${t("toward")}"><path d="M8 2l5 7H9.5v5h-3V9H3z" fill="currentColor"/></svg>`;
    }
    row.append(idx, place, kmEl, dir); box.appendChild(row);
  }
}
function shareText() {
  const lines = state.g.map(g => { const d = guessKm(g), tr = tier(d); return TIER_EMOJI[tr] + (tr === "hit" ? "📍" : ARROWS[Math.round(bearing({ lat: g[0], lon: g[1] }, target()) / 45) % 8]) + " " + fmtKm(d) + " " + t("km"); });
  return `${t("brand")} #${dayIdx + 1} ${state.solved ? state.g.length : "X"}/${MAX_GUESSES}\n` + lines.join("\n") + (location.protocol.startsWith("http") ? "\n" + location.href.split("#")[0] : "");
}
function renderResult() {
  const card = $("resultCard");
  if (!state.done) { card.hidden = true; return; }
  card.hidden = false; card.replaceChildren();
  const eb = document.createElement("div"); eb.className = "eyebrow"; eb.textContent = state.solved ? t("solvedEb") : t("missedEb");
  const h = document.createElement("h2");
  h.textContent = state.solved ? t("solvedH")(state.g.length, fmtKm(bestKm(state))) : t("missedH")(fmtKm(bestKm(state)));
  const p = document.createElement("p"); p.textContent = t("answer")(caseText().place);
  const pre = document.createElement("div"); pre.className = "share"; pre.textContent = shareText();
  const acts = document.createElement("div"); acts.className = "actions";
  const copy = document.createElement("button"); copy.className = "btn"; copy.type = "button"; copy.textContent = t("copy");
  copy.onclick = async () => {
    try { await navigator.clipboard.writeText(shareText()); copy.textContent = t("copied"); }
    catch (e) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); copy.textContent = t("selectCopy"); }
    setTimeout(() => copy.textContent = t("copy"), 2200);
  };
  const gm = document.createElement("a"); gm.className = "btn alt"; gm.target = "_blank"; gm.rel = "noopener";
  gm.href = `https://www.google.com/maps/search/?api=1&query=${CASE.lat},${CASE.lon}`; gm.textContent = t("gmaps");
  const nx = document.createElement("span"); nx.className = "next"; nx.id = "countdown";
  acts.append(copy, gm, nx);
  card.append(eb, h, p, pre, acts);
  revealExtras(card, CASE);
  tick();
}
function tick() {
  if (PRACTICE !== null) return;
  const left = EPOCH + (dayIdx + 1) * DAY - TZ - Date.now();
  if (left <= 0) { setupDay(); state = loadLocal() || { g: [], done: false, solved: false }; pending = null; map.setView([35, 15], 2); renderAll(); return; }
  const el = $("countdown");
  if (el) { const h = Math.floor(left / 3600000), m = Math.floor(left / 60000) % 60, s = Math.floor(left / 1000) % 60; el.textContent = t("nextIn")(`${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`); }
}
setInterval(tick, 1000);
function renderAll() { renderPending(); renderClues(); renderRows(); renderResult(); renderPins(); }

// ---------- answer reveal: real photo + summary (Wikipedia), zoom to the spot, satellite view ----------
const REVEAL_T = {
  th: { zoomReal: "ซูมดูสถานที่จริง", sat: "ภาพดาวเทียม", mapView: "กลับเป็นแผนที่", wikiMore: "อ่านต่อใน Wikipedia", wikiLoading: "กำลังโหลดรูปสถานที่จริง…", history: "ประวัติ", noThai: "ยังไม่มีบทความภาษาไทย จึงแสดงประวัติภาษาอังกฤษ" },
  en: { zoomReal: "Zoom to the real place", sat: "Satellite view", mapView: "Back to map", wikiMore: "Read more on Wikipedia", wikiLoading: "Loading a photo of the real place…", history: "History", noThai: "" }
};
const rt = k => REVEAL_T[LANG][k];
let satLayer = null, satOn = false;
function setSatellite(on) {
  if (!satLayer) satLayer = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, maxNativeZoom: 18, attribution: "Imagery &copy; Esri" });
  satOn = on;
  if (on) satLayer.addTo(map); else map.removeLayer(satLayer);
  document.getElementById("map").classList.toggle("sat", on);
}
const wikiCache = {};
function wikiQuery(lang, select) {
  const k = lang + "|" + select;
  if (!wikiCache[k]) {
    const url = `https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&${select}&prop=pageimages|extracts|info|langlinks&lllang=th&inprop=url&piprop=thumbnail&pithumbsize=720&exintro=1&explaintext=1&exsentences=3`;
    wikiCache[k] = fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(j => {
      const ps = j && j.query && j.query.pages; if (!ps) return null;
      const p = Object.values(ps)[0];
      if (!p || p.missing !== undefined) return null;
      return { title: p.title, lang, img: p.thumbnail && p.thumbnail.source, text: p.extract || "", url: p.fullurl,
        thTitle: p.langlinks && p.langlinks[0] && p.langlinks[0]["*"] };
    }).catch(() => { delete wikiCache[k]; return null; }); // a failed request can be retried later
  }
  return wikiCache[k];
}
const wikiSearch = (lang, q) => wikiQuery(lang, "generator=search&gsrlimit=1&gsrsearch=" + encodeURIComponent(q));
const wikiTitle = (lang, title) => wikiQuery(lang, "titles=" + encodeURIComponent(title));
// Photo, intro and history baked into the page at build time (WIKI[i] = {th, en}); live lookups are only a fallback.
function bakedFor(c) {
  const b = typeof WIKI !== "undefined" && WIKI[CASES.indexOf(c)];
  if (!b) return null;
  const want = b[LANG], other = b[LANG === "th" ? "en" : "th"], base = want || other;
  if (!base) return null;
  return { title: base.title, url: base.url, img: (want && want.img) || (other && other.img), text: want ? (want.intro || "") : "",
    history: base.history || "", lang: want ? LANG : (LANG === "th" ? "en" : "th"), noTh: LANG === "th" && !want };
}
async function wikiFor(c) {
  const baked = bakedFor(c);
  if (baked) return baked;
  const en = c.wikiEn ? await wikiTitle("en", c.wikiEn) : await wikiSearch("en", c.en.place);
  if (LANG === "en") return en;
  // Thai: an explicit Thai title, else the English article's Thai language link, else (Thai edition) a Thai search.
  let th = c.wikiTh ? await wikiTitle("th", c.wikiTh) : null;
  if (!th && en && en.thTitle) th = await wikiTitle("th", en.thTitle);
  if (!th && !c.th) th = await wikiSearch("th", c.place.replace(/(^|\s)[อจ]\./g, " ").trim());
  if (th) return { ...th, img: th.img || (en && en.img) };
  return en ? { ...en, text: "", noTh: true } : null;
}
// The article's History section (or its full intro when there is none), trimmed at a sentence end.
const historyCache = {};
function wikiHistory(lang, title) {
  const k = lang + "|" + title;
  if (!historyCache[k]) {
    const url = `https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=extracts&explaintext=1&exsectionformat=wiki&redirects=1&titles=${encodeURIComponent(title)}`;
    historyCache[k] = fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(j => {
      const p = j && j.query && j.query.pages && Object.values(j.query.pages)[0];
      const full = (p && p.extract) || "";
      if (!full) return "";
      const parts = full.split(/\n(={2,})\s*(.+?)\s*\1\n/);
      // parts: [intro, "==", heading, text, "==", heading, text, ...]
      let out = "";
      for (let i = 1; i < parts.length; i += 3) {
        if (/^(history|historical background|background|ประวัติ|ความเป็นมา|ประวัติความเป็นมา)/i.test(parts[i + 1])) {
          const level = parts[i].length;
          out = parts[i + 2];
          for (let k2 = i + 3; k2 < parts.length && parts[k2].length > level; k2 += 3) out += "\n" + parts[k2 + 2];
          break;
        }
      }
      if (!out.trim()) out = parts[0];
      out = out.replace(/\n{2,}/g, "\n").trim();
      if (out.length > 1100) {
        const cut = out.slice(0, 1100);
        const end = Math.max(cut.lastIndexOf(". "), cut.lastIndexOf(".\n"), cut.lastIndexOf(" "), cut.lastIndexOf("\n"));
        out = cut.slice(0, end > 600 ? end + 1 : 1100).trim() + " …";
      }
      return out;
    }).catch(() => { delete historyCache[k]; return ""; });
  }
  return historyCache[k];
}
function revealExtras(card, c) {
  const tools = document.createElement("div"); tools.className = "actions";
  const zoomBtn = document.createElement("button"); zoomBtn.type = "button"; zoomBtn.className = "btn alt"; zoomBtn.textContent = rt("zoomReal");
  zoomBtn.onclick = () => { setSatellite(true); satBtn.textContent = rt("mapView"); map.flyTo([c.lat, c.lon], 17); document.querySelector(".mapwrap").scrollIntoView({ behavior: "smooth", block: "center" }); };
  const satBtn = document.createElement("button"); satBtn.type = "button"; satBtn.className = "btn alt"; satBtn.textContent = satOn ? rt("mapView") : rt("sat");
  satBtn.onclick = () => { setSatellite(!satOn); satBtn.textContent = satOn ? rt("mapView") : rt("sat"); };
  tools.append(zoomBtn, satBtn);
  const box = document.createElement("figure"); box.className = "wiki";
  const loading = document.createElement("figcaption"); loading.textContent = rt("wikiLoading");
  box.append(loading);
  card.append(tools, box);
  const forLang = LANG;
  wikiFor(c).then(w => {
    if (!box.isConnected || forLang !== LANG) return;
    box.replaceChildren();
    if (!w) { box.remove(); return; }
    if (w.img) { const img = document.createElement("img"); img.src = w.img; img.alt = w.title; img.loading = "lazy"; box.append(img); }
    const cap = document.createElement("figcaption");
    const h = document.createElement("b"); h.textContent = (w.noTh && c.histTh) ? (c.th ? c.th.place : c.place) : w.title;
    const p = document.createElement("span"); p.textContent = w.text ? " " + w.text : "";
    cap.append(h, p);
    if (w.url && /^https:\/\/[a-z]+\.wikipedia\.org\//.test(w.url)) {
      const a = document.createElement("a"); a.href = w.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = " " + rt("wikiMore");
      cap.append(a);
    }
    box.append(cap);
    // Thai reader with no Thai article: use the case's own Thai history, else the English one with a note.
    const histP = (w.noTh && c.histTh) ? Promise.resolve(c.histTh)
      : (typeof w.history === "string" ? Promise.resolve(w.history) : wikiHistory(w.lang || "en", w.title));
    histP.then(hist => {
      if (!hist || !box.isConnected || forLang !== LANG) return;
      const sec = document.createElement("section"); sec.className = "history";
      const hh = document.createElement("h3"); hh.textContent = rt("history");
      sec.append(hh);
      if (w.noTh && !c.histTh) { const note = document.createElement("p"); note.className = "note"; note.textContent = rt("noThai"); sec.append(note); }
      hist.split("\n").forEach(line => { if (line.trim()) { const para = document.createElement("p"); para.textContent = line.trim(); sec.append(para); } });
      box.append(sec);
    });
  });
}

// ---------- boot ----------
$("helpBtn").onclick = () => $("help").showModal();
applyStatic();
setupDay();
state = loadLocal() || state;
renderAll();
if (state.done) fitResult();
try { if (!state.g.length && !localStorage.getItem("pikadlap:seenHelpWorld")) { localStorage.setItem("pikadlap:seenHelpWorld", "1"); $("help").showModal(); } } catch (e) {}
</script>
